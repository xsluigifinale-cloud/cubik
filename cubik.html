<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUBIK · i tre cubi, cella per cella</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════════
   CUBIK — assegnare una giornata di servizi NCC.

   IL PROBLEMA: ogni sera bisogna decidere chi guida cosa domani. Le combinazioni
   sono decine di migliaia e la scelta giusta non è quasi mai quella ovvia.

   IL METODO: tre cubi. Un asse per le catene di servizi che stanno insieme, uno
   per gli autisti, uno per gli schemi veicolari. Ogni cella porta tre punteggi —
   quello che sente il CLIENTE, quello che costa al PARCO, quello che pesa
   all'AUTISTA — e ognuno parte da 100 e scende per i malus dichiarati.
   Una combinazione gioca solo se supera tutte e tre le soglie. Poi si sceglie
   l'insieme di catene che copre di più e somma di più.

   LA REGOLA: nessun coefficiente nascosto. Ogni numero che decide sta in
   Configurazione, e ogni numero mostrato è quello su cui l'algoritmo ha deciso
   davvero. Le tabelle veloci e il conto per esteso vengono confrontati cella per
   cella: se divergono, è un baco, e si vede.

   ────────────────────────────────────────────────────────────────────────────
   COME È FATTO, E PERCHÉ COSÌ

   MASSIMO VIGNELLI · il disegno.
   La mappa della metropolitana di New York del 1972 è ancora leggibile oggi:
   è l'effetto Lindy applicato alla grafica. «I don't like design that is
   fashionable, because fashion goes out of fashion.» Da qui: una griglia e
   tutto ci sta dentro; tre caratteri e basta; il colore è un segnale e non una
   decorazione — verde passa, ambra passa per poco, rosso no, blu si clicca;
   niente ombre, niente gradienti, niente angoli tondi. La gerarchia la fanno lo
   spazio e la dimensione.

   RICH HICKEY · il programma.
   «Simple Made Easy»: facile è quello che hai già sotto mano, semplice è quello
   che non è intrecciato con altro. Decomplecting — sciogliere le trecce — è il
   lavoro vero. Da qui: la categoria di un'area è scritta una volta sopra il
   gruppo e non ripetuta su ogni voce; un'azione principale, una sola, sempre
   nello stesso posto; ogni pagina dice cosa si fa lì, non come si chiama; un
   motore solo per tutte le tabelle, che così si comportano tutte allo stesso
   modo. Quello che si può togliere si toglie.

   Il file è autosufficiente: dati, criteri, calcolo e disegno stanno qui dentro.
   ══════════════════════════════════════════════════════════════════════════════ */
:root{
  /* ══ LA TAVOLOZZA · carta bianca, inchiostro blu ══
     Vignelli lavorava su carta, e la carta è bianca. Il fondo chiaro non è una moda: è il
     supporto su cui il testo si legge meglio e più a lungo, e su cui una tabella di numeri
     smette di brillare. Il blu è l'unico colore identitario — è quello dei link, dei titoli,
     della cosa selezionata — e resta un colore solo, sempre lo stesso, in tre intensità.
     Verde, ambra e rosso non sono decorazione: sono i tre esiti di una soglia, e non
     compaiono mai per altro. */
  --bg:#ffffff; --pan:#f6f7f9; --card:#ffffff; --line:#dfe3e8; --line2:#eef1f4;
  --ink:#11161c; --m1:#5a6673; --m2:#8a94a0;
  --blu:#1c4f9c; --blu2:#2f6fd0; --blu3:#eaf1fb;
  --ok:#1d7a4c; --wr:#9a6412; --er:#b3261e;
  --lk:var(--blu2);
  --sans:"Helvetica Neue",Helvetica,Arial,ui-sans-serif,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --u:8px;
  --gridw:30px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}

/* ── la colonna delle fasi ── */
#rail{width:212px;flex:0 0 212px;background:var(--pan);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow:auto;padding:calc(var(--u)*3) 0}
#rail h1{font:700 13px/1 var(--sans);letter-spacing:.36em;margin:0 0 2px calc(var(--u)*2.5);color:var(--blu)}
#rail .sub{font:11px/1.4 var(--serif);color:var(--m2);margin:0 0 calc(var(--u)*3) calc(var(--u)*2.5)}
#rail .sep{height:1px;background:var(--line);margin:calc(var(--u)*2) calc(var(--u)*2.5)}
.fase{display:block;width:100%;text-align:left;background:none;border:0;
  border-left:2px solid transparent;color:var(--m1);
  padding:calc(var(--u)*1.25) calc(var(--u)*2.5);cursor:pointer;font:inherit;font-size:13px}
.fase:hover{color:var(--ink)}
.fase.on{color:var(--blu);border-left-color:var(--blu);background:var(--blu3);font-weight:500}
.fase i{display:block;font:500 9.5px/1.4 var(--sans);font-style:normal;color:var(--m2);
  letter-spacing:.16em;text-transform:uppercase}
.fase b{font-weight:500}
.fase em{display:none}

/* ── il contenuto ── */
#main{flex:1;min-width:0;padding:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*12);max-width:1600px}
h2{font:400 27px/1.15 var(--sans);letter-spacing:-.02em;margin:0 0 var(--u);color:var(--blu)}
h2 span{display:block;font:14px/1.4 var(--serif);color:var(--m2);letter-spacing:0;margin-top:2px}
h3{font:600 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--blu);
  margin:calc(var(--u)*4) 0 calc(var(--u)*1.5)}
h3.sep{border-top:1px solid var(--line);padding-top:calc(var(--u)*2.5)}
h3:first-child{margin-top:0}
.intro,.nota,.legend{font-family:var(--serif);color:var(--m1);max-width:66ch}
.intro{font-size:15px;line-height:1.62;margin:0 0 calc(var(--u)*3)}
.nota{font-size:13.5px;line-height:1.6;color:var(--m2);margin:calc(var(--u)*1.5) 0 0}
.legend{font-size:12.5px;color:var(--m2);margin-top:var(--u)}

/* ── la griglia ── */
.card{background:var(--card);border:1px solid var(--line);padding:calc(var(--u)*2);
  margin-bottom:calc(var(--u)*2)}
.card.q-cli,.card.q-azi,.card.q-aut{border-top:3px solid var(--blu)}
.card>header{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:var(--u);margin-bottom:var(--u)}
.card>header h3{margin:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:calc(var(--u)*2)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:calc(var(--u)*2);
  margin-bottom:calc(var(--u)*2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:calc(var(--u)*2)}
.riga{display:flex;gap:var(--u);align-items:center;flex-wrap:wrap;margin-bottom:calc(var(--u)*1.5)}

/* ── i campi ── */
.lb{display:block;font:500 9.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--m2);margin-bottom:3px}
.u{font:11px var(--sans);color:var(--m2);margin-left:4px}
.par input,input[type=number]{width:76px;text-align:right;font-family:var(--mono)}
.par.inline{display:flex;align-items:center;gap:var(--u)}
.par.inline .lb{margin:0}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);
  color:var(--ink);border-radius:0;padding:5px 7px;font:13px var(--sans)}
input:hover,select:hover{border-color:var(--m2)}
textarea{width:100%;font:11px/1.5 var(--mono);resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blu2);box-shadow:0 0 0 2px var(--blu3)}
button.btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:0;
  padding:6px 14px;cursor:pointer;font:13px var(--sans)}
button.btn:hover{border-color:var(--blu2);color:var(--blu)}
button.btn.on{background:var(--blu);color:#fff;border-color:var(--blu)}
button.btn.on:hover{background:var(--blu2);color:#fff}
button.btn.mini{padding:3px 9px;font-size:11.5px}
#salvaBtn{width:100%;padding:7px}
#salvaBtn.on{background:var(--wr);border-color:var(--wr);color:#fff}
#salvaBtn.rotto{background:var(--er);border-color:var(--er);color:#fff;font-weight:600}

/* ── le tabelle ── */
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:600 9.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--m1);padding:var(--u) 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--pan)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.rt,th.rt{text-align:right}
table.crit td{padding:5px 10px}
table.crit td em{display:block;font:12px/1.4 var(--serif);color:var(--m2);font-style:normal;margin-top:1px}
table.crit tr.hd td{font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--blu);padding-top:calc(var(--u)*2);border-bottom:1px solid var(--line);background:var(--pan)}
table.crit tr.off{opacity:.4}
table.crit input{width:56px}
.lvl{display:inline-block;text-align:center;margin-left:6px}
.lvl em{display:block;font:9.5px var(--sans);font-style:normal;color:var(--m2);margin-bottom:2px}
.lvl input{width:48px}
table.mini{max-width:360px;margin-top:calc(var(--u)*2)}
table.mini input{width:64px}
.mut{color:var(--m2)} .xs{font-size:11px}
.ok{color:var(--ok)} .wr{color:var(--wr)} .er{color:var(--er)} .cy{color:var(--lk)} .vi{color:var(--lk)}
.card.warn{border-color:var(--wr)}
.warn{border:1px solid var(--wr);border-left-width:3px;background:#fdf8ef;
  padding:calc(var(--u)*1.5);margin-bottom:calc(var(--u)*2);font-family:var(--serif);font-size:13px}

/* ── i gradi: una parola, non un colore ── */
.g{font:500 10px/1 var(--sans);letter-spacing:.06em;padding:3px 6px;border:1px solid var(--line);
  display:inline-block;color:var(--m1)}
.g-luxury,.g-gold{color:var(--blu);border-color:var(--blu2);background:var(--blu3)}
.g-no{color:var(--m2);border-style:dotted}
.pill{display:inline-block;padding:1px 6px;font-size:10.5px;background:none;color:var(--m1);
  border:1px solid var(--line)}
.pill.b{border-color:var(--blu2);color:var(--blu);background:var(--blu3)}
.pill.g{border-color:var(--ok);color:var(--ok)}
.pill.r{border-color:var(--er);color:var(--er)}
.qtag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;margin-right:3px;
  border:1px solid var(--line);color:var(--m1)}

/* ── i numeri grandi ── */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:calc(var(--u)*3)}
.kpi div{background:var(--card);padding:calc(var(--u)*1.5) calc(var(--u)*2)}
.kpi b{color:var(--blu)}
.kpi i{display:block;font:500 9.5px/1.4 var(--sans);font-style:normal;letter-spacing:.14em;
  text-transform:uppercase;color:var(--m2)}
.kpi b{display:block;font:400 26px/1.2 var(--mono);letter-spacing:-.02em;margin-top:2px}
.kpi em{display:block;font:12px var(--serif);font-style:normal;color:var(--m2)}

/* ── le tabelle vive ── */
.tabv{border:1px solid var(--line);background:var(--card);margin-bottom:calc(var(--u)*2)}
.tabh{background:var(--pan)}
.tabh{display:flex;gap:var(--u);align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--m2)}
.tabbox{overflow:auto;max-height:74vh}
.tabbox thead th{position:sticky;top:0;background:var(--card);z-index:3;cursor:pointer;user-select:none}
.tabbox thead th:hover{color:var(--ink)}
.tabbox thead tr.filtri-r th{top:29px;z-index:2;padding:3px 5px;cursor:default;background:var(--pan)}
.tabbox thead tr.filtri-r input{width:100%;min-width:52px;font-size:11px;padding:2px 5px;
  border-color:transparent;text-transform:none;letter-spacing:normal;font-family:var(--sans)}
.tabbox thead tr.filtri-r input:not(:placeholder-shown){border-color:var(--blu2);color:var(--blu);background:var(--blu3)}
.tabbox th.cksel{width:26px;padding:4px 6px;position:sticky;left:0;background:var(--card);z-index:4}
.tabbox tbody th.cksel{z-index:1;font-weight:400}
.tabbox tbody tr.selta td,.tabbox tbody tr.selta th{background:var(--blu3);box-shadow:inset 3px 0 0 var(--blu2)}
.tabbox tbody tr:hover td{background:var(--blu3)}
.frc{font-style:normal;color:var(--blu2);margin-left:3px;font-size:9px}
.tabp{padding:7px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--m2)}
.lnk{color:var(--blu2);cursor:pointer;border-bottom:1px solid rgba(47,111,208,.35)}
.lnk:hover{color:var(--blu);border-bottom-color:var(--blu)}
.lnk.pill{border-bottom:0}

/* ── il cubo ── */
.slice{overflow:auto;border:1px solid var(--line);background:var(--card);max-height:70vh}
.slice th{background:var(--pan)}
.slice td.rw{background:var(--pan)}
.slice table{font-size:11.5px;width:auto;min-width:100%}
.slice th{position:sticky;top:0;background:var(--card);z-index:2}
.slice th.rw{left:0;z-index:3;min-width:150px}
.slice td.rw{position:sticky;left:0;background:var(--card);font-weight:500;white-space:nowrap;z-index:1;
  border-right:1px solid var(--line)}
.cell{width:var(--gridw);min-width:var(--gridw);text-align:center;padding:3px 2px;font-family:var(--mono);
  font-size:11px;cursor:pointer;border-right:1px solid var(--line2)}
.cell:hover{background:var(--blu3)}
.cell.x{color:var(--m2);opacity:.45}
.cell.lo{color:var(--er)} .cell.hi{color:var(--ok)} .cell.md{color:var(--wr)}
.cell.sel{outline:2px solid var(--blu);outline-offset:-2px;background:var(--blu3)}
.vhead{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;padding:6px 2px;color:var(--m1)}
.stack{perspective:1400px;padding:30px 10px 10px;overflow:auto}
.stack .lay{transform-style:preserve-3d;display:inline-block;margin-right:-58px;
  transform:rotateX(56deg) rotateZ(-45deg)}
.lay table{border-collapse:separate;border-spacing:1px}
.lay td{padding:0;width:11px;height:11px;border:0}
.legend i{display:inline-block;width:9px;height:9px;margin:0 4px 0 12px;vertical-align:-1px}

/* ── il pannello laterale ── */
#det{position:fixed;right:0;top:0;bottom:0;width:440px;background:var(--bg);
  border-left:1px solid var(--line);padding:calc(var(--u)*3);overflow:auto;
  transform:translateX(100%);transition:transform .16s;z-index:40;
  box-shadow:-1px 0 0 var(--line),-24px 0 48px rgba(17,22,28,.06)}
#det.on{transform:none}
#det h4{font:400 21px/1.2 var(--sans);margin:0 0 2px;color:var(--blu)}
#det .cls{position:absolute;right:14px;top:12px;cursor:pointer;color:var(--m2);font-size:18px}
.mal{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--line2);font-size:12.5px}
.mal em{font-style:normal;color:var(--m2);font-size:11.5px;display:block;font-family:var(--serif)}
.tot{display:flex;justify-content:space-between;padding-top:7px;font-size:13px;font-weight:500}
.tot b{font-family:var(--mono)}

/* ── i filtri e la barra ── */
.filtri{display:flex;gap:var(--u);align-items:center;flex-wrap:wrap;margin-bottom:var(--u);
  background:var(--card);border:1px solid var(--line);padding:10px}
.filtri select{font-size:12px;max-width:230px}
.filtri .fq{flex:1;min-width:240px}
.cubebar{display:flex;gap:var(--u);align-items:center;flex-wrap:wrap;margin-bottom:calc(var(--u)*1.5)}
.velo{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;
  justify-content:center;z-index:60}
.barra{width:min(460px,86vw);background:var(--card);border:1px solid var(--line);padding:calc(var(--u)*3)}
.brb{height:3px;background:var(--line);margin:var(--u) 0}
.brb i{display:block;height:100%;background:var(--blu);width:0;transition:width .2s}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:50;background:var(--pan);
  border:1px solid var(--line);overflow:hidden}
.sugg:empty{display:none}
.sug{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line2)}
.sug:last-child{border-bottom:0}
.sug:hover{background:var(--blu3)}
.sug b{display:block;font-weight:500}
.sug em{display:block;font-style:normal;font-size:11px;color:var(--m2)}
.sug.mut,.sug.er{cursor:default}
.sug.er:hover,.sug.mut:hover{background:none}

/* ══ Rich Hickey · «Simple Made Easy» ══
   Il programmatore che Taleb assumerebbe, e che con Vignelli dice la stessa cosa in due
   lingue diverse. Hickey distingue SEMPLICE da FACILE: facile è quello che hai già sotto
   mano, semplice è quello che non è intrecciato con altro. «Decomplecting» — sciogliere le
   trecce — è il lavoro vero.
   Qui: la categoria di un'area non si ripete su ogni voce, sta scritta una volta sopra il
   gruppo. Un'azione principale, una sola, sempre allo stesso posto. Ogni pagina dice cosa
   fare, non come si chiama. Quello che si può togliere si toglie. */
.salta{position:absolute;left:-9999px;top:0;background:var(--blu);color:#fff;padding:8px 14px;z-index:99}
.salta:focus{left:0}
:focus-visible{outline:2px solid var(--blu2);outline-offset:2px}
#rail .sub{font:12px/1.4 var(--serif);color:var(--m2);margin:0 0 calc(var(--u)*2) calc(var(--u)*2.5)}
#rail .primo{width:calc(100% - var(--u)*5);margin:0 calc(var(--u)*2.5) calc(var(--u)*3)}
#rail .sez{font:500 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--m2);
  margin:calc(var(--u)*2.5) calc(var(--u)*2.5) var(--u);padding-top:calc(var(--u)*1.5);
  border-top:1px solid var(--line)}
#rail .sez:first-of-type{border-top:0;padding-top:0}
.fase{display:flex;gap:10px;align-items:baseline;padding:6px calc(var(--u)*2.5)}
.fase i{font:400 10px/1 var(--mono);font-style:normal;color:var(--m2);width:8px}
.fase.on i{color:var(--blu2)}
#rail .piede{padding:calc(var(--u)*3) calc(var(--u)*2.5) 0;margin-top:calc(var(--u)*3);
  border-top:1px solid var(--line)}
#rail .piede .btn{width:100%}
#rail .piede .riga .btn{width:auto;flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid var(--m2);
  vertical-align:0;cursor:help}
.zc{display:flex;gap:7px;align-items:baseline;padding:5px 8px;border:1px solid var(--line);
  margin-bottom:4px;cursor:pointer;font-size:12.5px}
.zc.on{border-color:var(--blu2);background:var(--blu3)}
.zc input{margin:0}
.cal{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-bottom:calc(var(--u)*3)}
.cal .btn.mini{align-self:center}
.gg{background:var(--bg);border:1px solid var(--line);padding:4px 9px;cursor:pointer;
  font:inherit;text-align:center;min-width:44px;line-height:1.25}
.gg i{display:block;font:500 9px/1 var(--sans);font-style:normal;letter-spacing:.1em;
  text-transform:uppercase;color:var(--m2)}
.gg b{display:block;font:400 17px/1.15 var(--mono)}
.gg em{display:block;font:10px/1 var(--mono);font-style:normal;color:var(--blu2);min-height:10px}
.gg.vuoto b{color:var(--m2)}
.gg:hover{border-color:var(--blu2)}
.gg.on{background:var(--blu);border-color:var(--blu);color:#fff}
.gg.on i,.gg.on em{color:rgba(255,255,255,.85)}
.cal input[type=date]{align-self:center;font-size:12.5px}
.rimedi{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:calc(var(--u)*2);align-items:start}
.rimedi .card{margin:0}
#rail{width:230px;flex:0 0 230px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:calc(var(--u)*2)}

/* ══════════════════ LE TRATTE VERE ══════════════════
   Finché km e minuti li scrivi a mano, il conto è tuo e va benissimo per provare. Ma la
   giornata vera la disegna la strada: quanto ci vuole davvero dall'aeroporto a Positano alle
   sette di mattina, e soprattutto quanto ci vuole per andare da dove finisci a dove devi
   cominciare. Quest'ultimo pezzo — il trasferimento a vuoto fra un servizio e l'altro — è
   quello che decide quali catene esistono davvero, e a mano non lo si indovina.

   Tre accortezze, e sono tutte e tre importanti.
   ① Ogni tratta si chiede UNA VOLTA e si tiene da parte. Senza questo, ricalcolare la giornata
      significa ricomprare le stesse risposte, e le chiamate si pagano.
   ② La chiave resta sul tuo computer, dentro il salvataggio del browser. Non esce di lì.
   ③ Da un file aperto da disco molte chiamate vengono rifiutate dal browser. Da localhost no:
      è un altro buon motivo per usare "avvia cubik.bat". */
let TRATTE={};                                       // "origine→destinazione" → {km, min, quando}
const CHIAVE_TR='cubik_v1_tratte';
function carTratte(){ try{ TRATTE=JSON.parse(localStorage.getItem(CHIAVE_TR)||'{}'); }catch(e){ TRATTE={}; } }
function salTratte(){
  try{ localStorage.setItem(CHIAVE_TR,JSON.stringify(TRATTE)); return true; }
  catch(e){ ERR_SALVA='le tratte non entrano più nella memoria del browser'; return false; }
}
/* ═══ LA CHIAVE DI UNA TRATTA È TUTTO IL PERCORSO ═══
   Prima erano solo partenza e arrivo. Ma un giro che parte da Napoli e torna a Napoli passando
   per Pompei e Trecase, e un altro che parte da Napoli e torna a Napoli passando per Caserta e
   Benevento, avevano LA STESSA CHIAVE: "napoli → napoli". Il secondo sovrascriveva il primo, e
   un tour da novanta chilometri se ne ritrovava quattrocento.
   Le tappe fanno parte del percorso, quindi fanno parte della chiave. */
const norm1=x=>String(x||'').trim().toLowerCase();
const chiaveTratta=(a,b,tappe)=>{
  const t=(tappe||[]).filter(Boolean).map(norm1);
  return norm1(a)+(t.length?' · '+t.join(' · ')+' · ':' → ')+norm1(b);
};

/* ═══ IL PALLINO ═══
   Verde: quel numero viene dalla strada, chiesto per l'ora esatta in cui il servizio parte —
   il traffico di quel momento è dentro. Giallo: viene dalla strada ma senza l'ora, quindi è
   una media buona per tutte le stagioni e non per quel giorno. Grigio: non è mai stato chiesto
   a nessuno, è il numero che hai scritto tu. */
/* le due tratte di rimessa sono note, o si sta usando il ripiego? */
function statoRimessa(s){
  const R=(CFG.rimessaInd||'').trim();
  if(!R)return{c:'er',p:'○',t:'nessun indirizzo di rimessa: valgono i '+CFG.rimessa+'′ di ripiego'};
  const a=tratta(R,s.da||s.dove), b=tratta(s.a||s.dove,R);
  if(a&&b)return{c:'ok',p:'●',t:'tutte e due dalla strada'};
  if(a||b)return{c:'wr',p:'◐',t:'una sola dalla strada, l\'altra è il ripiego'};
  return{c:'er',p:'○',t:'nessuna delle due: valgono i '+CFG.rimessa+'′ e i '+CFG.rimessaKm+' km di ripiego'};
}
/* L'ora del traffico è quella di partenza del servizio. Le tratte salvate prima portavano
   un'ora scritta in UTC — due ore indietro d'estate — e stamparla faceva credere che la
   richiesta fosse sbagliata. Non lo era: era la stampa. */
function statoDurata(s){
  const t=trattaSvc(s);
  if(!t)return{c:'mut',p:'○',t:'chilometri e minuti scritti a mano · il percorso non è mai stato chiesto'};
  if(t.traffico)return{c:'ok',p:'●',t:'da Google, col traffico delle '+s.ora};
  return{c:'wr',p:'●',t:'da Google, ma senza l\'ora di partenza: traffico medio'};
}
/* la tratta che ho già in casa, se c'è */
function tratta(a,b,tappe){ return TRATTE[chiaveTratta(a,b,tappe)]||null; }
/* la tratta di un servizio: il suo percorso intero, tappe comprese */
const trattaSvc=s=>s?tratta(s.da||s.dove,s.a||s.dove,(s.stops||[]).filter(Boolean)):null;

/* ═══ LA DOMANDA A GOOGLE ═══
   Si usa Routes API perché dà il tempo col traffico e risponde direttamente al browser.
   Una tratta alla volta: sono poche, e così un errore su una non fa cadere tutte le altre. */
async function chiediTratta(a,b,quando,tappe){
  const k=(CFG.apiKey||'').trim();
  if(!k)throw new Error('manca la chiave');
  const corpo={
    origin:{address:a}, destination:{address:b},
    travelMode:'DRIVE',
    routingPreference: quando?'TRAFFIC_AWARE':'TRAFFIC_UNAWARE',
    languageCode:'it-IT', units:'METRIC'
  };
  if(tappe&&tappe.length)corpo.intermediates=tappe.map(x=>({address:x}));
  if(quando)corpo.departureTime=quando;
  const r=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':k,
             'X-Goog-FieldMask':'routes.duration,routes.distanceMeters'},
    body:JSON.stringify(corpo)
  });
  if(!r.ok){
    let det=''; try{ const j=await r.json(); det=(j.error&&j.error.message)||''; }catch(e){}
    throw new Error('Google ha risposto '+r.status+(det?': '+det:''));
  }
  const j=await r.json();
  if(!j.routes||!j.routes.length)throw new Error('nessun percorso fra questi due punti');
  const rt=j.routes[0];
  /* L'ora da mostrare è quella dell'orologio in cucina, non quella di Greenwich. La richiesta
     a Google parte in UTC — è il formato che vuole lui, ed è giusta — ma prendere quelle cifre
     e stamparle era un errore: d'estate in Italia sono due ore indietro, e sembrava che il
     traffico venisse chiesto per le sette invece che per le nove. */
  const oraLoc=quando?(()=>{const d=new Date(quando);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');})():null;
  return{ km:Math.round((rt.distanceMeters||0)/100)/10,
          min:Math.round(parseInt(rt.duration||'0',10)/60),
          traffico:!!quando,                          // col traffico di quell'ora, o solo stimato
          ora:oraLoc,
          quando:new Date().toISOString().slice(0,16) };
}
/* un'ora del giorno, in formato buono per Google — sempre nel futuro, se no lo rifiuta */
function quandoISO(minuti){
  const d=new Date(); d.setSeconds(0,0);
  const m=((minuti%1440)+1440)%1440;
  d.setHours(Math.floor(m/60),m%60,0,0);
  if(d.getTime()<Date.now()+120000)d.setDate(d.getDate()+1);
  return d.toISOString();
}
const partenza=s=>quandoISO(t2m(s.ora));

/* ─────────────── QUELLO CHE SCRIVI RESTA ───────────────
   Tutto quanto sta qui sopra è solo il punto di partenza. Appena tocchi un dato, la scheda
   intera finisce nella memoria del browser e da lì in poi comanda quella. Il tasto in fondo
   alla colonna riporta tutto com'era. */
const CHIAVE='cubik_v1';
/* Da dove è stato aperto: cambia tutto per la memoria. Un file preso da disco è un'origine a
   sé — ogni copia un mondo separato, e certi browser non gli lasciano nemmeno tenere niente.
   Servito da localhost invece è un sito come un altro: la memoria è una sola e resta lì,
   qualunque copia del documento tu apra. */
const DA_LOCALHOST=/^https?:$/.test(location.protocol);
function memoriaViva(){
  try{ localStorage.setItem('cubik_prova','1'); localStorage.removeItem('cubik_prova'); return true; }
  catch(e){ return false; }
}
/* ═══ SALVARE NON PUÒ FALLIRE IN SILENZIO ═══
   Prima questo try/catch inghiottiva l'errore: se la memoria del browser era piena, o il file
   era aperto da disco e il browser rifiutava, il salvataggio non avveniva e nessuno lo diceva.
   Si continuava a lavorare convinti che fosse tutto a posto, e alla riapertura il lavoro non
   c'era più. Ora l'errore risale, e chi chiama decide che farne. */
let ULTIMO_SALVA=null, ERR_SALVA=null;

  try{ localStorage.setItem(CHIAVE,dati); ULTIMO_SALVA=new Date(); ERR_SALVA=null; return true; }
  catch(e){ ERR_SALVA=(e&&e.name==='QuotaExceededError')
      ? 'la memoria del browser è piena' : (e&&e.message)||'il browser ha rifiutato';
    return false; }
}
function carica(){

    if(j.AUTISTI)AUTISTI=j.AUTISTI; if(j.VEICOLI)VEICOLI=j.VEICOLI;

    if(j.BLOCCHI)BLOCCHI=j.BLOCCHI; if(j.STATI_CAL)STATI_CAL=j.STATI_CAL; if(j.LIMITI)LIMITI=j.LIMITI; if(j.SOGLIE_GG)SOGLIE_GG=j.SOGLIE_GG;
    if(j.CFG)ripristinaCfg(j.CFG);
    if(j.CRIT)ripristinaCrit(j.CRIT,j.CFG);

    return true;
  }catch(e){ return false; }
}

/* ═══ PORTARE I DATI DA UN FILE ALL'ALTRO ═══
   Il browser tiene la memoria separata per ogni file aperto da disco: due copie dello stesso
   documento, anche nella stessa cartella, per lui sono due mondi diversi. Quindi quello che
   scrivi qui resta finché usi QUESTO file, ma non passa da solo a una versione nuova.
   Il codice qui sotto è il travaso: una riga di testo che contiene tutto — autisti, veicoli,
   clienti, servizi, criteri, parametri. Si copia da una parte e si incolla dall'altra, e in
   un colpo la nuova copia sa tutto quello che sapeva la vecchia. */
function pacchetto(){
  const dati={AUTISTI,VEICOLI,CLIENTI,SERVIZI,ZONE,CFG,TRATTE,BLOCCHI,STATI_CAL,LIMITI,SOGLIE_GG,quando:new Date().toISOString(),
    CRIT:Object.fromEntries(Object.entries(CRIT).map(([k,c])=>[k,c.liv?{liv:c.liv}:{p:c.p}]))};
  try{ return 'CUBIK1:'+btoa(unescape(encodeURIComponent(JSON.stringify(dati)))); }
  catch(e){ return 'CUBIK0:'+JSON.stringify(dati); }
}
/* ══════════════════ IMPORTARE UNA LISTA DI PRENOTAZIONI ══════════════════
   Un file può essere due cose molto diverse: un backup di CUBIK — e allora dentro ci sono
   autisti, veicoli, criteri — oppure la lista dei servizi di una giornata, esportata da un
   foglio o da un altro gestionale, che è semplicemente una tabella di righe.
   Prima si riconosceva solo la prima, e della seconda non si diceva niente: nessun errore,
   nessun servizio, nessuna spiegazione. Il silenzio è la risposta peggiore.
   Le intestazioni cambiano da un foglio all'altro — "Cliente", "cliente", "CLIENTE", "Ditta" —
   quindi non si cercano parole esatte: si cerca cosa somiglia a cosa. */
const NORMH=x=>String(x||'').toLowerCase().replace(/[^a-z]/g,'');
const COLONNE={
  cli  :['cliente','ditta','committente','account'],
  pass :['passeggero','nominativo','nome','pax nome','guest'],
  daLoc:['partenza','dapartenza','localitapartenza','from','origine'],
  daInd:['indirizzo','indirizzopartenza','pickup','indirizzodipartenza'],
  aLoc :['arrivo','destinazione','localitaarrivo','to','dropoff'],
  aInd :['indirizzoarrivo','indirizzodiarrivo','indirizzodestinazione'],
  data :['datadipartenza','data','giorno','datapartenza'],
  ora  :['oradipartenza','ora','orario','orariopartenza'],
  volo :['volotreno','volo','treno','nave','volotrenonave'],
  note :['dettagliopreventivo','note','annotazioni','dettaglio'],
  tveh :['tipoveicolo','veicolo','mezzo','tipomezzo','categoria'],
  pax  :['posti','passeggeri','pax','npax','numeropasseggeri'],
  bag  :['bagagli','valigie','luggage','bag'],
  oraF :['orarientro','orafine','orariorientro','rientro'],
  prezzo:['prezzo','importo','tariffa','totale']
};
function mappaColonne(righe){
  const chiavi=Object.keys(righe[0]||{});
  const voti=[];
  for(const campo in COLONNE){
    const voci=COLONNE[campo];
    for(const k of chiavi){
      const n=NORMH(k);
      let p=-1;
      for(let i=0;i<voci.length;i++){ const v=NORMH(voci[i]);
        const q=(n===v)?100-i:(n.includes(v)||v.includes(n))?50-i:-1;
        if(q>p)p=q; }
      if(p>0)voti.push({campo,k,p});
    }
  }
  voti.sort((a,b)=>b.p-a.p);
  const m={}, presi=new Set();
  for(const v of voti){                       // una colonna serve un campo solo
    if(m[v.campo]||presi.has(v.k))continue;
    m[v.campo]=v.k; presi.add(v.k);
  }
  return m;
}
const pulisci=x=>String(x==null?'':x).replace(/\s+/g,' ').trim();
function dataITA(x){
  const t=pulisci(x);
  let m=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let a=+m[3]; if(a<100)a+=2000;
    return a+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  m=t.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
  return null;
}
function oraITA(x){
  const m=pulisci(x).match(/(\d{1,2})[:.](\d{2})/);
  return m?String(+m[1]).padStart(2,'0')+':'+m[2]:null;
}
/* dal testo del tipo veicolo si ricava la taglia; dai posti si corregge se non ci stanno */
function tagliaDa(testo,pax){
  const t=pulisci(testo).toLowerCase();
  let tv=null;
  if(/classe e|berlin|auto|sedan|classe s/.test(t))tv='Auto';
  else if(/classe v|vito|van|minivan|7 posti|8 posti/.test(t))tv='Minivan';
  else if(/sprinter|16|18/.test(t))tv='Sprinter';
  else if(/bus|pullman|gt/.test(t))tv='Bus M';
  const n=+pax||0;
  const minimo=n<=4?'Auto':n<=8?'Minivan':n<=18?'Sprinter':n<=30?'Bus M':n<=40?'Bus L':'Bus XL';
  if(!tv)return minimo;
  return (CLASSI[minimo]>CLASSI[tv])?minimo:tv;
}
function arrivoDa(testo){
  const t=pulisci(testo);
  if(!t)return{arrivo:'',rif:''};
  if(/treno|italo|frecc|ic\s|\bfr\d/i.test(t))return{arrivo:'treno',rif:t};
  if(/nave|traghett|jet|snav|caremar/i.test(t))return{arrivo:'nave',rif:t};
  return{arrivo:'volo',rif:t};                       // un codice qualunque è quasi sempre un volo
}
/* riconosce se un file è una lista di prenotazioni e la trasforma in servizi */
/* HD = mezza giornata, FD = giornata, "8H" = otto ore. Si legge solo dai campi
   del percorso e del veicolo: nelle note "LA VISITA DURA 2 H" parla della guida, non del turno. */
function oreDa(testo){
  const t=' '+String(testo||'').toUpperCase().replace(/[^A-Z0-9+]+/g,' ')+' ';
  const m=t.match(/ (\d{1,2}) ?H /);
  if(m){ const h=+m[1]; if(h>=1&&h<=14)return{ore:h,perche:m[1]+'H'}; }
  if(/ FD /.test(t))return{ore:+CFG.oreFD||8,perche:'FD'};
  if(/ HD /.test(t))return{ore:+CFG.oreHD||4,perche:'HD'};
  return null;
}
function importaPrenotazioni(righe){
  if(!Array.isArray(righe)||!righe.length||typeof righe[0]!=='object')return null;
  const m=mappaColonne(righe);
  if(!m.data&&!m.ora)return null;                    // senza un orario non è una giornata
  const nuovi=[], clienti=new Set(CLIENTI.map(c=>c.n)), avvisi=[];
  let n=0, saltate=0;
  for(const r of righe){
    const vuota=Object.keys(r).every(k=>!pulisci(r[k]));
    if(vuota)continue;                                 // riga bianca in coda al foglio
    const ora=oraITA(r[m.ora]);
    if(!ora){ saltate++; continue; }
    const data=dataITA(r[m.data])||GIORNO;
    const pax=Math.max(1,+pulisci(r[m.pax]).replace(',','.')||1);
    const cli=pulisci(r[m.cli])||'Senza cliente';
    if(!clienti.has(cli)){ CLIENTI.push({n:cli,prest:'—'}); clienti.add(cli); }
    const tvTesto=pulisci(r[m.tveh]);
    const tour=/tour|daily|visita|escursion/i.test(tvTesto+' '+pulisci(r[m.aLoc]));
    const daL=pulisci(r[m.daLoc]), daI=pulisci(r[m.daInd]);
    const aL =pulisci(r[m.aLoc]),  aI =pulisci(r[m.aInd]);
    const A=arrivoDa(r[m.volo]);
    let oraF=oraITA(r[m.oraF]);
    const D=oraF?null:oreDa(daI+' '+daL+' '+aL+' '+tvTesto);
    if(D)oraF=m2t(t2m(ora)+D.ore*60);
    const s={
      id:nuovoCodice(), data,
      tipo:tour?'tour':(oraF?'dis':'tra'),
      ora, oraF:oraF||(tour?'':''),
      dur:60, km:0,
      da:[daL,daI].filter(Boolean).join(', '),
      a:[aL,aI].filter(Boolean).join(', ')||[daL,daI].filter(Boolean).join(', '),
      dove:aL||daL, stops:[],
      cli, pass:pulisci(r[m.pass]),
      pax, bag:Math.max(0,+pulisci(r[m.bag])||0),
      tveh:tagliaDa(tvTesto,pax),
      lang:null, arrivo:A.arrivo, arrivoRif:A.rif,
      prezzo:+String(pulisci(r[m.prezzo])).replace(',','.')||0,
      note:pulisci(r[m.note])
    };
    if(D)avvisi.push(s.id+': '+D.perche+' → '+(tour?'tour':'disposizione')+' di '+D.ore+' ore, fine '+s.oraF);
    if(s.tipo!=='tra'&&!s.oraF){ s.oraF=m2t(t2m(ora)+(+CFG.oreTour||4)*60); avvisi.push(s.id+': niente durata, messe '+(+CFG.oreTour||4)+' ore'); }
    if(CAP[s.tveh]<pax)avvisi.push(s.id+': '+pax+' passeggeri non entrano in un '+s.tveh);
    SERVIZI.push(s); nuovi.push(s); n++;
  }
  if(saltate)avvisi.push(saltate+(saltate===1?' riga saltata':' righe saltate')+': senza orario di partenza');
  const ign=Object.keys(righe[0]||{}).filter(k=>!Object.values(m).includes(k)&&righe.some(r=>pulisci(r[k])));
  if(ign.length)avvisi.push('colonne non riconosciute, non importate: '+ign.join(', '));
  return{n,nuovi,avvisi,mappa:m,
         giorni:[...new Set(nuovi.map(s=>s.data))].sort()};
}

function apriPacchetto(txt){
  if(!txt)return 'non c\'è niente da leggere';
  txt=txt.trim();
  let j=null;
  try{
    if(txt.startsWith('CUBIK1:'))j=JSON.parse(decodeURIComponent(escape(atob(txt.slice(7)))));
    else if(txt.startsWith('CUBIK0:'))j=JSON.parse(txt.slice(7));
    else j=JSON.parse(txt);                          // va bene anche il file esportato, così com'è
  }catch(e){ return 'non riesco a leggerlo: controlla di aver copiato tutto'; }
  if(!j||typeof j!=='object')return 'il contenuto non è una configurazione';
  if(!j.AUTISTI&&!j.VEICOLI&&!j.SERVIZI)return 'dentro non ci sono né autisti né veicoli né servizi';
  if(j.AUTISTI)AUTISTI=j.AUTISTI; if(j.VEICOLI)VEICOLI=j.VEICOLI;
  if(j.CLIENTI)CLIENTI=j.CLIENTI; if(j.SERVIZI)SERVIZI=j.SERVIZI; if(j.ZONE)ZONE=j.ZONE;
  if(j.CFG)ripristinaCfg(j.CFG);
  if(j.CRIT)ripristinaCrit(j.CRIT,j.CFG);
  migra(); puliciBlocchi();
  /* le tratte costano chiamate vere: se il pacchetto le porta, si tengono */
  if(j.TRATTE&&typeof j.TRATTE==='object'){ Object.assign(TRATTE,j.TRATTE); salTratte(); }
  return null;
}
let DI_ESEMPIO=true;                                 // finché non si carica o non si tocca niente

/* ═══ LA SOLUZIONE TROVATA NON SI BUTTA VIA ═══
   Cercarla può volere minuti. Rifarla ogni volta che si passa da un'altra pagina, o si
   riapre il file, è tempo buttato — e la soluzione sarebbe la stessa, perché gli stessi dati
   danno lo stesso risultato. Quindi si tiene da parte, insieme a un'impronta di tutto ciò
   che potrebbe cambiarla: dati, criteri, soglia, parametri. Se l'impronta combacia si
   riprende quella; se qualcosa è cambiato si rifà, ed è giusto così. */
/* ═══ L'IMPRONTA DEVE CAMBIARE QUANDO CAMBIA QUALCOSA ═══
   Serviva a capire se la soluzione messa da parte vale ancora. Ma era fatta con la LUNGHEZZA
   del testo dei dati, non col testo: cambiare una soglia da 50 a 90, o un peso da 15 a 25,
   lasciava l'impronta identica — stessa lunghezza. Risultato: si ricaricava una soluzione
   vecchia, calcolata con altri numeri, e quella diceva "questo servizio non ha combinazioni
   sopra soglia" mentre il cubo, ricostruito coi numeri nuovi, ne mostrava parecchie.
   Adesso è una firma vera del contenuto: se cambia un carattere, cambia. */
function firma(txt){
  let h=0x811c9dc5;                                  // FNV-1a a 32 bit: corto, veloce, e cambia sempre
  for(let i=0;i<txt.length;i++){ h^=txt.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h.toString(36);
}
function impronta(){
  const crit=Object.entries(CRIT).map(([k,x])=>k+':'+(x.liv?x.liv.join('/'):x.p)+(x.spento?'x':'')).join('|');
  const tutto=JSON.stringify([AUTISTI,VEICOLI,CLIENTI,SERVIZI,ZONE,CFG,BLOCCHI,sogGG()])+'||'+crit+'||'+GIORNO+'||'+JSON.stringify(STATI_CAL);
  return firma(tutto)+'·'+tutto.length;
}
function salvaSol(S){
  try{
    if(!S||!S.best)return;
    localStorage.setItem(CHIAVE+'_sol_'+GIORNO,JSON.stringify({
      imp:impronta(), bestTot:S.bestTot, bestCop:S.bestCop, nodi:S.nodi, ms:S.ms,
      completo:S.completo, fermato:S.fermato, greedy:S.greedy, senzaStrada:S.senzaStrada,
      scoperti:S.scoperti, scelta:S.best.map(b=>[b.xi,b.yi,b.zi]),
      /* ═══ L'ASSEGNAZIONE SI RILEGGE ANCHE SENZA IL CUBO ═══
         Prima si salvavano solo le coordinate delle celle: per rileggerle bisognava ricostruire
         il cubo, e siccome il cubo non parte più da solo, riaprendo il programma non si vedeva
         più niente. Ora accanto alle coordinate si scrive anche il risultato in chiaro — chi,
         con che mezzo, su quali servizi, con che punteggi — e quello si legge subito. */
      ass:S.best.map(b=>({d:b.d.n,t:b.targhe.slice(),ids:b.cat.ids.slice(),
                          qc:b.qc,qa:b.qa,qu:b.qu,val:b.val,
                          vv:b.sch.vv.map(v=>v.t),cid:b.cat.id}))}));
  }catch(e){}
}
/* la sola lettura, senza toccare il cubo: serve a mostrare subito l'ultima assegnazione */
/* l'assegnazione salvata di UN giorno qualunque, non solo di quello aperto: serve al
   calendario, che di giorni ne guarda quindici alla volta */
function assegnazioneDi(iso){
  try{
    const j=JSON.parse(localStorage.getItem(CHIAVE+'_sol_'+iso)||'null');
    return (j&&j.ass&&j.ass.length)?j.ass:null;
  }catch(e){ return null; }
}
function ultimaAssegnazione(){
  try{
    const j=JSON.parse(localStorage.getItem(CHIAVE+'_sol_'+GIORNO)||'null');
    if(!j||!j.ass||!j.ass.length)return null;
    return{ass:j.ass, bestCop:j.bestCop, bestTot:j.bestTot, scoperti:j.scoperti||[],
           completo:j.completo, viva:j.imp===impronta(), quando:j.quando};
  }catch(e){ return null; }
}
function caricaSol(){
  try{
    const j=JSON.parse(localStorage.getItem(CHIAVE+'_sol_'+GIORNO)||'null');
    if(!j||j.imp!==impronta())return null;
    if(!CUBO)return null;                            // senza cubo si usa la lettura in chiaro
    const C=cubo();
    const best=j.scelta.map(([xi,yi,zi])=>{
      if(!C.X[xi]||!C.Z[xi]||!C.Z[xi][zi])return null;
      const c=cel(xi,yi,zi), sch=C.Z[xi][zi];
      return{xi,yi,zi,cat:C.X[xi],d:AUTISTI[yi],sch,targhe:sch.targhe,val:c.media,
             qc:c.qc,qa:c.qa,qu:c.qu};
    });
    if(best.some(b=>!b))return null;
    return{opz:opzioni(),best,bestTot:j.bestTot,bestCop:j.bestCop,nodi:j.nodi,ms:j.ms,
           completo:j.completo,fermato:j.fermato,greedy:j.greedy,senzaStrada:j.senzaStrada,
           scoperti:j.scoperti,ripresa:true};
  }catch(e){ return null; }
}

/* ─────────────── FUNZIONI DI BASE ─────────────── */
const t2m=s=>{const[a,b]=String(s).split(':').map(Number);return a*60+(b||0);};
const m2t=m=>String(Math.floor(((m%1440)+1440)%1440/60)).padStart(2,'0')+':'+String(Math.round(m)%60).padStart(2,'0');
/* Rimettere a posto una configurazione salvata prima. Due accortezze: le soglie una volta erano
   un numero solo e vanno aperte in tre, e i criteri spariti (Luxury non richiesto) non devono
   tornare in vita solo perché erano scritti nel salvataggio. */
/* ═══ RIMETTERE A POSTO I CRITERI SALVATI ═══
   Le cento risposte hanno rimesso in scala una ventina di pesi. Una configurazione salvata
   prima di quella ritaratura, ricaricata tale e quale, riporterebbe indietro proprio quei
   numeri — e il lavoro sarebbe stato inutile. Quindi: i criteri NON ritarati tornano come li
   avevi lasciati, quelli ritarati restano nuovi. Da qui in poi, tutto quello che tocchi a mano
   è tuo e nessuno ci mette più le mani. */
const RITARATI=['lang','bdg','vanB','cont','tveh','posti','qual','vipV','propr','simil',
                'scesa','corto','ore','oreN','nott','cambio','vuoto','zona','luxF','stretta','nottV'];
/* ═══════════════════ PORTARE AVANTI I DATI VECCHI ═══════════════════
   Il modello è cambiato: le fasce numeriche sono diventate gamme con un nome, i badge 1-2-3
   sono diventati gradi, il tipo "Bus" si è aperto in tre taglie. Chi ha dei dati salvati da
   prima non deve riscriverli: si traducono qui, una volta sola, e da quel momento sono nuovi.
   Tradurre non vuol dire indovinare: dove il vecchio non dice abbastanza si sceglie il valore
   neutro e lo si dichiara, invece di far finta che il dato ci fosse. */
const TIP_VECCHI={'Bus':'Bus M','Minibus':'Sprinter','Van':'Minivan'};
function migra(){
  let tocchi=0;
  VEICOLI.forEach(v=>{
    if(TIP_VECCHI[v.tip]){v.tip=TIP_VECCHI[v.tip];tocchi++;}
    if(!GAMME.includes(v.gamma)){
      /* i vecchi flag dicevano solo Luxury e VIP: il resto era una fascia calcolata che non
         esiste più. Chi non dice niente diventa Silver — il mezzo ordinario, non il peggiore. */
      v.gamma = v.lux?'Luxury' : v.vip?'Gold' : 'Silver';
      delete v.lux; delete v.vip; tocchi++;
    }
    if(v.lic!=null){delete v.lic;tocchi++;}          // la patente ora la dice il tipo
  });
  AUTISTI.forEach(d=>{
    if(d.b){                                        // i vecchi badge: 1 Gold, 2 Silver, 3 Bronze
      const G=n=>n===1?'Gold':n===2?'Silver':n===3?'Bronze':'—';
      d.lang=d.lang||{}; d.comp=d.comp||{};
      LINGUE.forEach(l=>{ if(d.b[l])d.lang[l]=G(d.b[l]); });
      if(d.b.VAN)d.comp.VAN=G(d.b.VAN);
      if(d.b.VIP&&!d.vip)d.vip=G(d.b.VIP);
      if(d.b.TOUR&&!d.cice)d.cice=G(d.b.TOUR);
      delete d.b; tocchi++;
    }
    d.lang=d.lang||{}; d.comp=d.comp||{};
    if(!GRADI.includes(d.vip))d.vip='—';
    if(!GRADI.includes(d.cice))d.cice='—';
    if(!d.lic||!d.lic.length)d.lic=['B'];
    if(d.fr!=null){delete d.fr;tocchi++;}            // la fascia numerica non esiste più
    if(d.gr!=null&&!GAMME.includes(d.gr))d.gr=null;
    if(d.ore!=null){delete d.ore;tocchi++;}          // l'orario è dell'azienda, non suo
    if(d.nottDa!=null){delete d.nottDa;delete d.nottA;tocchi++;}
    if(d.cal&&d.cal.stato!=null){delete d.cal.stato;tocchi++;}
    if(d.nott!=null){delete d.nott;tocchi++;}
  });
  CLIENTI.forEach(c=>{
    if(!PRESTIGI.includes(c.prest)){
      c.prest = c.tier===1?'Gold' : c.tier===2?'Silver' : c.tier===3?'Bronze' : '—';
      delete c.tier; tocchi++;
    }
  });
  SERVIZI.forEach(s=>{
    if(!s.data){s.data=DATA_ZERO;tocchi++;}
    if(TIP_VECCHI[s.tveh]){s.tveh=TIP_VECCHI[s.tveh];tocchi++;}
    if(!TIPI.includes(s.tveh))s.tveh='Auto';
    /* il tour era una spunta sulla disposizione: adesso è un tipo di servizio */
    if(s.tour&&s.tipo!=='tour'){s.tipo='tour';delete s.tour;tocchi++;}
    if(s.tipo==='trf')s.tipo='tra';
  });
  ZONE.forEach(z=>{ if(z.eur==null&&z.pt!=null){z.eur=z.pt;delete z.pt;tocchi++;} });
  return tocchi;
}

function ripristinaCrit(J,cfgSalvata){
  const vecchia=!(cfgSalvata&&+cfgSalvata.taratura>=2);
  for(const k in J){
    if(!CRIT[k])continue;
    if(vecchia&&RITARATI.includes(k))continue;
    if(J[k].liv)CRIT[k].liv=J[k].liv; else CRIT[k].p=J[k].p;
  }
}
function ripristinaCfg(c){
  c=Object.assign({},c);
  if(c.soglia!=null&&c.soglie==null)c.soglie={cli:c.soglia,azi:c.soglia,aut:c.soglia};
  delete c.soglia;
  if(c.soglie)c.soglie=Object.assign({cli:50,azi:50,aut:50},c.soglie);
  Object.assign(CFG,c);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n1=x=>Math.round(x*10)/10;
const veic=t=>VEICOLI.find(v=>v.t===t);
const aut =n=>AUTISTI.find(d=>d.n===n);
const clie=n=>CLIENTI.find(c=>c.n===n)||{n,prest:'—'};

/* ══════════════════ LA GIORNATA DI LAVORO ══════════════════
   I servizi non sono più "la giornata": ognuno ha la sua data, e il sistema lavora su un
   giorno alla volta. Cambiare giorno non è cambiare dati — è guardare un'altra pagina dello
   stesso registro. Tutto il resto (autisti, veicoli, criteri) resta com'è: quello non cambia
   da un giorno all'altro. */
const oggiISO=()=>{const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);};
let GIORNO='2026-08-08';                              // il giorno aperto
/* Un servizio senza data non appartiene al giorno che stai guardando: appartiene al giorno in
   cui è stato scritto. Farlo ricadere su GIORNO significava vederlo su tutti i giorni, e non
   era una comodità — era una bugia che moltiplicava la giornata per infinito. */
const DATA_ZERO='2026-08-08';                        // dove finisce chi una data non ce l'ha
const dataDi=s=>s.data||DATA_ZERO;
const spostaGiorno=n=>{const d=new Date(GIORNO+'T12:00:00'); d.setDate(d.getDate()+n);
  GIORNO=d.toISOString().slice(0,10); CUBO=null; SOL=null; SVC_CACHE=null;};
const GG=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MM=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto',
          'settembre','ottobre','novembre','dicembre'];
function dataLunga(iso){
  const d=new Date(iso+'T12:00:00');
  return GG[d.getDay()]+' '+d.getDate()+' '+MM[d.getMonth()]+' '+d.getFullYear();
}
/* i servizi del giorno che stai guardando: è QUESTO che vede tutto il resto del programma */
/* ═══ NON SI FILTRA MILLE VOLTE LA STESSA LISTA ═══
   servizi() finiva dentro i cicli del motore, e ogni chiamata riscorreva tutto l'archivio: su
   una giornata vera sono centinaia di migliaia di scansioni inutili, e si sentivano. Il
   risultato dipende da due sole cose — il giorno e l'archivio — quindi si calcola una volta e
   si tiene, finché una delle due non cambia. */
let SVC_CACHE=null, SVC_CHIAVE='';
function servizi(){
  const k=GIORNO+'|'+SERVIZI.length+'|'+(SERVIZI.length?SERVIZI[SERVIZI.length-1].id:'');
  if(SVC_CACHE&&SVC_CHIAVE===k)return SVC_CACHE;
  SVC_CHIAVE=k; SVC_CACHE=SERVIZI.filter(s=>dataDi(s)===GIORNO);
  return SVC_CACHE;
}
const scordaServizi=()=>{ SVC_CACHE=null; };
/* quanti ce ne sono in ogni giorno vicino, per la barra di navigazione */
function conteggioGiorni(quanti){
  const out=[];
  for(let k=-quanti;k<=quanti;k++){
    const d=new Date(GIORNO+'T12:00:00'); d.setDate(d.getDate()+k);
    const iso=d.toISOString().slice(0,10);
    out.push({iso,k,n:SERVIZI.filter(s=>dataDi(s)===iso).length});
  }
  return out;
}


/* ═══ LA GAMMA ═══
   Non si calcola più da marca, modello e anni: la scrivi tu sulla scheda del mezzo, perché sei
   tu a sapere che cosa vale quel mezzo davanti a un cliente. Cinque gradini, dal Luxury al
   Wood, e ogni criterio li legge per nome. */
const gamma=v=>GAMME.includes(v&&v.gamma)?v.gamma:'Wood';
/* la gamma di riferimento di un autista: quella dichiarata, o quella del suo mezzo */
/* Le gamme che un autista può avere come riferimento: il Luxury non ci sta. Non è il gradino
   più alto di una scala — è un'eccezione, un mezzo che esce quando lo chiedono e basta.
   Dire che un autista "è di fascia Luxury" non vuol dire niente. */
const GAMME_RIF=GAMME.filter(g=>g!=='Luxury');
/* ═══ LA CARATURA È UNA COSA, IL LUXURY UN'ALTRA ═══
   Il Luxury non è il gradino sopra il Gold: è un mezzo di tipo diverso, che esce quando lo
   chiedono. La caratura invece — quanto vale il mezzo rispetto al grado di chi lo guida — è la
   stessa: un autista Gold sul Luxury non sale di nessuna fascia, esattamente come sul Gold.
   Che il Luxury sia uscito senza richiesta lo dice un criterio suo, lo Spaccone, e che di
   notte sia il mezzo più rischioso lo dice il Pericolo notturno. Qui no. */
const caratura=g=>Math.max(0,GAMME_RIF.indexOf(g==='Luxury'?'Gold':g));
const gammaRif=d=>{
  if(GAMME_RIF.includes(d&&d.gr))return d.gr;
  const v=d&&d.va?veic(d.va):null;
  if(!v)return 'Silver';
  const g=gamma(v);
  return g==='Luxury'?'Gold':g;                      // chi guida il Luxury è di riferimento Gold
};
/* la competenza che quel mezzo richiede, e con che grado quell'autista ce l'ha */
const compDi=v=>COMP_DI[v&&v.tip]||null;
const gradoComp=(d,c)=>{ const g=d&&d.comp&&d.comp[c]; return GRADI.includes(g)?g:'—'; };

/* ═══ IL PERCORSO DI UN SERVIZIO ═══
   Partenza, eventuali tappe, arrivo. Il transfer di solito è due punti; la disposizione ne ha
   quante ne servono, ed è lì che le tappe contano — sia per i chilometri sia per capire da
   quali zone si passa. */
/* ═══ L'INDIRIZZO SI LEGGE, NON SI SUBISCE ═══
   Google restituisce righe lunghe — "Via Nuova Poggioreale 15, 80143 Napoli NA, Italia" — e in
   tabella rendono la colonna illeggibile. Qui si tiene la parte che serve a riconoscere il
   posto: il nome proprio se ce n'è uno, altrimenti il comune. Il resto sta nel campo e si vede
   aprendo il servizio. */
/* ═══ DOVE VA, NON DOVE TORNA ═══
   Su una disposizione l'informazione utile è l'itinerario: Napoli, Sorrento, Amalfi, Ravello.
   Che poi rientri a Napoli lo si sa — è quasi sempre così — e occupava mezza colonna per non
   dire niente. Quindi: le tappe si scrivono tutte, e il rientro si segna con un simbolo. */
function tornaDoveParte(s){
  const a=normaliz(s.da||''), b=normaliz(s.a||'');
  return !!(a&&b&&a===b);
}
function itinerario(s){
  const p=[luogo(s.da||s.dove)];
  for(const t of (s.stops||[]).filter(Boolean))p.push(luogo(t));
  if(!tornaDoveParte(s))p.push(luogo(s.a||s.dove));
  /* due tappe di fila con lo stesso nome non aggiungono niente */
  return p.filter((x,i)=>i===0||x!==p[i-1]);
}
/* ═══ LOCALITÀ E INDIRIZZO SONO DUE COSE ═══
   "Grand Hotel Parker's, Corso Vittorio Emanuele 135, 80121 Napoli NA" contiene due
   informazioni che si cercano in momenti diversi: dove si va — il comune, o il nome del posto
   — e dove esattamente. Si scrivono tutte e due, la prima in evidenza e la seconda sotto. */
function pezziIndirizzo(ind){
  let t=String(ind||'').trim();
  if(!t)return{loc:'',via:''};
  t=t.replace(/,\s*Italia\s*$/i,'').replace(/\b\d{5}\b/g,' ').replace(/\s{2,}/g,' ');
  const p=t.split(',').map(x=>x.trim()).filter(Boolean);
  if(!p.length)return{loc:'',via:''};
  if(p.length===1)return{loc:p[0].replace(/\s+[A-Z]{2}$/,''),via:''};
  const ultimo=p[p.length-1].replace(/\s+[A-Z]{2}$/,'').trim();
  const primo=p[0];
  /* se il primo pezzo è un nome proprio è LUI il posto, e il comune resta a fianco */
  const proprio=/aeroporto|hotel|albergo|stazione|porto|terminal|park|villa|grand|scavi|hilton|spa\b|srl|s\.p\.a|residence|resort/i.test(primo);
  if(proprio)return{loc:primo,via:p.slice(1).join(', ').replace(/\s+[A-Z]{2}$/,'').trim()};
  return{loc:ultimo,via:p.slice(0,-1).join(', ')};
}
function luogo(ind){
  let t=String(ind||'').trim();
  if(!t)return '—';
  t=t.replace(/,\s*Italia\s*$/i,'').replace(/\b\d{5}\b/g,' ');
  const pezzi=t.split(',').map(x=>x.trim()).filter(Boolean);
  if(!pezzi.length)return '—';
  const primo=pezzi[0];
  const proprio=pezzi.length===1||
    /aeroporto|hotel|albergo|stazione|porto|terminal|park|villa|grand|scavi|hilton|spa\b|srl/i.test(primo);
  const scelto=proprio?primo:pezzi[pezzi.length-1];
  return scelto.replace(/\s+[A-Z]{2}$/,'').replace(/\s{2,}/g,' ').trim();
}
const tappe=s=>[s.da,...((s.stops||[]).filter(Boolean)),s.a].filter(Boolean);
const percorso=s=>tappe(s).join(' · ');

/* ═══ QUANTO DURA ═══
   Il transfer dura quello che dice la strada. La disposizione dura quello che c'è scritto sul
   contratto: dalle nove alle cinque sono otto ore, che il traffico sia buono o cattivo. */
/* ═══ DUE MODI DI VENDERE, NON QUATTRO ═══
   Il TRANSFER va da un punto a un altro e dura quello che dice la strada.
   Tutto il resto — disposizione, tour, jolly — è tempo comprato: dalle dieci e mezza alle due
   e mezza sono quattro ore, e quattro ore restano.
   Questo controllo guardava solo 'dis'. Un tour finiva per valere il numero rimasto nel campo
   della durata invece delle sue ore vere, e un servizio da quattro ore ne contava cinquantotto
   minuti. Adesso il discrimine è uno solo, scritto una volta sola, e vale ovunque. */
const aTempo=s=>s&&s.tipo!=='tra';
function durata(s){
  if(aTempo(s)&&s.oraF){
    let d=t2m(s.oraF)-t2m(s.ora);
    if(d<=0)d+=1440;                                 // finisce dopo la mezzanotte
    return d;
  }
  return +s.dur||0;
}
/* ══════════════════ I TRE CALCOLI DELLA STRADA ══════════════════
   La stessa tratta si conta in tre modi diversi, e confonderli è il modo più rapido per
   costruire giornate che sulla carta tengono e alle sette di mattina no.

   ① IL SERVIZIO — il viaggio col cliente a bordo. Ci vanno tutti i buffer: il traffico, che è
      una percentuale della durata, e il ritardo, che è l'attesa dopo l'orario dichiarato.
   ② IL POSIZIONAMENTO — da dove finisci a dove ricominci, e le due tratte di rimessa. Qui va
      solo il buffer sul traffico: non c'è nessun volo da aspettare, non c'è nessun cliente.
   ③ L'AMPIEZZA — quanto è grande il servizio, in km e in ore, sull'arco rimessa-servizio-
      rimessa. Qui NON va nessun buffer: i buffer servono a far tornare le catene, non a dire
      quanto pesa un servizio. Un margine di sicurezza non rende un viaggio più lungo. */
const traff=min=>Math.round(min*(1+(+CFG.traffico||0)));

/* L'ANTICIPO sta prima dell'orario: l'autista è già lì col cartello. */
const anticipo=s=>{
  const suo=(s.anticipoMin===''||s.anticipoMin==null)?null:+s.anticipoMin;
  return suo!=null?suo:(+CFG.anticipo||0);
};
/* IL RITARDO sta dopo: il volo tocca terra e il passeggero esce mezz'ora dopo. Non si cumula:
   o vale quello del mezzo di arrivo, o vale il default del tipo di servizio. */
function ritardoBase(s){
  const R=CFG.ritardo||{};
  if(s.arrivo&&R[s.arrivo]!=null)return R[s.arrivo];
  return R[aTempo(s)?'dis':'tra']||0;
}
/* e si può comprimere fino al limite dichiarato, quando la giornata è stretta */
/* La compressione mangia SOLO il ritardo: quei minuti in cui l'autista sta fermo ad aspettare
   che il passeggero esca. Non tocca l'anticipo — quello serve a esserci prima — né il buffer
   sul traffico, che è la strada e non si comprime a tavolino. Il numero in Configurazione è
   il MASSIMO consentito: sotto quello non si scende mai. */
const ritardo=(s,q)=>{
  /* Su un servizio VIP non si stringe niente. Il rimpianto di far aspettare un VIP è massimo:
     l'attesa dichiarata è quella, e se due servizi entrano solo mangiandola, allora non
     entrano. */
  if(s&&s.vip)return ritardoBase(s);
  const f=q===true?(+CFG.comprMax||0):(typeof q==='number'?q:0);
  return Math.round(ritardoBase(s)*(1-f));
};
/* ═══ QUANTA COMPRESSIONE È SERVITA DAVVERO ═══
   Prima il criterio faceva pagare sempre il massimo: se il limite era il 25%, una catena che
   si incastrava stringendo di tre punti pagava come una che ne aveva stretti venticinque. È
   ingiusto e soprattutto è cieco — non distingue il quasi-niente dal quasi-limite. Adesso si
   cerca la compressione MINIMA che fa entrare i due servizi, e si paga quella. */
function comprNecessaria(s1,s2){
  if(s1.vip||s2.vip)return 0;                        // col VIP non si tratta
  const max=Math.round((+CFG.comprMax||0)*100);
  const sta=f=>{
    if(sovrappone(arcoRim(s1,f),arcoRim(s2,f)))return false;
    const [p,d]=arco(s1).da<=arco(s2).da?[s1,s2]:[s2,s1];
    const tr=trasferimento(p,d);
    if(tr==null)return true;
    return arco(p,f).a+tr<=arco(d,f).da;
  };
  if(sta(0))return 0;
  for(let pc=1;pc<=max;pc++) if(sta(pc/100))return pc;
  return max;
}

/* ── il tempo grezzo, così come lo dà la strada ── */
const durataGrezza=s=>{
  if(!aTempo(s)){ const t=trattaSvc(s); return t?t.min:(+s.dur||0); }
  return durata(s);
};
const rimessaMinGrezzi=(s,verso)=>{
  const R=(CFG.rimessaInd||'').trim();
  const t=R?(verso?tratta(R,s.da||s.dove):tratta(s.a||s.dove,R)):null;
  return t?t.min:(+CFG.rimessa||0);
};
const rimessaKmGrezzi=(s,verso)=>{
  const R=(CFG.rimessaInd||'').trim();
  const t=R?(verso?tratta(R,s.da||s.dove):tratta(s.a||s.dove,R)):null;
  return t?t.km:(+CFG.rimessaKm||0);
};
/* ① il servizio, coi buffer */
const durataServizio=s=>aTempo(s)?durata(s):traff(durataGrezza(s));
/* ② il posizionamento, col solo buffer sul traffico */
const rimessaVerso=s=>traff(rimessaMinGrezzi(s,1));
const rimessaDa   =s=>traff(rimessaMinGrezzi(s,0));
function trasferimento(s1,s2){
  if(!CFG.usaTrasf)return null;
  const t=tratta(s1.a||s1.dove,s2.da||s2.dove);
  return t?traff(t.min)+(+CFG.trasfMin||0):null;
}
/* ③ l'ampiezza, senza nessun buffer */
function arcoNetto(s){
  const min=rimessaMinGrezzi(s,1)+durataGrezza(s)+rimessaMinGrezzi(s,0);
  const km =rimessaKmGrezzi(s,1)+(+s.km||0)+rimessaKmGrezzi(s,0);
  return{min,km,ore:n1(min/60)};
}

/* ── le finestre che l'autista occupa davvero, e servono alle catene ── */
function arco(s,stretto){
  const a=t2m(s.ora);
  return{da:a-anticipo(s), a:a+ritardo(s,stretto)+durataServizio(s)};
}
const partenzaVera=(s,stretto)=>t2m(s.ora)+ritardo(s,stretto);
function arcoRim(s,stretto){
  const x=arco(s,stretto);
  return{da:x.da-rimessaVerso(s), a:x.a+rimessaDa(s)};
}

/* ═══ LA MAGGIORAZIONE ═══
   Quanto pesa sbagliare su QUESTO servizio invece che su un altro. Due pezzi che si SOMMANO:
   l'AMPIEZZA — quanto è grande il servizio, chilometri più ore dell'arco netto senza buffer —
   e il PRESTIGIO del cliente, una percentuale che si aggiunge.
   Si sommano e non si moltiplicano perché sono due ragioni diverse per cui un errore è più
   grave, e vanno tenute distinte: moltiplicando, un tour lungo per un cliente Gold arrivava a
   numeri che schiacciavano ogni criterio. Il totale moltiplica i malus di Qualità Cliente, e
   solo quelli. */
function maggiorazione(s){
  const A=arcoNetto(s);
  const amp=A.km*(+CFG.ampKm||0) + (A.min/60)*(+CFG.ampOra||0);
  const pr=(CFG.prestigio||{})[clie(s.cli).prest]||0;
  return{ore:n1(A.min/60), km:n1(A.km), amp:n1(amp), prest:pr, tot:n1(amp+pr)};
}
const fatt=s=>1+maggiorazione(s).tot/100;

/* punti di un criterio, dalla configurazione */
/* le etichette della scala di un criterio a livelli: i badge hanno i loro, il turno corto
   conta le ore dell'arco — rimessa, servizi, attese, rientro */
/* le etichette dei livelli: ogni criterio a fasce dice come si chiamano le sue */
const etLiv=(k,i)=>{
  const c=CRIT[k];
  if(c&&c.et)return c.et[i]||('liv. '+(i+1));
  if(k==='extra'){const F=CFG.extraFasce||[];return 'oltre il '+Math.round((F[i]||0)*100)+'%';}
  if(k==='corta'){const F=CFG.corteOre||[1,2,4];return 'meno di '+n1(F[i])+(F[i]===1?' ora':' ore');}
  return 'liv. '+(i+1);
};
const pt=(k,liv)=>{const c=CRIT[k];if(!c)return 0;
  if(c.liv)return c.liv[Math.min(liv==null?c.liv.length-1:liv,c.liv.length-1)]||0;
  return c.p||0;};

/* ═══ LE ZONE SI LEGGONO DAL PERCORSO ═══
   Non si spuntano più a mano: ogni zona dichiara i luoghi che la compongono, e un servizio la
   attraversa se uno di quei luoghi compare nei suoi indirizzi — partenza, tappe o arrivo.
   Resta la possibilità di aggiungerne una a mano, per i casi che il nome non racconta. */
function normaliz(t){
  return String(t||'').toLowerCase()
    .replace(/[àáâä]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
    .replace(/[òóôö]/g,'o').replace(/[ùúûü]/g,'u').replace(/['’`]/g,' ')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
/* ═══ LE ZONE SE LE TROVA DA SOLO ═══
   Gli indirizzi ce li hai già scritti: chiedere anche di spuntare a mano quali zone si toccano
   è far fare due volte lo stesso lavoro, e la seconda volta ci si dimentica. Quindi il sistema
   legge il percorso e propone; tu puoi aggiungerne una che lui non ha visto, o TOGLIERE una che
   ha visto per sbaglio — quello che togli resta tolto, e non gli torna addosso al prossimo giro. */
function zoneAuto(s){
  const testo=' '+normaliz(percorso(s)+' '+(s.dove||''))+' ';
  const trovate=[];
  for(const z of ZONE){
    const luoghi=String(z.luoghi||z.n).split(',').map(x=>normaliz(x)).filter(Boolean);
    if(luoghi.some(l=>testo.includes(' '+l+' ')||testo.includes(' '+l)))trovate.push(z.n);
  }
  return trovate;
}
function zoneDi(s){
  const via=new Set(s.zoneNo||[]);
  const out=zoneAuto(s).filter(n=>!via.has(n));
  for(const n of (s.zoneMan||[]))if(!out.includes(n))out.push(n);
  return out;
}

/* ═══ DUE SERVIZI POSSONO STARE INSIEME? ═══
   Prima si prova coi tempi pieni. Se non ci si sta, si riprova comprimendo il ritardo fino al
   limite dichiarato: sotto quello non si scende, perché quel che resta è il tempo che serve
   davvero. Se ci stanno solo stringendo, la catena lo porta scritto e lo paga. */
const sovrappone=(a,b)=>a.da<b.a&&b.da<a.a;
function conflitto(s1,s2){
  const prova=stretto=>{
    if(sovrappone(arcoRim(s1,stretto),arcoRim(s2,stretto)))return true;
    const [pri,dopo]=arco(s1).da<=arco(s2).da?[s1,s2]:[s2,s1];
    const tr=trasferimento(pri,dopo);
    if(tr==null)return false;
    return arco(pri,stretto).a+tr>arco(dopo,stretto).da;
  };
  return prova(false)&&prova(true);
}
const soloStretto=(s1,s2)=>{
  const largo=(()=>{ if(sovrappone(arcoRim(s1),arcoRim(s2)))return true;
    const [p,d]=arco(s1).da<=arco(s2).da?[s1,s2]:[s2,s1];
    const tr=trasferimento(p,d); if(tr==null)return false;
    return arco(p).a+tr>arco(d).da; })();
  return largo&&!conflitto(s1,s2);
};

/* ═══ IL PERMESSO SI PAGA SOLO SE SI POTEVA EVITARE ═══
   Un ticket d'ingresso, di per sé, non è un errore: se il cliente ha comprato quel mezzo ha
   comprato anche il permesso per portarcelo, e l'azienda incassa e paga. Diventa un errore
   solo quando quel permesso non c'era bisogno di pagarlo — quando in rimessa c'era un mezzo
   che poteva fare lo stesso servizio senza passare dalla cassa, e si è preso l'altro.
   È il rimpianto, non la spesa: e infatti quando non c'è alternativa il malus non scatta. */
function senzaPermesso(s,z){
  return VEICOLI.find(v=>!noVeicolo(s,v)&&!zonaOstile(s,v).some(x=>x.z.n===z.n));
}
/* ═══ COSA DICE UNA ZONA A UN MEZZO ═══
   Restituisce null se passa liscio, altrimenti la zona che lo ferma o che glielo fa pagare.
   Un limite a 0 vuol dire che quella zona su quella misura non ha niente da dire. */
function zonaOstile(s,v){
  const zs=zoneDi(s).map(n=>ZONE.find(z=>z.n===n)).filter(Boolean);
  const out=[];
  for(const z of zs){
    const rotti=[];
    if(z.lung >0&&(v.lung ||0)>z.lung ) rotti.push('lunghezza '+n1(v.lung)+' m oltre i '+n1(z.lung)+' m');
    if(z.larg >0&&(v.larg ||0)>z.larg ) rotti.push('larghezza '+n1(v.larg)+' m oltre i '+n1(z.larg)+' m');
    if(z.alt  >0&&(v.alt  ||0)>z.alt  ) rotti.push('altezza '+n1(v.alt)+' m oltre i '+n1(z.alt)+' m');
    if(z.peso >0&&(v.peso ||0)>z.peso ) rotti.push('peso '+n1(v.peso)+' t oltre le '+n1(z.peso)+' t');
    if(z.posti>0&&(v.px   ||0)>z.posti) rotti.push(v.px+' posti oltre i '+z.posti);
    if(rotti.length)out.push({z,rotti});
  }
  return out;
}
/* Il prezzo di un permesso, in euro. Prima stava in punti nel campo pt: le zone salvate da
   una configurazione vecchia lo hanno ancora lì, e quel numero era già di fatto degli euro. */
const eurZona=z=>+(z.eur!=null?z.eur:z.pt)||0;

/* ══════════════════ IL REGISTRO DELLA MAGGIORAZIONE ══════════════════
   Due conti che partono e finiscono in rimessa. Il TEMPO, senza nessun buffer, e la STRADA.
   L'ampiezza esce da lì: un margine di sicurezza non rende un viaggio più lungo. */
function pezziMagg(s){
  const R=(CFG.rimessaInd||'').trim();
  const tA=R?tratta(R,s.da||s.dove):null;
  const tB=R?tratta(s.a||s.dove,R):null;
  const tS=trattaSvc(s);
  const f=(t)=>t?{c:t.traffico?'ok':'wr',p:'●',t:'dalla strada'+(t.traffico?', col traffico':', senza ora')}
                :{c:'er',p:'○',t:'mai chiesta: vale il ripiego'};
  const P=[
    {k:'r1', t:'Rimessa → partenza', val:rimessaMinGrezzi(s,1),
     nota:tA?'dalla strada':'ripiego di '+CFG.rimessa+'′', fonte:f(tA)},
    {k:'sv', t:aTempo(s)?'Il tempo comprato':'Il viaggio', val:durataGrezza(s),
     nota:aTempo(s)?(s.oraF?'da contratto '+s.ora+'–'+s.oraF:'MANCA L\'ORA DI FINE')
                   :(tS?'dalla strada':'scritta a mano'),
     fonte:aTempo(s)?(s.oraF?{c:'mut',p:'·',t:'contrattuale'}
                            :{c:'er',p:'○',t:'senza ora di fine vale il campo durata: sistemalo'})
                   :f(tS)},
    {k:'r2', t:'Arrivo → rimessa', val:rimessaMinGrezzi(s,0),
     nota:tB?'dalla strada':'ripiego di '+CFG.rimessa+'′', fonte:f(tB)}
  ];
  const K=[
    {k:'r1', t:'Rimessa → partenza', val:rimessaKmGrezzi(s,1),
     nota:tA?'dalla strada':'ripiego di '+CFG.rimessaKm+' km', fonte:f(tA)},
    {k:'sv', t:'Il servizio', val:+s.km||0,
     nota:tS?'dalla strada':'scritti a mano', fonte:s.km?f(tS):{c:'er',p:'○',t:'nessun km dichiarato'}},
    {k:'r2', t:'Arrivo → rimessa', val:rimessaKmGrezzi(s,0),
     nota:tB?'dalla strada':'ripiego di '+CFG.rimessaKm+' km', fonte:f(tB)}
  ];
  const A=arcoNetto(s), m=maggiorazione(s);
  const minTot=P.reduce((x,y)=>x+y.val,0), kmTot=K.reduce((x,y)=>x+y.val,0);
  const quadra=Math.abs(minTot-A.min)<1 && Math.abs(kmTot-A.km)<0.1;
  /* e l'arco vero, quello coi buffer, che serve alle catene e non all'ampiezza */
  const r=arcoRim(s);
  const B=[
    {t:'Anticipo prima', val:anticipo(s)},
    {t:'Ritardo dopo', val:ritardo(s)},
    {t:'Buffer traffico sul servizio', val:durataServizio(s)-durataGrezza(s)},
    {t:'Buffer traffico sulla rimessa', val:(rimessaVerso(s)-rimessaMinGrezzi(s,1))+(rimessaDa(s)-rimessaMinGrezzi(s,0))}
  ];
  return{P,K,B,minTot,kmTot,m,quadra,r,
         ignote:[!tA&&'rimessa → partenza',!tS&&'il servizio',!tB&&'arrivo → rimessa'].filter(Boolean)};
}

/* che cosa chiede un servizio, in chiaro */
/* ═══ OGNI RICHIESTA HA IL SUO COLORE ═══
   Le lingue sono cose neutre e si distinguono fra loro senza gridare: cinque tinte spente, una
   per lingua. Il Cicerone è rosso mattone perché è un mestiere, non una spunta. Il VIP è oro,
   ed è l'unico che deve saltare all'occhio da tre metri. */
const COL_BADGE={
  EN:['#eef2f7','#b4c4d6','#3f5d80'], FR:['#eef0f8','#bcc0dd','#4b4f86'],
  ES:['#f7f0ec','#dcc2b2','#8a5537'], DE:['#f1f3ef','#c3cbbc','#4f5f45'],
  GR:['#ecf4f4','#b3d0d0','#39696a'], RU:['#f5eff2','#d5bfc8','#7a4a5c'],
  AR:['#f4f2ea','#cfc7ad','#6b6038'], ZH:['#f2eff5','#cabfd6','#5c4a72'],
  Cicerone:['#f9ecea','#dda99f','#9c3b2c'],
  VIP:['#fdf4dd','#d9b449','#7a5a06'],
  Luxury:['#f4f1ea','#c9bb96','#6b5d31']
};
function badge(x){
  const k=x.replace(/^lingua\s+/,'');
  const c=COL_BADGE[k]||COL_BADGE[x];
  const et=x.replace(/^lingua\s+/,'');
  if(!c)return `<span class="pill">${esc(et)}</span>`;
  return `<span class="bg" style="background:${c[0]};border-color:${c[1]};color:${c[2]}"
    title="${esc(x)}">${esc(et)}</span>`;
}
const reqDi=s=>[s.lang&&('lingua '+s.lang),s.vip&&'VIP',s.tipo==='tour'&&'Cicerone',
                s.lux&&'Luxury'].filter(Boolean);
function fase0(){
  const autisti=AUTISTI.map(d=>{
    const c=d.cal||{};
    const fuori=c.stato||null;
    return{d,fuori,da:fuori?null:t2m(c.da||'00:00'),a:fuori?null:t2m(c.a||'23:59'),
           mezzo:d.va?veic(d.va):null,rif:gammaRif(d)};
  });
  const veicoli=VEICOLI.map(v=>({v,fermo:v.fermo||null,gam:gamma(v)}));
  const svc=servizi().map(s=>({s,arco:arco(s),rim:arcoRim(s),mag:maggiorazione(s),
                                 comp:reqDi(s)}));
  const conflitti=[];
  const SV=servizi();
  for(let i=0;i<SV.length;i++)for(let j=i+1;j<SV.length;j++)
    if(conflitto(SV[i],SV[j]))conflitti.push([SV[i].id,SV[j].id]);
  return{autisti,veicoli,servizi:svc,conflitti};
}

/* ══════════════════ FASE 1 · LE CATENE (asse X) ══════════════════
   Una catena è un gruppo di servizi che una sola persona, con un solo mezzo, può fare
   nella stessa giornata: nessuna sovrapposizione, rimessa compresa. Si generano tutte,
   fino alla lunghezza massima impostata. Poi, per ogni catena, si popolano gli assi Y e Z
   con tutte le coppie autista-veicolo che i vincoli fissi lasciano in piedi. */
/* quante catene verrebbero fuori, senza costruirle: serve ad avvisare prima di partire */
function quanteCatene(){
  const S=SERVIZI; let n=0;
  const cresci=(base,daIdx)=>{
    if(base.length)n++;
    if((CFG.maxCat>0&&base.length>=CFG.maxCat)||n>200000)return;
    for(let i=daIdx;i<S.length;i++)
      if(base.every(g=>!conflitto(g,S[i]))){ base.push(S[i]); cresci(base,i+1); base.pop(); }
  };
  cresci([],0); return n;
}
function catene(){
  const S=servizi(), out=[];
  const compat=(gruppo,s)=>gruppo.every(g=>!conflitto(g,s));
  const cresci=(base,daIdx)=>{
    if(base.length)out.push(base.slice());
    if(CFG.maxCat>0&&base.length>=CFG.maxCat)return;
    for(let i=daIdx;i<S.length;i++)
      if(compat(base,S[i])){ base.push(S[i]); cresci(base,i+1); base.pop(); }
  };
  cresci([],0);
  return out.map((g,i)=>{
    g.sort((a,b)=>t2m(a.ora)-t2m(b.ora));
    const da=Math.min(...g.map(s=>arcoRim(s).da)), a=Math.max(...g.map(s=>arcoRim(s).a));
    /* tutto quello su cui si può cercare a mano libera, in una stringa sola */
    const cerca=('X'+(i+1)+' '+g.map(s=>[s.id,s.ora,s.cli,s.pass,s.dove,s.tveh,s.lang,
      s.tipo,s.vip?'vip':'',s.lux?'luxury':''].filter(Boolean).join(' ')).join(' ')).toLowerCase();
    /* la catena tiene solo stringendo? se sì lo porta scritto, e il criterio Compressione lo paga */
    let stretta=0;
    for(let k=1;k<g.length;k++){
      const pc=comprNecessaria(g[k-1],g[k]);
      if(pc>stretta)stretta=pc;                      // si paga la stretta peggiore della catena
    }
    return{i,id:'X'+(i+1),svc:g,ids:g.map(s=>s.id),da,a,arcoMin:a-da,cerca,stretta,
           km:g.reduce((x,s)=>x+s.km,0),pax:Math.max(...g.map(s=>s.pax)),
           bag:Math.max(...g.map(s=>s.bag||0)),
           taglia:g.reduce((x,s)=>Math.max(x,CLASSI[s.tveh]||0),0),
           vip:g.some(s=>s.vip),lux:g.some(s=>s.lux)};
  });
}

/* ── un mezzo può fare QUESTO servizio? sono i vincoli fissi, e si dice quale ── */
/* ═══ QUANDO UN MEZZO NON PUÒ PROPRIO ═══
   Non è questione di prezzo: sono le cose che non si fanno. I passeggeri che non ci stanno, i
   bagagli che non entrano, un mezzo più piccolo di quello venduto, una strada dove quel mezzo
   non passa, un Luxury chiesto e non dato. */
function noVeicolo(s,v){
  if(v.fermo)return 'in officina ('+v.fermo+')';
  for(const {z,rotti} of zonaOstile(s,v))
    if(z.modo==='divieto')return z.n+': '+rotti[0];
  if(s.pax>v.px)return v.px+' posti per '+s.pax+' passeggeri';
  if((s.bag||0)>(v.bg==null?99:v.bg))return v.bg+' bagagli per '+s.bag;
  if((CLASSI[v.tip]||0)<(CLASSI[s.tveh]||0))return 'è un '+v.tip+', più piccolo del '+s.tveh+' venduto';
  if(s.lux&&gamma(v)!=='Luxury')return 'il cliente ha chiesto Luxury';
  return null;
}

/* ══════════ LO SCHEMA VEICOLARE (asse Z) ══════════
   L'asse Z non è un mezzo: è come i mezzi si distribuiscono lungo la catena. Quasi sempre è
   uno solo, dall'inizio alla fine. Ma un servizio può chiedere una cosa che gli altri non
   chiedono — una Luxury per il VIP delle cinque — e allora tenere quel mezzo per tutta la
   giornata è uno spreco, mentre spezzare la catena è un peccato. Il cambio di mezzo è la
   terza via: costa, perché c'è il criterio apposta, e si prende solo se rende.
   Gli schemi con cambio si generano SOLO dove servono: quando i servizi della catena non
   chiedono tutti le stesse cose, o quando nessun mezzo da solo le regge tutte. Altrove
   sarebbero rami inutili, e i rami inutili si pagano in tempo di calcolo. */
function schemi(cat){
  const K=cat.svc.length;
  const amm=cat.svc.map(s=>VEICOLI.filter(v=>!noVeicolo(s,v)));
  const chiavi=amm.map(l=>l.map(v=>v.t).sort().join(','));
  const out=[];
  /* uno solo per tutta la catena: la strada normale */
  for(const v of VEICOLI) if(amm.every(l=>l.includes(v))) out.push({vv:cat.svc.map(()=>v),cambi:0});
  /* servono i cambi? solo se i servizi non chiedono tutti la stessa cosa */
  /* ═══ IL CAMBIO VEICOLO ESISTEVA MA NON ENTRAVA MAI ═══
     Gli schemi con un mezzo solo si prendevano tutto il posto: con dieci mezzi ammissibili la
     lista era già lunga dieci, e ai cambi restava un posto negativo — cioè nessuno. L'asse Z
     smetteva di essere "le catene veicolari" e tornava a essere "un mezzo per catena", e i
     servizi che si coprono solo cambiando mezzo restavano scoperti.
     Adesso i cambi hanno un posto riservato: qualunque cosa succeda ai mezzi singoli, i cambi
     entrano lo stesso. */
  const eterogenea=chiavi.some(k=>k!==chiavi[0]);
  const stacchi=[]; for(let p=1;p<K;p++)stacchi.push(arco(cat.svc[p]).da-arco(cat.svc[p-1]).a);
  const largo=stacchi.some(x=>x>=CFG.cambioMin*2);
  /* I mezzi singoli sono l'ossatura: ce ne sono quanti ne ammette il servizio, e tagliarli a
     sei — come avevo fatto per far posto ai cambi — significa buttare via otto modi buoni di
     coprire un servizio per guadagnarne quattro strani. I cambi si aggiungono, non
     sostituiscono. */
  if(K>1&&(eterogenea||largo||!out.length)){
    const doppi=[];
    for(let p=1;p<K;p++){
      /* fra un servizio e l'altro ci vuole il tempo di riportare un mezzo e prenderne un altro */
      const stacco=arco(cat.svc[p]).da-arco(cat.svc[p-1]).a;
      if(stacco<CFG.cambioMin)continue;
      const A=VEICOLI.filter(v=>amm.slice(0,p).every(l=>l.includes(v)));
      const B=VEICOLI.filter(v=>amm.slice(p).every(l=>l.includes(v)));
      for(const a of A)for(const b of B){
        if(a.t===b.t)continue;
        doppi.push({vv:cat.svc.map((s,i)=>i<p?a:b),cambi:1,taglio:p,stacco});
      }
    }
    /* se sono tanti si tengono i primi, e chi mette in strada un mezzo di qualcuno viene prima */
    const suo=v=>AUTISTI.some(d=>d.va===v.t)?1:0;
    doppi.sort((x,y)=>(suo(y.vv[0])+suo(y.vv[y.vv.length-1]))-(suo(x.vv[0])+suo(x.vv[x.vv.length-1])));
    out.push(...doppi.slice(0,Math.max(1,+CFG.maxCambi||4)));
  }
  return out.map((s,i)=>{
    const targhe=[]; s.vv.forEach(v=>{ if(!targhe.includes(v.t))targhe.push(v.t); });
    return Object.assign({},s,{i,id:targhe.join(' → '),targhe});
  });
}

/* ── quello che ferma una cella intera: patente, calendario, finestra ── */
/* ═══ IL LUXURY NON SI PRESTA ═══
   Era un malus da venti punti a fascia, e come tutti i malus si poteva pagare: bastava che il
   resto della combinazione fosse buono abbastanza e il mezzo di pregio finiva in mano a un
   terza fascia. Ma questa non è una cosa che si compra con dei punti — è una cosa che non si
   fa, come la patente sbagliata. Quindi è passata dove stanno i divieti. Resta comunque
   spegnibile in Configurazione, perché è una politica aziendale e non una legge dello Stato. */
/* ═══ QUANDO UNA COMBINAZIONE È IMPOSSIBILE ═══
   Il calendario, la patente, e il tetto del turno. La patente è la legge: B per auto e minivan,
   D per sprinter e bus. La competenza veicolare invece NON sta qui — quella è una preferenza
   aziendale, costa cara e si paga. */
/* ══════════════════ LE ASSEGNAZIONI BLOCCATE ══════════════════
   A un certo punto una decisione la prendi tu: questo servizio lo fa Esposito, e non si
   discute. Da quel momento non è più una preferenza da pesare, è un dato — come una patente.
   Ma la cella resta DENTRO il cubo, coi suoi punteggi e i suoi malus in chiaro: bloccare non
   vuol dire smettere di guardare. Quello che cambia è che tutte le combinazioni che
   contraddicono il blocco diventano impossibili, e lo dicono.
   Un blocco su un servizio impegna anche altrove: se Esposito deve fare s5, allora Esposito
   non è disponibile per nessuna catena che s5 non lo contenga. Vale uguale per i mezzi. */
let BLOCCHI={};
const bloccoDi=id=>BLOCCHI[id]||null;
function blocca(id,chi,cosa){
  const b=BLOCCHI[id]||(BLOCCHI[id]={});
  if(cosa==='aut'||cosa==='due')b.aut=chi.aut;
  if(cosa==='veh'||cosa==='due')b.veh=chi.veh;
  CUBO=null; SOL=null;
}
function sblocca(id,cosa){
  const b=BLOCCHI[id]; if(!b)return;
  if(cosa==='aut'||cosa==='tutto')delete b.aut;
  if(cosa==='veh'||cosa==='tutto')delete b.veh;
  if(!b.aut&&!b.veh)delete BLOCCHI[id];
  CUBO=null; SOL=null;
}
/* Un blocco vale per il servizio su cui è stato messo. Se quel servizio è stato spostato di
   giorno, cancellato, o non è mai esistito, il blocco è un residuo: contarlo faceva dire
   "tre decisi a mano" su una giornata dove non c'era niente di deciso. */
function puliciBlocchi(){
  let via=0;
  for(const id in BLOCCHI){
    const b=BLOCCHI[id];
    /* un blocco senza né autista né mezzo non blocca niente: è un guscio rimasto lì */
    if(!b||(!b.aut&&!b.veh)){ delete BLOCCHI[id]; via++; continue; }
    if(!SERVIZI.some(s=>s.id===id)){ delete BLOCCHI[id]; via++; continue; }
    /* e un blocco che nomina un autista o un mezzo che non esiste più è altrettanto morto */
    if(b.aut&&!AUTISTI.some(d=>d.n===b.aut))delete b.aut;
    if(b.veh&&!VEICOLI.some(v=>v.t===b.veh))delete b.veh;
    if(!b.aut&&!b.veh){ delete BLOCCHI[id]; via++; }
  }
  return via;
}
/* quali sono, in chiaro: un numero senza nomi non si può controllare */
function elencoBlocchi(){
  const ids=new Set(servizi().map(s=>s.id));
  return Object.keys(BLOCCHI).filter(id=>ids.has(id))
    .map(id=>id+' → '+[BLOCCHI[id].aut,BLOCCHI[id].veh].filter(Boolean).join(' · '));
}
const nBlocchi=()=>{ const ids=new Set(servizi().map(s=>s.id));
  return Object.keys(BLOCCHI).filter(id=>ids.has(id)).length; };
/* che cosa dice un blocco a questa cella: null se la lascia passare */
function controBlocco(cat,d,sch){
  const dentro=new Set(cat.ids);
  /* ① i servizi di QUESTA catena devono rispettare il loro blocco */
  for(let i=0;i<cat.svc.length;i++){
    const b=BLOCCHI[cat.svc[i].id]; if(!b)continue;
    if(b.aut&&b.aut!==d.n)return cat.svc[i].id+' è bloccato su '+b.aut;
    if(b.veh){ const v=sch.vv[i]; if(!v||v.t!==b.veh)return cat.svc[i].id+' è bloccato sul mezzo '+b.veh; }
  }
  /* ② chi è impegnato da un blocco altrove non è disponibile qui */
  for(const id in BLOCCHI){
    if(dentro.has(id))continue;
    const b=BLOCCHI[id];
    if(b.aut===d.n)return d.n+' è bloccato su '+id;
    if(b.veh&&sch.targhe.includes(b.veh))return b.veh+' è bloccato su '+id;
  }
  return null;
}

function bloccante(cat,d,sch){
  const cb=nBlocchi()?controBlocco(cat,d,sch):null;
  if(cb)return cb;
  const sc=statoCal(d.n,GIORNO);
  if(sc){const x=CAL_ST.find(y=>y[0]===sc); return d.n+' è in '+(x?x[1]:sc)+' oggi';}
  const c=d.cal||{};
  if(c.stato)return 'autista in '+c.stato;
  const da=t2m(c.da||'00:00'), a=t2m(c.a||'23:59');
