/* ══════════════════════════ LE TABELLE VIVE ══════════════════════════
   Una tabella non è un foglio stampato: è il posto dove si cerca. Quindi ognuna, ovunque
   stia, sa fare le stesse cose e le sa fare allo stesso modo — così non c'è niente da
   imparare due volte.
     · clic sull'intestazione        ordina · un altro clic rovescia · il terzo toglie
     · MAIUSC + clic                 aggiunge un secondo, un terzo ordinamento
     · la riga sotto le intestazioni filtra, colonna per colonna, mentre scrivi
     · doppio clic su una riga       apre la scheda di quella cosa
     · le celle azzurre              portano dove quella cosa è definita
   Lo stato di ogni tabella resta suo: se ordini gli autisti per fascia e poi vai altrove e
   torni, li ritrovi come li avevi lasciati. */
const VIS={}, VIS_APRI={};                           // stato e apertura di ogni tabella, per nome
function statoTab(id){
  if(!VIS[id])VIS[id]={ord:[],fil:{},sel:new Set(),aperti:false,tocca:0};
  return VIS[id];
}
/* il valore su cui si ordina e si filtra: sempre una cosa semplice, mai HTML */
const valCol=(c,r)=>{ const v=c.get?c.get(r):r[c.k]; return v==null?'':v; };

function tabella(id,cols,righe,opt){
  opt=opt||{};
  const S=statoTab(id);
  /* ogni tabella ha un ordine naturale: gli autisti per nome, i servizi per orario. Si applica
     la prima volta e basta — appena tocchi un'intestazione l'ordine diventa tuo. */
  if(opt.ord&&!S.ord.length&&!S.tocca)S.ord=opt.ord.slice();
  /* ① filtro */
  let L=righe.filter(r=>cols.every(c=>{
    const q=(S.fil[c.k]||'').trim().toLowerCase();
    if(!q)return true;
    const v=String(valCol(c,r)).toLowerCase();
    /* sui numeri si può scrivere >5 <10 =3 */
    const m=q.match(/^([<>=])\s*(-?[\d.,]+)$/);
    if(m&&c.n){ const x=parseFloat(String(valCol(c,r)).replace(',','.'))||0, y=parseFloat(m[2].replace(',','.'))||0;
      return m[1]==='>'?x>y:m[1]==='<'?x<y:x===y; }
    return v.includes(q);
  }));
  /* ② ordinamento, anche a più chiavi */
  if(S.ord.length)L=L.slice().sort((a,b)=>{
    for(const o of S.ord){
      const c=cols.find(x=>x.k===o.k); if(!c)continue;
      const va=valCol(c,a), vb=valCol(c,b);
      let d;
      if(c.n)d=(parseFloat(String(va).replace(',','.'))||0)-(parseFloat(String(vb).replace(',','.'))||0);
      else d=String(va).localeCompare(String(vb),'it',{numeric:true});
      if(d)return o.dir>0?d:-d;
    }
    return 0;
  });
  const freccia=k=>{ const i=S.ord.findIndex(o=>o.k===k); if(i<0)return '';
    return `<i class="frc">${S.ord[i].dir>0?'▲':'▼'}${S.ord.length>1?'<sup>'+(i+1)+'</sup>':''}</i>`; };
  const attivi=Object.values(S.fil).filter(x=>x&&x.trim()).length;
  return `<div class="tabv" data-tab="${id}">
    <div class="tabh">
      <span class="mut">${L.length===righe.length?righe.length+' righe'
        :'<b class="cy">'+L.length+'</b> di '+righe.length}</span>
      ${opt.sel?`<span class="mut">· <b class="cy">${S.sel.size}</b> selezionate</span>`:''}
      ${(S.ord.length||attivi)?`<button class="btn mini" data-azz="${id}">azzera ordine e filtri</button>`:''}

function legaTabelle(){
  $$('#main th[data-ord]').forEach(th=>th.onclick=e=>{
    const [id,k]=th.dataset.ord.split('|'); const S=statoTab(id); S.tocca=1;
    const i=S.ord.findIndex(o=>o.k===k);
    if(!e.shiftKey&&i<0)S.ord=[];
    if(i<0)S.ord.push({k,dir:1});
    else if(S.ord[i].dir>0)S.ord[i].dir=-1;
    else S.ord.splice(i,1);
    disegna();
  });
  $$('#main input[data-fil]').forEach(inp=>{
    let t=null;
    inp.oninput=()=>{ clearTimeout(t); const [id,k]=inp.dataset.fil.split('|');
      t=setTimeout(()=>{ statoTab(id).fil[k]=inp.value; const p=inp.selectionStart;
        disegna(); const n=document.querySelector('[data-fil="'+id+'|'+k+'"]');
        if(n){n.focus(); try{n.setSelectionRange(p,p);}catch(e){}} },260); };
  });
  $$('#main input[data-sel]').forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    const [id,ch]=c.dataset.sel.split('|'); const S=statoTab(id);
    if(c.checked)S.sel.add(ch); else S.sel.delete(ch);
    disegna();
  });
  $$('#main input[data-tutti]').forEach(c=>c.onclick=()=>{
    const id=c.dataset.tutti, S=statoTab(id);
    const tutte=$$('#main input[data-sel^="'+id+'|"]').map(x=>x.dataset.sel.split('|')[1]);
    if(c.checked)tutte.forEach(x=>S.sel.add(x)); else tutte.forEach(x=>S.sel.delete(x));
    disegna();
  });
  $$('#main button[data-azz]').forEach(b=>b.onclick=()=>{
    const S=statoTab(b.dataset.azz); S.ord=[]; S.fil={}; S.tocca=0; disegna();
  });
  /* Aprire e selezionare sono due gesti diversi e non devono pestarsi i piedi: il doppio clic
     apre, la casella seleziona, e basta. Prima il primo clic del doppio clic selezionava anche,
     e restava selezionato per sempre — un gesto che ne faceva due. */
  $$('#main tr[data-riga]').forEach(tr=>{
    const [id,ch]=tr.dataset.riga.split('|');
    const f=VIS_APRI[id]; if(!f)return;
    tr.style.cursor='pointer';
    tr.ondblclick=e=>{ if(e.target&&e.target.type==='checkbox')return; f(ch); };
  });
  $$('#main .lnk[data-vai2]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const [area,chiave]=el.dataset.vai2.split('|');
    apriDa(area,chiave);
  });
}
/* portare l'utente dove quella cosa è definita, e aprirla */
function apriDa(area,chiave){
  if(area==='drv'){ const i=AUTISTI.findIndex(d=>d.n===chiave); if(i>=0){vaiFase('drv');setTimeout(()=>schedaAutista(i),40);} return; }
  if(area==='veh'){ const i=VEICOLI.findIndex(v=>v.t===chiave); if(i>=0){vaiFase('veh');setTimeout(()=>schedaVeicolo(i),40);} return; }
  if(area==='cli'){ const i=CLIENTI.findIndex(c=>c.n===chiave); if(i>=0){vaiFase('cli');setTimeout(()=>schedaCliente(i),40);} return; }
  if(area==='zon'){ const i=ZONE.findIndex(z=>z.n===chiave); if(i>=0){vaiFase('zon');setTimeout(()=>schedaZona(i),40);} return; }
  if(area==='svc'){ const i=SERVIZI.findIndex(s=>s.id===chiave); if(i>=0){vaiFase('svc');setTimeout(()=>schedaServizio(i),40);} return; }
  if(area==='pag'){ vaiFase(chiave); return; }
  if(area==='cat'){ const C=cubo(); const xi=C.X.findIndex(c=>c.id===chiave);
    if(xi>=0){ XSEL=xi; FIL.q=''; vaiFase('f2'); } return; }
}
function vaiFase(f){
  FASE=f;
  $$('#rail .fase').forEach(x=>{ const on=x.dataset.f===f;
    x.classList.toggle('on',on); if(on)x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); });
  disegna();
}

/* ══════════════════════════ LE AREE DATI ══════════════════════════
   Autisti, veicoli, clienti e servizi si creano, si cambiano e si tolgono da qui. Ogni
   modifica salva e butta via i cubi: al giro dopo si rifanno sui dati nuovi. */
/* ═══ NIENTE SI SALVA DA SOLO ═══
   Quello che cambi vale subito per il calcolo, ma resta in memoria e basta: sul disco ci va
   solo quando premi Salva. Così puoi provare una soglia, guardare cosa succede ai cubi e
   tornare indietro chiudendo, senza esserti portato via niente per sbaglio. */
/* ═══ NON DEVI RICORDARTI DI SALVARE ═══
   Il pulsante resta, perché vedere "Salvato" rassicura. Ma il salvataggio adesso parte da solo
   un secondo dopo l'ultima modifica: dimenticarsi di premerlo non può più costare una
   giornata di lavoro. E se non riesce, lo dice — in rosso, in alto, dove non si può non
   vederlo. */
let SPORCO=false, TIMER_SALVA=null;
function tocca(){
  CUBO=null; SOL=null; SVC_CACHE=null; puliciBlocchi(); DI_ESEMPIO=false; SPORCO=true; segnaSalva();
  clearTimeout(TIMER_SALVA);
  TIMER_SALVA=setTimeout(()=>salvaTutto(true),1000);
}
function salvaTutto(automatico){
  const ok=salva();
  if(ok&&SOL&&SOL.best)salvaSol(SOL);
  SPORCO=!ok;
  segnaSalva(ok?(automatico?'salvato da solo':'salvato'):null);
  return ok;
}
function segnaSalva(msg){
  const b=document.querySelector('#salvaBtn'); if(!b)return;
  const rotto=!!ERR_SALVA;
  b.classList.toggle('on',SPORCO&&!rotto);
  b.classList.toggle('rotto',rotto);
  b.textContent=rotto?'⚠ NON SALVA':(SPORCO?'● Salva':'Salvato');
  const s=document.querySelector('#salvaNota');
  if(s)s.innerHTML=rotto
    ? '<b class="er">'+esc(ERR_SALVA)+'</b> — fai subito un backup su file in Configurazione'
    : esc(msg||(SPORCO?'ci sono modifiche non salvate':'tutto salvato'
        +(ULTIMO_SALVA?' · '+ULTIMO_SALVA.toLocaleTimeString('it',{hour:'2-digit',minute:'2-digit'}):'')));
}

/* Dove è caduto un criterio, nella giornata scelta: nome per nome, servizio per servizio.
   Serve per rispondere alla sola domanda che conta quando si tocca un peso — "e questo, a
   chi lo sto facendo pagare?" */
function mostraCritOggi(k){
  const c=CRIT[k]; if(!c||!SOL||!SOL.best)return;
  const righe=[];
  for(const b of SOL.best){
    let cc; try{ cc=celPiena(b.xi,b.yi,b.zi); }catch(e){ continue; }
    for(const m of cc.M)if(m.k===k)righe.push({b,m});
  }
  righe.sort((x,y)=>y.m.pts-x.m.pts);
  const tot=righe.reduce((a,r)=>a+r.m.pts,0);
  $('#detBody').innerHTML=`<h4>${esc(c.t)}</h4>
    <p class="mut" style="font-size:12px;margin:2px 0 12px">${esc(c.d)} ·
      ${c.q.map(q=>`<span class="qtag ${QCL[q]}">${QLBL[q]}</span>`).join('')}</p>
    <div class="kpi" style="margin-bottom:12px">
      <div><i>scatti</i><b>${righe.length}</b><em>nella soluzione di oggi</em></div>
      <div><i>punti tolti</i><b class="er">${n1(tot)}</b><em>in tutto</em></div>
      <div><i>in media</i><b>${righe.length?n1(tot/righe.length):0}</b><em>a scatto</em></div>
    </div>
    ${righe.length?`<table><thead><tr><th>A chi</th><th>Dove</th><th class="n">Punti</th></tr></thead><tbody>
      ${righe.map(r=>`<tr><td><span class="lnk" data-vai2="drv|${esc(r.b.d.n)}">${esc(r.b.d.n)}</span>
        <em style="font-style:normal;display:block;color:var(--m2);font-size:11px">${esc(r.m.det||'')}</em></td>
        <td class="mut" style="font-size:11.5px">${r.m.serv
          ? `<span class="lnk" data-vai2="svc|${esc(r.m.serv)}">${esc(r.m.serv)}</span>`
          : 'catena '+esc(r.b.cat.ids.join('+'))}</td>
        <td class="n er">−${n1(r.m.pts)}</td></tr>`).join('')}
    </tbody></table>`:'<p class="mut" style="font-size:12.5px">Non è mai scattato nella soluzione di oggi. '
      +'Può voler dire che il peso è giusto e nessuno ci cade — oppure che il criterio non trova mai '
      +'la sua occasione, e allora tanto vale saperlo.</p>'}
    <div style="display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <button class="btn" id="skNo">Chiudi</button></div>`;
  $('#det').classList.add('on');
  $('#skNo').onclick=()=>$('#det').classList.remove('on');
  $$('#detBody .lnk[data-vai2]').forEach(el=>el.onclick=()=>{
    $('#det').classList.remove('on');
    const [area,chiave]=el.dataset.vai2.split('|'); apriDa(area,chiave);
  });
}

function schedaAutista(i){

     il grado su BUS XL: sono cose che non potrà mai fare. Le due sezioni si rifanno da sole
     ogni volta che si tocca una spunta. */
  const licAttuali=()=>PATENTI.filter(p=>{const e=$('#au_l_'+p); return e?e.checked:(d.lic||['B']).includes(p);});
  const sezioni=()=>{
    const lic=licAttuali();

    const sv=$('#au_secVeic'), sc=$('#au_secComp');

      [['','nessuno'],...veicoliOk.map(v=>[v.t,v.t+' · '+v.ma+' '+v.mo+' · '+v.tip])])
      +(veicoliOk.length?'':'<p class="nota">Con questa patente non guida nessuno dei mezzi in anagrafica.</p>');
    if(sc)sc.innerHTML=compOk.length
      ? '<div class="cols2">'+compOk.map(c=>`<div>${fSel('au_c_'+c.replace(/ /g,'_'),c,gradoComp(d,c),GRADI.map(g=>[g,g]))}</div>`).join('')+'</div>'
        +'<p class="nota">Non sono divieti: sono preferenze aziendali. Costano care, ma in una giornata storta si pagano.</p>'
      : '<p class="nota">Nessuna competenza da configurare con questa patente.</p>';
  };
  scheda(nuovo?'Nuovo autista':d.n,
    fTxt('au_n','Nome e cognome',d.n,'Rossi Mario')
   +`<h3>Patenti</h3>
    <div class="riga">${PATENTI.map(p=>fChk('au_l_'+p,'patente '+p,(d.lic||['B']).includes(p))).join('')}</div>
    <p class="nota">La patente è un divieto: <b>B</b> per auto e minivan, <b>D</b> per sprinter e
      bus. Quello che spunti qui apre il resto della scheda.</p>
    <h3>Il suo mezzo</h3><div id="au_secVeic"></div>
    ${fSel('au_gr','Gamma di riferimento',d.gr||'',
        [['','dal suo mezzo · '+gammaRif(Object.assign({},d,{gr:null}))],...GAMME_RIF.map(g=>[g,g])])}
    <p class="nota">Il Luxury non compare: non è il gradino più alto di una scala, è
      un'eccezione. Chi guida un Luxury ha riferimento Gold.</p>

    <div class="cols2">
      <div>${fSel('au_vip','VIP Badge',d.vip||'—',GRADI.map(g=>[g,g]))}</div>
      <div>${fSel('au_cice','Cicerone',d.cice||'—',GRADI.map(g=>[g,g]))}</div>
    </div>
    <h3>Lingue</h3>
    <div class="cols2">${LINGUE.map(l=>`<div>${fSel('au_lg_'+l,l,(d.lang&&d.lang[l])||'—',GRADI.map(g=>[g,g]))}</div>`).join('')}</div>
    <h3>Quando è disponibile</h3>

      <div>${fTxt('au_da','Da',(d.cal&&d.cal.da)||'00:00','06:00')}</div>
      <div>${fTxt('au_a','Fino a',(d.cal&&d.cal.a)||'23:59','23:00')}</div>

    <p class="nota">Ferie, riposi e notturni già fatti arriveranno col calendario.</p>`,

      const comp={}; compPerLic(lic).forEach(c=>{const g=vTxt('au_c_'+c.replace(/ /g,'_')); if(g&&g!=='—')comp[c]=g;});
      const lang={}; LINGUE.forEach(l=>{const g=vTxt('au_lg_'+l); if(g&&g!=='—')lang[l]=g;});

/* tutte le tratte che servono: quelle dei servizi, i posizionamenti e la rimessa */
function tratteDaChiedere(){
  const out=[], visto=new Set();
  const agg=(a,b,tipo,et,min,tappe)=>{
    /* un giro che torna dove è partito è legittimo: si esclude solo se non ha nemmeno tappe,
       perché allora non è un percorso, è un punto */
    if(!a||!b)return;
    if(normaliz(a)===normaliz(b)&&!(tappe&&tappe.filter(Boolean).length))return;
    const k=chiaveTratta(a,b,tappe); if(visto.has(k))return; visto.add(k);
    out.push({a,b,k,tipo,et,min,tappe:tappe||[],ho:!!TRATTE[k]});
  };
  for(const s of servizi()) agg(s.da,s.a,'servizio',s.id+' · '+(s.dove||''),t2m(s.ora),(s.stops||[]).filter(Boolean));
  const SV=servizi();
  for(let i=0;i<SV.length;i++)for(let j=0;j<SV.length;j++){
    if(i===j)continue;
    const s1=SV[i], s2=SV[j];
    if(arco(s1).a>arco(s2).da)continue;
    if(arco(s2).da-arco(s1).a>6*60)continue;
    agg(s1.a||s1.dove, s2.da||s2.dove,'posizionamento',s1.id+' → '+s2.id,arco(s1).a);
  }
  const R=(CFG.rimessaInd||'').trim();
  if(R)for(const s of servizi()){
    agg(R,s.da||s.dove,'rimessa','uscita per '+s.id,t2m(s.ora)-CFG.rimessa);
    agg(s.a||s.dove,R,'rimessa','rientro dopo '+s.id,arco(s).a);
  }
  return out;
}

   Un progressivo che non si scontra con quelli che ci sono già: uno in meno da compilare. */
function nuovoCodice(){
  let n=1; while(SERVIZI.some(s=>s.id==='s'+n))n++;
  return 's'+n;
}
/* ═══ UN CAMPO CHE SUGGERISCE GLI INDIRIZZI ═══
   Mentre scrivi, chiede a Google i posti che somigliano a quello che hai battuto e li mette
   sotto. Se la chiave non c'è, o Places non è attiva, il campo resta un normale campo di
   testo: si scrive a mano e funziona tutto lo stesso. */
function fInd(id,lab,val,ph){
  return `<div style="margin-bottom:9px;position:relative"><label class="lb">${lab}</label>
    <input type="text" id="${id}" class="ind" autocomplete="off" value="${esc(val==null?'':val)}"
      placeholder="${esc(ph||'')}" style="width:100%">
    <div class="sugg" id="${id}_s"></div></div>`;
}
/* ═══ IL RIPIEGO ═══
   Places (New) è una voce a sé nella console di Google, diversa da "Places API" senza il
   (New): capita di abilitare la prima e trovarsi rifiutata la seconda. Quando succede, invece
   di lasciare il campo muto si ripiega sul Geocoding, che quasi sempre è già acceso perché lo
   usano tutti. Non è un vero suggeritore — non completa mentre scrivi come farebbe Places —
   ma prende quello che hai battuto e ti restituisce gli indirizzi veri che ci somigliano.
   Basta e avanza per non scrivere a mano. */
async function cercaGeo(q){
  const k=(CFG.apiKey||'').trim();
  const u='https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(q)
    +'&language=it&region=it&key='+encodeURIComponent(k);
  const r=await fetch(u);
  if(!r.ok)throw new Error('Geocoding ha risposto '+r.status);
  const j=await r.json();
  if(j.status==='REQUEST_DENIED')throw new Error('Geocoding: '+(j.error_message||'richiesta rifiutata'));
  if(j.status!=='OK')return [];
  return (j.results||[]).map(x=>{
    const pieno=x.formatted_address||'';
    const virg=pieno.indexOf(',');
    return{pieno, nome:virg>0?pieno.slice(0,virg):pieno, dove:virg>0?pieno.slice(virg+1).trim():''};
  }).slice(0,6);
}
let PLACES_KO=null;                                  // il motivo per cui Places non risponde
async function cercaPosti(q){
  const k=(CFG.apiKey||'').trim();
  if(!k)throw new Error('manca la chiave: la scrivi in Tratte');
  if(q.length<3)return [];
  let r;
  try{
    r=await fetch('https://places.googleapis.com/v1/places:autocomplete',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':k},
      body:JSON.stringify({input:q,languageCode:'it',regionCode:'IT'})
    });
  }catch(e){
    PLACES_KO='il browser ha bloccato la chiamata a Places';
    const alt=await cercaGeo(q).catch(()=>[]);
    if(alt.length)return alt;
    throw new Error('il browser ha bloccato la chiamata'
      +(DA_LOCALHOST?'':' — succede quando il file è aperto da disco: usa avvia cubik.bat'));
  }
  if(!r.ok){
    let det=''; try{ const j=await r.json(); det=(j.error&&j.error.message)||''; }catch(e){}
    PLACES_KO='Places ha risposto '+r.status+(det?': '+det:'');
    /* invece di arrendersi, si prova la strada di servizio */
    const alt=await cercaGeo(q);
    if(alt.length)return alt;
    throw new Error(PLACES_KO+' · e nemmeno il Geocoding ha trovato niente');
  }
  PLACES_KO=null;
  const j=await r.json();
  /* di ogni posto Google dà due pezzi: il nome e dove si trova. Li teniamo separati, perché
     il primo è quello che scrivi sul foglio e il secondo è quello che dice in che zona sei. */
  return (j.suggestions||[]).map(x=>{
    const p=x.placePrediction; if(!p)return null;
    const sf=p.structuredFormat||{};
    return{ pieno:(p.text&&p.text.text)||'',
            nome:(sf.mainText&&sf.mainText.text)||'',
            dove:(sf.secondaryText&&sf.secondaryText.text)||'' };
  }).filter(x=>x&&x.pieno).slice(0,6);
}
function legaIndirizzi(dentro){
  (dentro||document).querySelectorAll('input.ind').forEach(inp=>{
    const box=document.querySelector('#'+inp.id+'_s');
    if(!box)return;
    let t=null, ultimo='';
    const chiudi=()=>{box.innerHTML='';};
    inp.addEventListener('blur',()=>setTimeout(chiudi,200));
    inp.addEventListener('focus',()=>{ if(inp.value.trim().length>=3){ultimo='';inp.dispatchEvent(new Event('input'));} });
    inp.addEventListener('input',()=>{
      clearTimeout(t);
      const q=inp.value.trim();
      if(q===ultimo||q.length<3){ if(q.length<3)chiudi(); return; }
      t=setTimeout(async()=>{
        ultimo=q;
        box.innerHTML='<div class="sug mut">sto cercando…</div>';
        try{
          const L=await cercaPosti(q);
          if(!L.length){ box.innerHTML='<div class="sug mut">nessun posto con questo nome</div>';
            setTimeout(chiudi,1400); return; }
          box.innerHTML=L.map(x=>`<div class="sug" data-p="${esc(x.pieno)}">
            <b>${esc(x.nome||x.pieno)}</b>${x.dove?`<em>${esc(x.dove)}</em>`:''}</div>`).join('');
          box.querySelectorAll('.sug[data-p]').forEach(el=>el.onmousedown=e=>{
            e.preventDefault(); inp.value=el.dataset.p; chiudi();
            inp.dispatchEvent(new Event('change'));
          });
        }catch(e){
          /* l'errore si vede: prima spariva e non si capiva perché non suggerisse niente */
          box.innerHTML='<div class="sug er">'+esc(e.message)+'</div>';
          setTimeout(chiudi,5000);
        }
      },280);
    });
  });
}

  const cc=document.querySelector('#sv_calc');
  if(cc)cc.onclick=async()=>{
    const da=vTxt('sv_da'), a=vTxt('sv_a');
    const stp=[]; document.querySelectorAll('#sv_tappe input.ind').forEach(e=>{const v=e.value.trim();if(v)stp.push(v);});

    if(!(CFG.apiKey||'').trim()){ es.textContent='manca la chiave: la scrivi in Tratte'; es.className='er'; return; }
    cc.disabled=true; es.textContent='sto chiedendo alla strada…'; es.className='mut';
    try{
      const quando=CFG.usaTraffico?partenza({ora:vTxt('sv_ora')||'09:00'}):null;

      /* la chiave è il percorso intero, tappe comprese: due giri che partono e tornano allo
         stesso posto ma passano per posti diversi non devono sovrascriversi */
      TRATTE[chiaveTratta(da,a,stp)]=r; salTratte();
      const k=document.querySelector('#sv_km'); if(k)k.value=r.km;
      /* la durata di un tempo comprato la dice il contratto, non la strada: si tocca solo il transfer */
      const aT=(vTxt('sv_tipo')||'tra')!=='tra';
      const du=document.querySelector('#sv_dur'); if(du&&!aT)du.value=Math.max(5,r.min);
      es.innerHTML='<b class="ok">'+n1(r.km)+' km'+(aT?'':' in '+r.min+' minuti')+'</b>'
        +(r.traffico?" · col traffico di quell'ora":' · traffico stimato')
        +(aT?' · la durata resta quella del contratto':'')
        +(stp.length?' · '+stp.length+(stp.length===1?' tappa':' tappe')+' nel percorso':'');
      es.className='';
    }catch(e){ es.textContent='non ha funzionato: '+e.message; es.className='er'; }
    cc.disabled=false;
  };
}
/* ══════════════════ I SERVIZI ══════════════════
   Una pagina sola: la giornata da coprire, e sotto il conto di quanto pesa ognuno. Erano due
   aree e non c'era motivo — si guardano insieme, perché è guardando un servizio che viene da
   chiedersi quanto vale. */
/* chi fa cosa, oggi: dalla soluzione viva se c'è, altrimenti da quella salvata */
function assegnazioni(){
  const out={};
  const L='<span class="luk" title="bloccato">&#128274;</span>';
  const metti=(id,dn,vt)=>{
    const bl=BLOCCHI[id]||{};
    out[id]={d:dn,v:vt,
      html:`<span class="ass"><b class="${bl.aut?'man':''}">${esc(dn)}${bl.aut&&!bl.veh?L:''}</b></span>`,
      hv:`<span class="ass"><em class="${bl.veh?'man':''}">${esc(vt)}${bl.veh&&!bl.aut?L:''}</em></span>`};
  };
  if(SOL&&SOL.best&&CUBO&&SOL.stamp===CUBO.fatto){
    SOL.best.forEach(b=>b.cat.ids.forEach((id,i)=>metti(id,b.d.n,b.sch.vv[i].t)));
  }else{
    const u=ultimaAssegnazione();
    if(u)u.ass.forEach(a=>a.ids.forEach((id,i)=>metti(id,a.d,a.vv[i]||a.vv[0])));
  }
  /* quello che hai deciso tu vince su tutto, e si vede prima di qualunque ricalcolo */
  for(const id in BLOCCHI){
    const b=BLOCCHI[id]; if(!b)continue;
    const g=out[id]||{d:'',v:''};
    metti(id, b.aut||g.d||'—', b.veh||g.v||'—');
  }
  return out;
}

/* ══════════════════ IL MENU DEL TASTO DESTRO ══════════════════
   Tutto dev'essere automatico, ma anche semi-automatico e manuale. L'automatico c'è: sono i
   cubi. Il manuale è questo — tasto destro su un servizio, e le cose che puoi decidere tu
   compaiono lì, insieme alle alternative che il sistema conosce e ai loro punteggi.
   Non è una scorciatoia sul motore: è il motore che ti mostra le sue carte e ti lascia
   scegliere, e da quel momento quella scelta diventa un dato come una patente. */
let MENU=null;
/* ═══ UNA SCELTA MANUALE VUOLE VEDERE IL SUO EFFETTO ═══
   Il calcolo non parte da solo quando si gira fra le pagine — giusto. Ma quando decidi tu
   un'assegnazione stai chiedendo esattamente quello: "fai così, e rifai il resto". Buttare via
   la soluzione e lasciare la pagina vuota era la risposta sbagliata a una domanda precisa. */
/* ═══ DECIDERE A MANO NON È RIFARE LA GIORNATA ═══
   Quando dici "questo lo fa lui", vuoi vederlo scritto — non aspettare che si ricostruiscano
   due milioni di celle. La scelta si applica subito, perché un blocco vale più di qualunque
   punteggio; la giornata intorno resta com'è. Poi il pulsante Assegna turni si accende e ti
   dice che c'è qualcosa da rifare, quando ti pare. */
let CAMBIATO=false;
function manuale(){
  CAMBIATO=true; SPORCO=true; puliciBlocchi(); segnaSalva(); salva();
  disegna();
}
/* la vecchia strada, per quando il ricalcolo lo chiedi davvero */
function rifaiSubito(){
  CUBO=null; SOL=null; SVC_CACHE=null; CAMBIATO=false; SPORCO=true; segnaSalva();
  if(!servizi().length){ disegna(); return; }
  conCubo(()=>{
    MOSSE=[]; SOL_PREC=null;
    cerca(CFG.msRicerca,r=>{ SOL=r; SOL.stamp=CUBO.fatto; SOL.imp=impronta();
      salvaSol(SOL); disegna(); });
  });
}
function chiudiMenu(){ const m=document.querySelector('#ctx'); if(m)m.remove(); MENU=null; }
/* ═══ IL MENU SI CHIUDE QUANDO SCORRE LA PAGINA, NON QUANDO SCORRE LUI ═══
   L'ascolto era in fase di cattura su tutto il documento: bastava la rotella dentro l'elenco
   delle alternative — che è proprio la cosa che uno vuole scorrere — e il menu spariva. Adesso
   si guarda DOVE è successo: dentro il menu non è affar suo, fuori sì, perché lì il menu
   resterebbe appeso a una riga che si è spostata. */
const dentroMenu=e=>MENU&&e&&e.target&&MENU.contains&&MENU.contains(e.target);
document.addEventListener('click',e=>{ if(dentroMenu(e))return; chiudiMenu(); });
document.addEventListener('scroll',e=>{ if(dentroMenu(e))return; chiudiMenu(); },true);
document.addEventListener('wheel',e=>{ if(dentroMenu(e))return; chiudiMenu(); },{passive:true});
document.addEventListener('keydown',e=>{ if(e.key==='Escape')chiudiMenu(); });
/* ═══ IL CALENDARIO SI ATTRAVERSA COME UN FOGLIO DI CALCOLO ═══
   Frecce per muoversi, una lettera per scrivere, invio per aprire. Chi arriva da Excel non
   deve imparare niente, e chi non ci arriva impara quattro tasti. */
/* sposta il riquadro senza toccare niente altro, e lo tiene in vista */
function mostraSel(){
  $$('#main td[data-cal]').forEach(td=>{
    const [,,r,c]=td.dataset.cal.split('|');
    const on=(+r===CAL_SEL.r&&+c===CAL_SEL.c);
    td.classList.toggle('sel',on);
    if(on&&td.scrollIntoView)td.scrollIntoView({block:'nearest',inline:'nearest'});
  });
}
document.addEventListener('keydown',e=>{
  if(FASE!=='cal')return;
  if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const nR=CAL_RIGHE.length, nC=CAL_GG.length;
  if(!nR||!nC)return;
  const mosse={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],
               Home:[0,-99],End:[0,99],PageUp:[-8,0],PageDown:[8,0]};
  if(mosse[e.key]){
    e.preventDefault();
    CAL_SEL.r=Math.max(0,Math.min(nR-1,CAL_SEL.r+mosse[e.key][0]));
    CAL_SEL.c=Math.max(0,Math.min(nC-1,CAL_SEL.c+mosse[e.key][1]));
    mostraSel(); return;
  }
  const n=CAL_RIGHE[CAL_SEL.r], iso=CAL_GG[CAL_SEL.c];
  if(!n||!iso)return;
  if(e.key==='Enter'){ e.preventDefault(); schedaCella(n,iso); return; }
  const k=e.key.toUpperCase();
  const lettere={R:'R',F:'F',M:'M','?':'?'};
  if(lettere[k]!==undefined){ e.preventDefault();
    segnaCal(n,iso,statoCal(n,iso)===lettere[k]?'':lettere[k]); tocca(); disegna(); return; }
  if(e.key==='Delete'||e.key==='Backspace'||k==='0'){ e.preventDefault();
    segnaCal(n,iso,''); delete LIMITI[n+'|'+iso];
    if(iso===GIORNO){CUBO=null;SOL=null;} tocca(); disegna(); }
});

/* le migliori combinazioni per un servizio, ordinate, con dentro chi è libero e chi no */
/* ═══ "IMPEGNATO" NON VUOL DIRE "NON PUÒ" ═══
   Un autista con un tour dalle dieci e mezza alle due e mezza non è impegnato alle sette di
   sera: è semplicemente già in una catena. Se esiste una catena che tiene DENTRO i suoi
   servizi e in più quello scoperto, prenderla non gli toglie niente — è un allungamento, non
   uno scambio. Marcarlo "impegnato" era una lettura sbagliata, e nascondeva proprio le mosse
   che si volevano vedere.
   Quindi per ogni combinazione si guarda che cosa perderebbe: niente, e allora si può; oppure
   dei servizi precisi, e allora si dice quali. */
function alternative(sid,quante){
  const C=cubo(), out=[];
  const oraD=new Map(), oraV=new Map();
  (SOL&&SOL.best||[]).forEach(b=>{
    oraD.set(b.d.n,b.cat.ids);
    b.targhe.forEach(t=>oraV.set(t,b.cat.ids));
  });
  const perde=(mie,nuove)=>(mie||[]).filter(x=>x!==sid&&!nuove.includes(x));
  for(let xi=0;xi<C.X.length;xi++){
    const cat=C.X[xi]; if(!cat.ids.includes(sid))continue;
    const pos=cat.ids.indexOf(sid);
    for(let yi=0;yi<AUTISTI.length;yi++)for(let zi=0;zi<C.Z[xi].length;zi++){
      const c=cel(xi,yi,zi); if(!c.sopra)continue;
      const sch=C.Z[xi][zi], v=sch.vv[pos], d=AUTISTI[yi];
      const pD=perde(oraD.get(d.n),cat.ids);
      const pV=[]; sch.targhe.forEach(t=>perde(oraV.get(t),cat.ids).forEach(x=>{
        if(!pV.includes(x))pV.push(x);}));
      out.push({xi,yi,zi,cat,d,sch,v,val:c.media,qc:c.qc,qa:c.qa,qu:c.qu,
                perdeD:pD, perdeV:pV,
                liberoD:!pD.length, liberoV:!pV.length,
                estende:(oraD.get(d.n)||[]).length>0&&!pD.length});
    }
  }
  out.sort((a,b)=>((b.liberoD&&b.liberoV)-(a.liberoD&&a.liberoV))
                  ||(a.perdeD.length+a.perdeV.length)-(b.perdeD.length+b.perdeV.length)
                  ||b.val-a.val);
  const visti=new Set(), top=[];
  for(const o of out){ const k=o.d.n+'|'+o.v.t; if(visti.has(k))continue;
    visti.add(k); top.push(o); if(top.length>=(quante||12))break; }
  return top;
}

/* il tasto destro su un autista: quello che un dispatcher decide guardando la lista */
function menuAutista(ev,nome){
  ev.preventDefault(); ev.stopPropagation(); chiudiMenu();
  const d=aut(nome); if(!d)return;
  const b=(SOL&&SOL.best||[]).find(x=>x.d.n===nome);
  const suoi=servizi().filter(sv=>(BLOCCHI[sv.id]||{}).aut===nome);
  const el=document.createElement('div'); el.id='ctx'; el.className='ctx';
  el.innerHTML=`
    <div class="ctxh"><b>${esc(nome)}</b>
      <br><span class="mut">${b?b.cat.ids.join('+')+' · '+n1(b.cat.arcoMin/60)+'h':'libero oggi'}</span></div>
    <div class="ctxg">
      <button data-a="apri">Apri la scheda</button>
      ${b?`<button data-a="blocca">Blocca tutto il suo turno</button>`:''}
      ${suoi.length?`<button data-a="libera">Togli i suoi ${suoi.length} blocchi</button>`:''}
      <button data-a="ferie">${(d.cal&&d.cal.stato)?'Rimetti in servizio':'Segna non disponibile oggi'}</button>
    </div>`;
  document.body.appendChild(el); posiziona(el,ev);
  el.querySelectorAll('button[data-a]').forEach(btn=>btn.onclick=()=>{

/* ═══ IL PUNTEGGIO DI UN SERVIZIO, DA DOVE VIENE ═══
   Il tasto destro su un servizio deve poter arrivare al conto per esteso della combinazione
   che gli è toccata: quali malus, di quale criterio, con che maggiorazione, e quanto tolgono
   a ciascuna delle tre qualità. È la stessa scheda della Fase 3, raggiunta da dove serve. */
function apriPunteggio(sid){
  const C=cubo();
  const bl=BLOCCHI[sid]||null;
  /* ═══ SI SPIEGA QUELLO CHE HAI DECISO, NON QUELLO CHE C'ERA PRIMA ═══
     Se hai spostato un servizio a mano, la soluzione salvata parla ancora della vecchia
     catena — e il conto che ne esce è quello di un turno che non esiste più: dodici ore di
     un altro, non il transfer di venti minuti che hai appena assegnato. Quando c'è un blocco
     comanda il blocco, e la catena da spiegare è quella che il blocco disegna: i servizi che
     hai messo in mano a quell'autista, e nient'altro. */
  if(bl&&bl.aut){
    const yi=AUTISTI.findIndex(d=>d.n===bl.aut);
    if(yi<0){ alert('L\'autista '+bl.aut+' non è più in anagrafica.'); return; }
    /* tutti i servizi di oggi bloccati sullo stesso autista formano il suo turno */
    const suoi=servizi().filter(x=>(BLOCCHI[x.id]||{}).aut===bl.aut).map(x=>x.id);
    let xi=C.X.findIndex(c=>c.ids.length===suoi.length&&c.ids.every(x=>suoi.includes(x)));
    if(xi<0)xi=C.X.findIndex(c=>c.ids.length===1&&c.ids[0]===sid);
    if(xi<0){ alert('Con i dati di adesso quella catena non esiste.'); return; }
    let zi=bl.veh?C.Z[xi].findIndex(z=>z.targhe.includes(bl.veh)):-1;
    if(zi<0)zi=0;
    return apriCella(xi,yi,zi);
  }
  /* niente blocco: vale la soluzione, viva o salvata */
  if(SOL&&SOL.best&&CUBO&&SOL.stamp===CUBO.fatto){
    const b=SOL.best.find(x=>x.cat.ids.includes(sid));
    if(b&&b.xi!=null)return apriCella(b.xi,b.yi,b.zi);
  }
  const A=assegnazioni()[sid];
  if(!A||!A.d||A.d==='—'){ alert('Questo servizio non è ancora assegnato: non c\'è nessun punteggio da spiegare.'); return; }
  const yi=AUTISTI.findIndex(d=>d.n===A.d);
  if(yi<0){ alert('L\'autista '+A.d+' non è più in anagrafica.'); return; }
  const u=ultimaAssegnazione();
  const suo=u&&u.ass?u.ass.find(a=>a.ids.includes(sid)):null;
  const ids=suo?suo.ids:[sid];
  const xi=C.X.findIndex(c=>c.ids.length===ids.length&&c.ids.every(x=>ids.includes(x)));
  if(xi<0){ alert('Quella catena non esiste più con i dati di adesso.'); return; }
  let zi=C.Z[xi].findIndex(z=>z.vv.map(v=>v.t).join(',')===(suo?suo.vv.join(','):A.v));
  if(zi<0)zi=C.Z[xi].findIndex(z=>z.targhe.includes(A.v));
  if(zi<0)zi=0;
  apriCella(xi,yi,zi);
}

/* ══════════════════ PROGRAMMA ══════════════════
   La giornata: i servizi e la loro soluzione, nello stesso posto. Erano due pagine e non aveva
   senso — si guarda l'elenco proprio per sapere chi lo fa. */
/* ══════════════════════════════════════════════════════════════════════════════
   IL BANCO DI PROVA · quattro mestieri, quattro regole

   EDWARD TUFTE · la densità.
   «Above all else show the data.» Lo spazio di uno schermo è carta, e la carta si
   paga: ogni pixel che non porta un dato è un pixel rubato al dato accanto. Cinque
   riquadroni con un numero grande dentro non sono informazione, sono arredamento —
   e costringono a scorrere per vedere il resto. Da qui la BARRA DI STATO: tutta la
   giornata in una riga, numeri piccoli e vicini, perché il confronto fra due numeri
   si fa con l'occhio solo se stanno vicini.

   LARRY TESLER · la conservazione della complessità.
   Ogni programma ha una complessità irriducibile: la domanda non è come toglierla,
   è CHI LA PORTA. Se il programma non sa dirti perché va ricalcolato, quel sapere
   devi tenertelo in testa tu. Da qui: il pulsante che dice cosa è cambiato, e le
   pagine che dicono cosa manca prima che tu lo chieda.

   W. EDWARDS DEMING · la qualità come sistema.
   «In God we trust, all others bring data.» E soprattutto: quando qualcosa va male
   non è l'operatore ad aver sbagliato, è il sistema che gliel'ha permesso. Da qui il
   pannello CHE COSA NON VA: i controlli girano da soli, sempre, e dicono quello che
   è storto prima che diventi una telefonata alle sette di mattina.

   CHI HA LA PELLE IN GIOCO · il dispatcher.
   L'unico giudice che conta è chi alle sette di sera deve decidere e alle sette di
   mattina risponde di quella decisione. Regola: ogni schermata deve rispondere in
   tre secondi alla domanda che uno si fa in quel momento. Se serve di più, la
   schermata è sbagliata — non l'utente.
   ══════════════════════════════════════════════════════════════════════════════ */

/* la giornata in una riga sola */
function barraStato(){
  const SV=servizi(); if(!SV.length)return '';
  /* ═══ SI CONTA QUELLO CHE C'È, NON QUELLO CHE È VIVO ═══
     La barra guardava la soluzione in memoria: cambiando giorno quella non c'è più e scriveva
     un trattino, mentre nella tabella sotto i nomi erano scritti. Due letture diverse della
     stessa cosa. Adesso conta le assegnazioni, da dovunque vengano — soluzione viva, ultima
     salvata, o decisioni prese a mano. */
  const A=assegnazioni();
  const cop=SV.filter(s=>A[s.id]).length;
  const usatiD=new Set(), usatiV=new Set();
  SV.forEach(s=>{ const a=A[s.id]; if(!a)return;
    if(a.d&&a.d!=='—')usatiD.add(a.d); if(a.v&&a.v!=='—')usatiV.add(a.v); });
  const disp=AUTISTI.filter(d=>!(d.cal&&d.cal.stato)&&!statoCal(d.n,GIORNO)).length;
  const inStrada=VEICOLI.filter(v=>!v.fermo).length;
  const q=(SOL&&SOL.best&&CUBO&&SOL.stamp===CUBO.fatto)
    ? Math.round(SOL.best.reduce((a,b)=>a+b.qc+b.qa+b.qu,0)/(3*SOL.best.length))
    : (()=>{const u=ultimaAssegnazione();
        if(!u||!u.ass.length)return null;
        return Math.round(u.ass.reduce((x,a)=>x+a.qc+a.qa+a.qu,0)/(3*u.ass.length));})();
  const v=(et,val,cls,tit)=>`<span class="sv" title="${esc(tit||'')}"><i>${et}</i><b class="${cls||''}">${val}</b></span>`;
  return `<div class="stato">
    ${v('servizi',SV.length,'','')}
    ${v('assegnati',cop+'/'+SV.length,cop<SV.length?'er':'',
        cop<SV.length?(SV.length-cop)+' ancora da assegnare':'')}
    ${v('autisti',usatiD.size+'/'+disp,usatiD.size>=disp?'er':'',
        usatiD.size>=disp?'non ne resta nessuno libero':'')}
    ${v('mezzi',usatiV.size+'/'+inStrada,usatiV.size>=inStrada?'er':'',
        usatiV.size>=inStrada?'non ne resta nessuno in rimessa':'')}
    ${v('media',q==null?'—':q,q==null?'':banda(q,'cli'),'')}
    ${CAMBIATO?v('da rifare','●','wr','hai cambiato qualcosa a mano: premi Riassegna turni'):''}
  </div>`;
}

/* ═══ CHE COSA NON VA ═══
   I controlli non aspettano che tu li chieda: girano sempre, e quello che trovano sta in
   cima, non in fondo. Ogni riga dice il problema, quanto è grave, e dove si aggiusta. */
function controlli(){
  const out=[], SV=servizi();
  const gr=(t,c,dove)=>out.push({t,c,dove});
  const senzaInd=SV.filter(s=>!s.da||!s.a);
  if(senzaInd.length)gr(senzaInd.length+' servizi senza indirizzo: '+senzaInd.map(s=>s.id).join(', ')
    +' — senza quelli la strada non si può chiedere e i chilometri restano a mano','er','svc');
  const manc=tratteDaChiedere().filter(x=>!x.ho).length;
  if(manc)gr(manc+' tratte non sono mai state chieste: i minuti valgono il ripiego di '+CFG.rimessa
    +"′ e i chilometri quello di "+CFG.rimessaKm+' km','wr','svc');
  if(!(CFG.apiKey||'').trim())gr('Manca la chiave Google: senza, nessuna tratta è vera','wr','cfg');
  if(!(CFG.rimessaInd||'').trim())gr('Manca l\'indirizzo della rimessa: uscite e rientri valgono il ripiego','wr','cfg');
  const zero=Object.keys(CRIT).filter(k=>!CRIT[k].spento&&!CRIT[k].daZona&&
    (CRIT[k].liv?CRIT[k].liv.every(x=>!x):!CRIT[k].p));
  if(zero.length)gr(zero.length+' criteri sono a zero e non decidono niente: '
    +zero.map(k=>CRIT[k].t).join(', '),'mut','crt');
  const spenti=Object.keys(CRIT).filter(k=>CRIT[k].spento);
  if(spenti.length)gr(spenti.length+' criteri sono spenti in attesa del calendario: '
    +spenti.map(k=>CRIT[k].t).join(', '),'mut','crt');
  const dop=SV.filter((s,i)=>SV.findIndex(x=>x.id===s.id)!==i);
  if(dop.length)gr('Codici doppi: '+[...new Set(dop.map(s=>s.id))].join(', '),'er','svc');
  return out;
}

  const L=controlli(); if(!L.length)return '';

  return `<details class="ctrl${gravi?' gravi':medi?' medi':''}"${gravi?' open':''}>

/* il gesto che avvia tutto, sempre uguale e sempre nello stesso posto */
function pulsanteCalcola(quale){
  const n=servizi().length;
  if(!n)return '';
  const pronta=SOL&&CUBO&&SOL.stamp===CUBO.fatto;
  /* se una soluzione c'è ma è stata calcolata su dati diversi, non basta dire "ricalcola":
     va detto CHE COSA è cambiato, se no quel sapere deve tenerselo in testa chi guarda. */
  const vecchia=SOL&&SOL.imp&&SOL.imp!==impronta();
  return `<div class="calcbar${pronta?' fatta':''}${vecchia?' scaduta':''}">
    <button class="btn ${pronta&&!vecchia?'':'on'}" id="calcolaOra">${
      pronta?(vecchia?'Rifai il calcolo':'Ricalcola'):'Calcola le assegnazioni'}</button>
    <span class="mut">${vecchia
      ? '<b class="wr">i dati sono cambiati dopo l\'ultimo calcolo</b>: quello che vedi è vecchio'
      : pronta
      ? 'assegnati '+SOL.bestCop+' su '+n+' · somma '+SOL.bestTot+(SOL.completo?' · ricerca conclusa':' · fermata al tempo massimo')
      : n+' servizi in attesa · il calcolo parte quando lo chiedi tu'}</span>
    ${pronta?'<button class="btn mini" id="calcolaVia">Butta via</button>':''}
  </div>`;
}

  return vSvc()+pulsanteCalcola('prg')+(pronta?vF3():

}

/* ══════════════════ TIMELINE ══════════════════
   Lo stesso giorno visto in orizzontale: una riga per autista, il tempo che scorre. È il modo
   in cui un dispatcher guarda davvero una giornata — non un elenco, una fascia oraria. */
function vTimeline(){
  const S=(SOL&&SOL.best&&CUBO&&SOL.stamp===CUBO.fatto)?SOL.best:[];
  const SV=servizi();
  if(!SV.length)return `<h2>Timeline</h2>
    ${barraGiorni()}`;
  const da=Math.min(...SV.map(s=>arcoRim(s).da))-30;
  const a =Math.max(...SV.map(s=>arcoRim(s).a))+30;
  const W=a-da;
  const x=m=>((m-da)/W*100).toFixed(2)+'%';
  const w=(m1,m2)=>((m2-m1)/W*100).toFixed(2)+'%';
  const ore=[]; for(let m=Math.ceil(da/60)*60;m<a;m+=60)ore.push(m);
  const righe=AUTISTI.map(d=>{
    const b=S.find(x=>x.d.n===d.n);
    return{d,b,svc:b?b.cat.svc:[]};
  }).sort((p,q)=>(q.svc.length?1:0)-(p.svc.length?1:0)||p.d.n.localeCompare(q.d.n));
  const scoperti=SV.filter(s=>!S.some(b=>b.cat.ids.includes(s.id)));
  return `<h2>Timeline</h2>
  ${barraGiorni()}
  ${barraStato()}
  ${pulsanteCalcola('tml')}
  <div class="tl">
    <div class="tlh"><div class="tlnome"></div><div class="tlbar">
      ${ore.map(m=>`<span class="tlora" style="left:${x(m)}">${m2t(m)}</span>`).join('')}</div></div>
    ${righe.map(r=>`<div class="tlr${r.svc.length?'':' vuoto'}">
      <div class="tlnome">${vaiA('drv',r.d.n,r.d.n)}
        ${r.b?`<em>${n1(r.b.cat.arcoMin/60)}h · ${r.b.qc}/${r.b.qa}/${r.b.qu}</em>`:'<em>libero</em>'}</div>
      <div class="tlbar">
        ${ore.map(m=>`<i class="tltick" style="left:${x(m)}"></i>`).join('')}
        ${r.svc.map((s,i)=>{const rr=arcoRim(s), ar=arco(s);
          const v=r.b.sch.vv[i];
          return `<span class="tlrim" style="left:${x(rr.da)};width:${w(rr.da,ar.da)}"
                    title="uscita dalla rimessa"></span>
                  <span class="tlsvc" data-vai2="svc|${esc(s.id)}"
                    style="left:${x(ar.da)};width:${w(ar.da,ar.a)}"
                    title="${esc(s.id+' · '+s.ora+' · '+(percorso(s)||s.dove||'')+' · '+s.cli+' · '+v.t)}">
                    <b>${esc(s.id)}</b> ${esc(v.t)}</span>
                  <span class="tlrim" style="left:${x(ar.a)};width:${w(ar.a,rr.a)}"
                    title="rientro in rimessa"></span>`;}).join('')}

/* ══════════════════ CALENDARIO ══════════════════
   Legge e scrive, e si scrive anche a mano. Quello che il sistema sa — il turno assegnato, le
   ore, il riposo — lo mette lui; quello che sa solo tu — riposo, ferie, malattia, permesso —
   lo scrivi tu, con un clic sulla cella. Niente di quello che serve a decidere sta scritto
   dentro la cella: la cella porta un numero e un colore, il resto si legge col mouse. */
const CAL_ST=[['','in servizio','','#fff'],
              ['R','riposo','R','#eef1f4'],
              ['F','ferie','F','#eaf1fb'],
              ['M','malattia','M','#fdf0ef'],
              ['?','ignoto','?','#f6f7f9']];
let CAL_GG=[], CAL_RIGHE=[];
let STATI_CAL={};                                    // "nome|data" → R, F, M, ?
let LIMITI={};                                       // "nome|data" → {da,a} · limiti di quel giorno
const statoCal=(n,iso)=>STATI_CAL[n+'|'+iso]||'';
const limiteCal=(n,iso)=>LIMITI[n+'|'+iso]||null;
function segnaCal(n,iso,st){
  const k=n+'|'+iso;
  if(!st)delete STATI_CAL[k]; else STATI_CAL[k]=st;
  if(iso===GIORNO){ CUBO=null; SOL=null; }
}
const prossimoStato=st=>{const i=CAL_ST.findIndex(x=>x[0]===st);
  return CAL_ST[(i+1)%CAL_ST.length][0];};
/* ═══ MUOVERSI NON È MODIFICARE ═══
   Una griglia si attraversa per guardare, e cambiare stato a ogni clic vuol dire non poterla
   attraversare. Il clic sposta la selezione e basta. Lo stato si cambia con una lettera —
   R, F, M, ? — o aprendo la cella col doppio clic. Le frecce si muovono come in un foglio di
   calcolo, e chi arriva da Excel non deve imparare niente. */
let CAL_SEL={r:0,c:0};
/* un autista ha un orologio se il suo contratto lo tiene dentro una finestra; una CELLA ha un
   orologio se quel giorno la finestra è diversa dalla sua */
const haOrario=d=>{const c=d.cal||{};
  return (c.da&&c.da!=='00:00')||(c.a&&c.a!=='23:59');};
const orarioDi=(d,iso)=>{const L=limiteCal(d.n,iso); if(L)return L;
  const c=d.cal||{}; return haOrario(d)?{da:c.da||'00:00',a:c.a||'23:59'}:null;};

/* la cella si apre e si scrive: stato, orario di quel giorno, e quello che il sistema sa già */
function schedaCella(n,iso){
  const d=aut(n); if(!d)return;
  const st=statoCal(n,iso), L=limiteCal(n,iso), c=d.cal||{};
  scheda(n+' · '+dataLunga(iso),
    fSel('cc_st','Stato',st,CAL_ST.map(x=>[x[0],x[1]]))
   +`<h3>Orario di quel giorno</h3>
     <p class="nota" style="margin-top:0">Vuoto vuol dire "come sempre": ${
       haOrario(d)?esc(c.da||'00:00')+'–'+esc(c.a||'23:59'):'nessun limite'}.
       Scrivendo qui vale solo per ${esc(dataLunga(iso))}.</p>
     <div class="cols2">
       <div>${fTxt('cc_da','Da',L?L.da:'','06:00')}</div>
       <div>${fTxt('cc_a','Fino a',L?L.a:'','22:00')}</div>
     </div>`
   +(iso===GIORNO?`<h3>Oggi</h3><p class="nota" style="margin-top:0">${(()=>{
      const b=(SOL&&SOL.best&&CUBO&&SOL.stamp===CUBO.fatto)?SOL.best.find(x=>x.d.n===n):null;
      return b?'Ha '+b.cat.ids.length+' servizi: <b>'+esc(b.cat.ids.join(', '))+'</b> · turno '
        +m2t(b.cat.da)+'–'+m2t(b.cat.a)+' = '+n1(b.cat.arcoMin/60)+'h · punteggi '
        +b.qc+'/'+b.qa+'/'+b.qu:'Nessun turno assegnato.';})()}</p>`:''),
    ()=>{
      segnaCal(n,iso,vTxt('cc_st')||'');
      const da=vTxt('cc_da').trim(), a=vTxt('cc_a').trim();
      if(da&&a)LIMITI[n+'|'+iso]={da,a}; else delete LIMITI[n+'|'+iso];
      if(iso===GIORNO){CUBO=null;SOL=null;}
    },
    (st||L)?()=>{ segnaCal(n,iso,''); delete LIMITI[n+'|'+iso];
      if(iso===GIORNO){CUBO=null;SOL=null;} }:null);
}

function vCalendario(){
  const N=15;
  const gg=[]; for(let k=-4;k<N-4;k++){
    const d=new Date(GIORNO+'T12:00:00'); d.setDate(d.getDate()+k);
    gg.push(d.toISOString().slice(0,10));
  }
  /* ═══ IL CALENDARIO LEGGE QUELLO CHE È SALVATO, GIORNO PER GIORNO ═══
     Guardava solo la soluzione in memoria — cioè un giorno solo, e solo finché il cubo c'era.
     Tutti gli altri quattordici risultavano vuoti anche quando erano assegnati da giorni. */
  const salvate={};
  const turno=(d,iso)=>{
    if(iso===GIORNO&&SOL&&SOL.best&&CUBO&&SOL.stamp===CUBO.fatto){
      const b=SOL.best.find(x=>x.d.n===d.n);
      if(b)return{da:b.cat.da,a:b.cat.a,n:b.cat.ids.length,ids:b.cat.ids};
    }
    if(!(iso in salvate))salvate[iso]=assegnazioneDi(iso);
    const A=salvate[iso];
    if(A){ const a=A.find(x=>x.d===d.n);
      if(a){ const sv=a.ids.map(id=>SERVIZI.find(y=>y.id===id)).filter(Boolean);
        if(sv.length)return{da:Math.min(...sv.map(y=>arcoRim(y).da)),
                            a:Math.max(...sv.map(y=>arcoRim(y).a)),n:a.ids.length,ids:a.ids}; } }
    const suoi=SERVIZI.filter(s=>dataDi(s)===iso&&(BLOCCHI[s.id]||{}).aut===d.n);
    if(!suoi.length)return null;
    return{da:Math.min(...suoi.map(s=>arcoRim(s).da)),a:Math.max(...suoi.map(s=>arcoRim(s).a)),
           n:suoi.length,ids:suoi.map(s=>s.id)};
  };
  const righe=AUTISTI.slice().sort((a,b)=>a.n.localeCompare(b.n));
  const tot=gg.map(iso=>AUTISTI.filter(d=>turno(d,iso)).length);
  CAL_SEL.r=Math.max(0,Math.min(CAL_SEL.r,righe.length-1));
  CAL_SEL.c=Math.max(0,Math.min(CAL_SEL.c,gg.length-1));
  CAL_GG=gg; CAL_RIGHE=righe.map(d=>d.n);
  return `<h2>Calendario</h2>
  ${barraGiorni()}
  ${barraStato()}
  <div class="riga">
    <span class="mut">frecce per muoversi · <b>R</b> riposo · <b>F</b> ferie · <b>M</b> malattia ·
      <b>?</b> ignoto · <b>canc</b> per togliere · doppio clic per aprire la cella</span>
    <span style="margin-left:auto">${CAL_ST.slice(1).map(([k,l,,c])=>
      `<span class="lgd" style="background:${c}">${k}</span> <span class="mut xs">${l}</span>`).join(' ')}</span>
  </div>
  <div class="slice"><table class="calx">
    <thead><tr><th class="rw">Autista</th>
      ${gg.map((iso,k)=>{const d=new Date(iso+'T12:00:00');
        return `<th class="n${iso===GIORNO?' oggi':''}${d.getDay()===0||d.getDay()===6?' festa':''}">
          <i>${GG[d.getDay()].slice(0,3)}</i>${d.getDate()}</th>`;}).join('')}
      <th class="n">tot</th></tr></thead><tbody>
    ${righe.map(d=>{
      let ore=0;
      const ri=righe.indexOf(d);
      const cel=gg.map((iso,k)=>{
        const st=statoCal(d.n,iso), t=turno(d,iso);
        const sd=CAL_ST.find(x=>x[0]===st)||CAL_ST[0];
        const sel=(CAL_SEL.r===ri&&CAL_SEL.c===k)?' sel':'';
        const L=limiteCal(d.n,iso);
        const oro=L?`<span class="oroc" title="oggi ${esc(L.da)}–${esc(L.a)}">◔</span>`:'';
        if(st&&!t)return `<td class="cx st${sel}" data-cal="${esc(d.n)}|${iso}|${ri}|${k}"
          style="background:${sd[3]}" title="${esc(d.n+' · '+iso+' — '+sd[1])}">${oro}<b>${sd[2]}</b></td>`;
        if(!t)return `<td class="cx${sel}" data-cal="${esc(d.n)}|${iso}|${ri}|${k}"
          title="${esc(d.n+' · '+iso+' — libero')}">${oro}·</td>`;
        const h=(t.a-t.da)/60; ore+=h;
        const prec=k>0?turno(d,gg[k-1]):null;
        const rip=prec?n1((t.da+1440-prec.a)/60):null;
        const notte=(()=>{const D=t2m(CFG.nottDa||'22:00'),A=t2m(CFG.nottA||'06:00');
          for(let m=Math.floor(t.da);m<Math.ceil(t.a);m+=15){const x=((m%1440)+1440)%1440;
            if(D<A?(x>=D&&x<A):(x>=D||x<A))return true;} return false;})();
        return `<td class="cx ${h>(CFG.turno/60)?'extra':'ok'}${notte?' notte':''}${st?' st':''}${sel}"
          data-cal="${esc(d.n)}|${iso}|${ri}|${k}"
          title="${esc(d.n)} · ${esc(iso)}&#10;${t.n} servizi: ${esc(t.ids.join(', '))}&#10;turno ${m2t(t.da)}–${m2t(t.a)} = ${n1(h)}h&#10;${
          rip!=null?'riposo dal giorno prima: '+rip+'h':'nessun turno il giorno prima'}${
          notte?'&#10;tocca la fascia notturna':''}${st?'&#10;segnato: '+sd[1]:''}">
          ${oro}<b>${n1(h)}</b><em>${t.n}</em></td>`;
      }).join('');
      return `<tr data-riga="cal|${esc(d.n)}"><td class="rw">${esc(d.n)}${
        haOrario(d)?`<span class="oro" title="orario di lavoro ${esc((d.cal||{}).da||'00:00')}–${esc((d.cal||{}).a||'23:59')}">◔</span>`:''}</td>${cel}
        <td class="n"><b>${n1(ore)}</b></td></tr>`;
    }).join('')}
    <tr class="pie"><td class="rw">in servizio</td>
      ${tot.map(n=>`<td class="cx"><b>${n||'·'}</b></td>`).join('')}<td></td></tr>
  </tbody></table></div>`;
}

/* ══════════════════ LOG ══════════════════
   Tutto quello che sta dietro alla soluzione: il contesto, le catene, i cubi. Non serve ogni
   giorno — serve quando un numero non torna, e allora deve esserci tutto. */
let LOGTAB='f0';

  ${(PAGINE_LOG[LOGTAB]||vF0)()}`}`;

const PAGINE_LOG={f0:vF0,f1:vF1,f2:vF2};
const PAGINE={prg:vProgramma,tml:vTimeline,cal:vCalendario,drv:vDrv,off:vOfficina,veh:vVeh,cli:vCli,fat:vFatture,cfg:vCfg,crt:vCriteri,log:vLog,zon:vZone};

/* ── la barra: il cubo si costruisce a pezzi e lo schermo racconta a che punto è ── */
function barra(titolo){
  let el=document.querySelector('.velo');
  if(!el){ el=document.createElement('div'); el.className='velo';
    el.innerHTML='<div class="barra"><div class="brh"><b class="brc"></b><span class="brn"></span></div>'
      +'<span class="brt"></span><div class="brb"><i></i></div>'
      +'<div class="brp"></div><div class="brf"></div></div>';
    document.body.appendChild(el); }
  el.querySelector('.brc').textContent=titolo;
  const stato={stop:false,annulla:false};
  return{
    stato,
    /* ═══ FERMARSI E ANNULLARE SONO DUE COSE DIVERSE ═══
       Fermarsi vuol dire "basta così, tengo quello che hai trovato". Annullare vuol dire
       "lascia perdere, rimetti com'era" — e serve quando ti accorgi di aver premuto per
       sbaglio, o di stare cercando sul giorno sbagliato. Senza la seconda, ogni ricerca
       avviata è una decisione irreversibile. */
    fermabile(testo){
      const f=el.querySelector('.brf');
      f.innerHTML='<button class="btn" data-b="stop" style="font-size:11.5px;padding:4px 12px">'+esc(testo)+'</button>'
        +'<button class="btn" data-b="ann" style="font-size:11.5px;padding:4px 12px;margin-left:8px">Annulla</button>';
      f.querySelector('[data-b=stop]').onclick=()=>{ stato.stop=true;
        el.querySelector('.brt').textContent='mi fermo, tengo il meglio trovato…'; };
      f.querySelector('[data-b=ann]').onclick=()=>{ stato.annulla=true; stato.stop=true;
        el.querySelector('.brt').textContent='annullo, rimetto com\'era…'; };
    },
    passo(testo,fatte,tot,nota){
      const p=tot?Math.round(fatte/tot*100):0;
      el.querySelector('.brt').textContent=testo;
      el.querySelector('.brn').textContent=tot?(fatte+' di '+tot):'';
      el.querySelector('.brb i').style.width=Math.max(2,p)+'%';
      el.querySelector('.brp').textContent=nota||(p+'%');
    },
    chiudi(){ el.remove(); }
  };
}
/* la ricerca, con la barra viva e il tasto per fermarla */
function cerca(ms,poi){
  const prima=SOL, primaCubo=CUBO;                   // com'era, per poterci tornare
  const b=barra('cerco la soluzione');
  b.fermabile('Fermati e tieni questa');
  b.passo('preparo le combinazioni…',0,1,'');
  const g=soluzionePassi(ms);
  let r=g.next();
  const avanti=()=>{
    if(b.stato.annulla){ b.chiudi(); SOL=prima; CUBO=primaCubo||CUBO;
      if(SOL&&CUBO)SOL.stamp=CUBO.fatto; disegna(); return; }
    const t=Date.now();
    while(!r.done&&Date.now()-t<60)r=g.next(b.stato.stop);
    if(!r.done){
      const v=r.value;
      /* non c'è una percentuale onesta da mostrare — nessuno sa quanto manca — quindi si
         mostra quello che c'è davvero: quanti servizi copre il meglio trovato, e da quanto
         tempo sta cercando. */
      b.passo('copre '+v.bestCop+' servizi su '+v.tot+' · somma '+v.bestTot,
              v.bestCop,v.tot,v.nodi.toLocaleString('it')+' combinazioni · '+Math.round(v.ms/1000)+'s');
      setTimeout(avanti,0); return;
    }
    b.chiudi(); poi(r.value);
  };
  setTimeout(avanti,20);
}
/* si assicura che il cubo ci sia, mostrando la barra se c'è da costruirlo */
function conCubo(poi){
  if(CUBO){ poi(); return; }
  const b=barra('costruisco i cubi');
  b.fermabile('Annulla');
  b.passo('genero le catene possibili…',0,1,'');
  const g=costruisciPassi();
  const avanti=()=>{
    const t=Date.now();
    if(b.stato.stop||b.stato.annulla){ b.chiudi(); CUBO=null; disegna(); return; }
    let r;
    do{ r=g.next(); }while(!r.done&&Date.now()-t<80);
    if(!r.done){
      const v=r.value;
      b.passo('catena '+v.fatte+' di '+v.tot,v.fatte,v.tot,
              v.celle.toLocaleString('it')+' celle · '+Math.round(v.fatte/v.tot*100)+'%');
      setTimeout(avanti,0); return;
    }
    b.chiudi(); poi();
  };
  setTimeout(avanti,20);
}
/* Ridisegnare non è navigare: se stavi guardando la riga ottanta, dopo un clic devi essere
   ancora lì. Il punto di scorrimento si tiene, e si azzera solo quando cambi davvero area. */
let SCROLL_FASE=null;
function disegna(){
  const m=$('#main');
  const y=(SCROLL_FASE===FASE)?window.scrollY:0;
  SCROLL_FASE=FASE;
  /* quali pagine hanno bisogno del cubo, e quali anche della soluzione. Erano scritte a mano
     con i vecchi nomi delle fasi: cambiati quelli, la barra non partiva più e la pagina restava
     ferma su "un momento" senza che nessuno stesse cercando niente. */
  /* ═══ UNA GIORNATA VUOTA NON HA NIENTE DA CALCOLARE ═══
     Il calendario e la timeline guardano avanti e indietro di giorni: la maggior parte sono
     vuoti, e su un giorno vuoto non c'è nessun cubo da costruire e nessuna soluzione da
     cercare. Fermarsi lì su "un momento" per sempre era il baco peggiore, perché non dava
     nemmeno modo di tornare indietro. */
  /* ═══ IL CALCOLO NON PARTE DA SOLO ═══
     Un cubo costa secondi, e partire ogni volta che si apre una pagina o si scrive un servizio
     è il modo più rapido per rendere insopportabile uno strumento che si usa cinquanta volte
     al giorno. Chi decide quando calcolare è chi guarda la giornata: c'è un pulsante, e finché
     non lo premi il programma resta un elenco — velocissimo — che ti lascia lavorare.
     L'unica cosa che si fa da sé è RIPRENDERE una soluzione già trovata e ancora valida: quella
     non costa niente, ed è la memoria di quello che avevi già deciso. */
  if(servizi().length&&['prg','tml'].includes(FASE)&&(!SOL||!CUBO||SOL.stamp!==CUBO.fatto)){
    const ripresa=CUBO?caricaSol():null;
    if(ripresa){ SOL=ripresa; SOL.stamp=CUBO.fatto; }
  }
  /* ═══ IL LOG È FATTO PER GUARDARE DENTRO ═══
     Su tutte le altre pagine il calcolo non parte da solo, ed è giusto: si sta lavorando. Ma
     aprire il Log VUOL DIRE chiedere di vedere il contesto, le catene e i cubi — non c'è altro
     motivo per andarci. Dirgli "prima calcola" era rispondere a una domanda con la stessa
     domanda. Qui il cubo si costruisce, e la barra lo racconta. */
  if(FASE==='log'&&servizi().length&&!CUBO){
    m.innerHTML='';
    conCubo(()=>{
      /* se una soluzione per questo giorno è già salvata, si riprende: il Log deve mostrare
         quello che hai deciso, non una soluzione diversa trovata adesso */
      const r=caricaSol(); if(r){ SOL=r; SOL.stamp=CUBO.fatto; }
      disegna();
    });
    return;
  }
  m.innerHTML=(DI_ESEMPIO&&FASE!=='cfg'
      ? `<div class="warn" style="margin-bottom:14px"><b>Sono i dati di esempio.</b>
          Se hai una tua configurazione da un'altra copia del file, aprila in
          <span class="lnk" id="vaiCfg">Configurazione</span> e incollala: il browser non la porta da solo
          da un file all'altro.</div>` : '')
    +(PAGINE[FASE]||vCfg)();
  if(FASE==='cfg'||FASE==='crt')bindCfg();
  const vc=$('#vaiCfg');
  if(vc)vc.onclick=()=>{ FASE='cfg';
    $$('#rail .fase').forEach(x=>x.classList.toggle('on',x.dataset.f==='cfg')); disegna(); };
  const nb=(id,f)=>{const e=$('#'+id); if(e)e.onclick=f;};
  nb('nuovoDrv',()=>schedaAutista(-1)); nb('nuovoVeh',()=>schedaVeicolo(-1));
  nb('nuovoCli',()=>schedaCliente(-1)); nb('nuovoSvc',()=>schedaServizio(-1));
  nb('nuovaZona',()=>schedaZona(-1));
  /* i due pulsanti che erano nell'area Tratte, ora sui Servizi */
  {const b=$('#svcStrada'), m=$('#svcMsg');
   if(b)b.onclick=async()=>{
     const L=tratteDaChiedere().filter(x=>!x.ho);
     if(!L.length)return;
     if(!(CFG.apiKey||'').trim()){ if(m)m.innerHTML='<b class="er">manca la chiave Google: la scrivi in Configurazione</b>'; return; }
     b.disabled=true; let n=0, err=0;
     for(const x of L){
       if(m)m.textContent='chiedo alla strada… '+(n+err)+' di '+L.length;
       try{ const quando=CFG.usaTraffico&&x.min!=null?quandoISO(x.min):null;
            TRATTE[x.k]=await chiediTratta(x.a,x.b,quando,x.tappe); n++; }
       catch(e){ err++; }
       await new Promise(r=>setTimeout(r,60));
     }
     salTratte(); tocca();
     if(m)m.innerHTML='<b class="ok">'+n+' tratte prese dalla strada</b>'+(err?' · '+err+' non riuscite':'');
     disegna();
   };}
  {const g=$('#svcScrivi'), m=$('#svcMsg');
   if(g)g.onclick=()=>{ let n=0;
     for(const sv of SERVIZI){ const t=trattaSvc(sv); if(!t)continue;
       sv.km=t.km; if(!aTempo(sv))sv.dur=Math.max(5,t.min); n++; }
     tocca(); if(m)m.innerHTML='<b class="ok">'+n+' servizi aggiornati</b>'; disegna(); };}
  {const g=$('#pniGo');
   if(g)g.onclick=()=>{ PNI.a=($('#pniA')||{}).value||''; PNI.b=($('#pniB')||{}).value||''; disegna(); };}
  nb('ancora',()=>cerca(CFG.msRicerca*4,r=>{ SOL=r; SOL.stamp=CUBO.fatto; salvaSol(SOL); disegna(); }));
  /* ── lo scambio mirato ── */
  $$('#main button[data-forza]').forEach(b=>b.onclick=()=>{
    const [sid,ri]=b.dataset.forza.split('|');
    const d=percheFuori(sid,SOL);
    const scelta=d.righe[+ri];
    if(!scelta)return;
    b.disabled=true; b.textContent='rifaccio…';
    setTimeout(()=>{
      const r=scambioMirato(SOL,scelta,4000);
      if(r.rotta){ alert('Quella mossa produrrebbe una giornata impossibile e non è stata applicata.'); disegna(); return; }
      if(!r.meglio&&r.dopo.cop<r.prima.cop){
        alert('Non conviene: dandolo a '+scelta.c.d.n+' resterebbero scoperti '
          +(r.prima.cop-r.dopo.cop)+' servizi in più.\n\nSciogliendo '+(r.sciolte.join(', ')||'niente')
          +' non si riesce a ricoprire tutto con chi resta.');
        disegna(); return;
      }
      SOL_PREC=SOL;
      MOSSE.push({testo:sid+' a '+scelta.c.d.n+' · sciolte '+(r.sciolte.join(', ')||'nessuna')
        +' · rifatti '+r.rifatti.length+' servizi',
        dcop:r.dopo.cop-r.prima.cop, dtot:r.dopo.tot-r.prima.tot});
      SOL=r.nuova; SOL.stamp=CUBO.fatto; salvaSol(SOL); disegna();
    },30);
  });
  /* il tasto destro su qualunque riga che rappresenti un servizio */
  $$('#main tr[data-riga^="svc|"],#main tr[data-riga^="mag|"]').forEach(tr=>{
    const id=tr.dataset.riga.split('|')[1];
    tr.oncontextmenu=e=>menuServizio(e,id);
  });
  $$('#main tr[data-riga^="drv|"],#main tr[data-riga^="off|"]').forEach(tr=>{
    const k=tr.dataset.riga.split('|')[1];
    tr.oncontextmenu=e=>tr.dataset.riga.startsWith('drv')?menuAutista(e,k):menuVeicolo(e,k);
  });
  $$('#main tr[data-riga^="veh|"]').forEach(tr=>{
    tr.oncontextmenu=e=>menuVeicolo(e,tr.dataset.riga.split('|')[1]);
  });
  $$('#main .tlnome .lnk[data-vai2^="drv|"]').forEach(el=>{
    el.oncontextmenu=e=>menuAutista(e,el.dataset.vai2.split('|')[1]);
  });
  $$('#main .tlsvc[data-vai2^="svc|"]').forEach(el=>{
    const id=el.dataset.vai2.split('|')[1];
    el.oncontextmenu=e=>menuServizio(e,id);
    el.ondblclick=()=>schedaServizio(SERVIZI.findIndex(x=>x.id===id));
  });
  nb('miniGo2',()=>{
    const r=applicaMini(SOL,CFG.msMini||8000);
    if(r.niente){ alert(r.niente); return; }
    SOL_PREC=SOL; SOL=r.nuova; SOL.stamp=CUBO.fatto; SOL.imp=impronta(); salvaSol(SOL);
    MOSSE.push({testo:'mini-cubo · '+r.r.scelte.length+' catene aggiunte',
      dcop:r.nuova.bestCop-(SOL_PREC.bestCop||0), dtot:r.nuova.bestTot-(SOL_PREC.bestTot||0)});
    disegna();
  });
  $$('#main [data-sogg]').forEach(b=>b.onclick=()=>{
    CFG.soglie.aut=+b.dataset.sogg; CUBO=null; SOL=null; tocca();
    conCubo(()=>cerca(CFG.msRicerca,r=>{ SOL=r; SOL.stamp=CUBO.fatto; SOL.imp=impronta();
      salvaSol(SOL); disegna(); }));
  });
  $$('#main input[data-sg]').forEach(r=>{
    r.oninput=()=>{ const b=r.parentNode.querySelector('b');
      if(b){b.textContent=r.value;b.className='gio';} };
    r.onchange=()=>{ segnaSoglia(r.dataset.sg,+r.value); CAMBIATO=true; salva(); segnaSalva(); disegna(); };
  });
  nb('sgReset',()=>{ delete SOGLIE_GG[GIORNO]; CUBO=null;SOL=null; CAMBIATO=true; salva(); disegna(); });
  nb('calcolaOra',()=>{
    CAMBIATO=false; CUBO=null; SOL=null;
    conCubo(()=>{
      if(!['prg','tml'].includes(FASE)){ disegna(); return; }
      MOSSE=[]; SOL_PREC=null;
      cerca(CFG.msRicerca,r=>{ SOL=r; SOL.stamp=CUBO.fatto; SOL.imp=impronta(); salvaSol(SOL); disegna(); });
    });
  });
  nb('calcolaVia',()=>{ try{localStorage.removeItem(CHIAVE+'_sol_'+GIORNO);}catch(e){}
    SOL=null; MOSSE=[]; SOL_PREC=null; disegna(); });
  /* il clic sposta la selezione e basta; il doppio clic apre la cella */
  /* ═══ SPOSTARE LA SELEZIONE NON È RIDISEGNARE ═══
     Ridisegnare la pagina per spostare un riquadro azzurro è come rifare il letto per girarsi
     nel sonno: la tabella si ricostruisce, e con lei si perde il punto in cui stavi guardando.
     La selezione è una cosa della vista, non dei dati: si sposta la classe e basta. */
  $$('#main td[data-cal]').forEach(td=>{
    const [n,iso,r,c]=td.dataset.cal.split('|');
    td.onclick=e=>{ if(e.detail>1)return; CAL_SEL={r:+r,c:+c}; mostraSel(); };
    td.ondblclick=()=>{ CAL_SEL={r:+r,c:+c}; mostraSel(); schedaCella(n,iso); };
  });
  $$('#main [data-logtab]').forEach(b=>b.onclick=()=>{ LOGTAB=b.dataset.logtab; disegna(); });
  $$('#main [data-off]').forEach(b=>b.onclick=()=>{
    const v=veic(b.dataset.off); if(!v)return;
    v.fermo=v.fermo?'':(prompt('Motivo del fermo','tagliando')||'tagliando');
    tocca(); disegna();
  });
  $$('#main [data-bl]').forEach(b=>b.onclick=()=>{
    const [id,aut,veh,cosa]=b.dataset.bl.split('|');
    blocca(id,{aut,veh},cosa); tocca(); disegna();
  });
  $$('#main [data-sbl]').forEach(b=>b.onclick=()=>{
    const [id,cosa]=b.dataset.sbl.split('|'); sblocca(id,cosa); tocca(); disegna();
  });
  nb('sblTuttiQui',()=>{ BLOCCHI={}; manuale(); });
  nb('sblTutti',()=>{ BLOCCHI={}; CUBO=null; SOL=null; tocca(); disegna(); });
  {const tutti=(cosa)=>{ (SOL&&SOL.best||[]).forEach(b=>b.cat.svc.forEach((sv,i)=>
       blocca(sv.id,{aut:b.d.n,veh:b.sch.vv[i].t},cosa))); manuale(); };
   nb('blTuttiAut',()=>tutti('aut')); nb('blTuttiVeh',()=>tutti('veh')); nb('blTutto',()=>tutti('due'));}
  nb('cedi5',()=>{ CFG.soglie.aut=Math.max(0,CFG.soglie.aut-5); CUBO=null; SOL=null; tocca(); disegna(); });
  nb('cediNo',()=>{ CFG.soglie.aut=SOG_AUT0; CUBO=null; SOL=null; tocca(); disegna(); });
  nb('miniGo',()=>{
    const b=$('#miniGo'); if(b){b.disabled=true;b.textContent='sto risolvendo…';}
    setTimeout(()=>{
      const r=applicaMini(SOL,CFG.msMini||8000);
      if(r.niente){ MINI_ESITO='<b class="er">'+esc(r.niente)+'</b>'; disegna(); return; }
      const prima=SOL.bestCop, dopo=r.nuova.bestCop;
      SOL_PREC=SOL; SOL=r.nuova; SOL.stamp=CUBO.fatto; salvaSol(SOL);
      MOSSE.push({testo:'mini-cubo su '+r.inv.scoperti.join(', ')+' · '+r.r.scelte.length
        +(r.r.scelte.length===1?' catena aggiunta':' catene aggiunte'),
        dcop:dopo-prima, dtot:SOL.bestTot-(SOL_PREC.bestTot||0)});
      MINI_ESITO=(dopo>prima?'<b class="ok">':'<b>')+(dopo-prima)+' servizi coperti in più</b> · '
        +r.r.scelte.length+' catene aggiunte · '
        +(r.r.completo?'il mini-cubo è arrivato in fondo: non esiste di meglio con quello che era avanzato'
                      :'il mini-cubo si è fermato al tempo massimo')
        +(r.nuova.scoperti.length?' · restano scoperti '+r.nuova.scoperti.join(', '):' · <b class="ok">giornata completa</b>');
      disegna();
    },30);
  });
  nb('annulla',()=>{ if(!SOL_PREC)return; SOL=SOL_PREC; SOL_PREC=null; MOSSE.pop(); salvaSol(SOL); disegna(); });
  nb('sisTutti',()=>{
    const b=$('#sisTutti'); b.disabled=true; b.textContent='sto sistemando…';
    setTimeout(()=>{
      SOL_PREC=SOL;
      let giri=0;
      while(giri++<12){
        const scop=(SOL.scoperti||[]).slice();
        if(!scop.length)break;
        let mossa=false;
        for(const sid of scop){
          const d=percheFuori(sid,SOL);
          for(const scelta of d.righe.slice(0,4)){
            const r=scambioMirato(SOL,scelta,1500);
            if(r.meglio&&!r.rotta){
              MOSSE.push({testo:sid+' a '+scelta.c.d.n+' · sciolte '+(r.sciolte.join(', ')||'nessuna')
                +' · rifatti '+r.rifatti.length+' servizi',
                dcop:r.dopo.cop-r.prima.cop, dtot:r.dopo.tot-r.prima.tot});
              SOL=r.nuova; SOL.stamp=CUBO.fatto; mossa=true; break;
            }
          }
          if(mossa)break;
        }
        if(!mossa)break;
      }
      salvaSol(SOL); disegna();
    },30);
  });
  nb('rifai',()=>{ try{localStorage.removeItem(CHIAVE+'_sol_'+GIORNO);}catch(e){}
    delete CUBI[GIORNO+'·'+impronta()]; CUBO=null;
    cerca(CFG.msRicerca,r=>{ SOL=r; SOL.stamp=CUBO.fatto; SOL.imp=impronta(); salvaSol(SOL); disegna(); }); });
  /* chi apre cosa, quando si fa doppio clic su una riga */
  VIS_APRI.drv=n=>schedaAutista(AUTISTI.findIndex(d=>d.n===n));
  VIS_APRI.veh=t=>schedaVeicolo(VEICOLI.findIndex(v=>v.t===t));
  VIS_APRI.cli=n=>schedaCliente(CLIENTI.findIndex(c=>c.n===n));
  VIS_APRI.zon=n=>schedaZona(ZONE.findIndex(z=>z.n===n));
  VIS_APRI.svc=i=>schedaServizio(SERVIZI.findIndex(x=>x.id===i));
  $$('#main [data-gg]').forEach(b=>b.onclick=()=>{ spostaGiorno(+b.dataset.gg); disegna(); });
  $$('#main [data-vaig]').forEach(b=>b.onclick=()=>{ GIORNO=b.dataset.vaig; CUBO=null;SOL=null;SVC_CACHE=null; disegna(); });
  {const g=$('#ggVai'); if(g)g.onchange=()=>{ if(g.value){GIORNO=g.value;CUBO=null;SOL=null;SVC_CACHE=null;disegna();} };}
  VIS_APRI.mag=id=>schedaMagg(id);
  legaTabelle();
  if(y)window.scrollTo(0,y);
  /* ═══ I FILTRI DEL LOG ERANO RIMASTI ORFANI ═══
     Le fasi non si chiamano più f1, f2, f3: stanno tutte dentro la pagina Log, e questa
     condizione — scritta coi nomi vecchi — non è più stata vera nemmeno una volta. Le caselle
     di ricerca e i menu c'erano, ma non erano collegati a niente. */
  if(FASE==='log'&&CUBO){
    /* le due schede che hanno filtri usano prefissi propri: f1_ per le catene, f2_ per i cubi */
    const lista=catFiltrate();
    if(LOGTAB==='f1')legaFiltri('f1_',()=>disegna());
    if(LOGTAB==='f2'){ legaFiltri('f2_',()=>disegna()); legaScelta('f2_',lista,()=>disegna()); }
  }
  $$('.qbtn').forEach(b=>b.onclick=()=>{QSEL=b.dataset.q;disegna();});
  $$('.vbtn').forEach(b=>b.onclick=()=>{VISTA=b.dataset.v;disegna();});
  $$('#main tr[data-x]').forEach(tr=>tr.onclick=()=>{XSEL=+tr.dataset.x;disegna();});
  $$('#main .lay[data-x]').forEach(el=>el.onclick=()=>{XSEL=+el.dataset.x;VISTA='griglia';disegna();});
  $$('#main td.cell[data-y]').forEach(td=>td.onclick=()=>{
    const xi=td.dataset.x!=null?+td.dataset.x:XSEL;
    $$('#main td.cell.sel').forEach(x=>x.classList.remove('sel'));
    td.classList.add('sel');
    apriCella(xi,+td.dataset.y,+td.dataset.z);
  });
  $$('#main tr[data-cell]').forEach(tr=>tr.onclick=()=>{
    const [x,y,z]=tr.dataset.cell.split(',').map(Number); apriCella(x,y,z);
  });
  $$('#main .lnk[data-cell]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const [x,y,z]=el.dataset.cell.split(',').map(Number); XSEL=x; apriCella(x,y,z);
  });
}
/* ═══ UNA SOLA AZIONE PRINCIPALE, SEMPRE NELLO STESSO POSTO ═══
   Il programma serve a una cosa: dire chi fa cosa domani. Tutto il resto è preparazione. Quindi
   quel gesto ha un pulsante suo, in cima, che c'è comunque, ovunque tu sia. */
{const v=$('#vaiSol'); if(v)v.onclick=()=>vaiFase('f3');}
/* e le scorciatoie: 1…4 per le quattro fasi del calcolo, 0 per la configurazione */
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const m={'1':'prg','2':'tml','3':'cal','4':'log','5':'crt'}[e.key];
  if(m){ e.preventDefault(); vaiFase(m); }
});
$$('#rail .fase').forEach(b=>b.onclick=()=>{
  FASE=b.dataset.f;
  $$('#rail .fase').forEach(x=>x.classList.toggle('on',x===b));
  $('#det').classList.remove('on');
  disegna();
});
$('#det .cls').onclick=()=>$('#det').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#det').classList.remove('on');});
$('#esporta').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({AUTISTI,VEICOLI,CLIENTI,SERVIZI,ZONE,CFG},null,1)],{type:'application/json'}));
  a.download='cubik_dati.json'; a.click();
};
$('#importa').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let j;
    try{ j=JSON.parse(r.result); }
    catch(x){ alert('Non riesco a leggere questo file: non è un JSON valido.'); return; }
    /* ① una lista di prenotazioni: righe con un orario dentro */
    const imp=importaPrenotazioni(j);
    if(imp){
      if(!imp.n){ alert('Il file ha delle righe ma nessuna con un orario leggibile.'); return; }
      migra(); puliciBlocchi(); tocca();
      if(imp.giorni.length)GIORNO=imp.giorni[0];
      CUBO=null; SOL=null; SVC_CACHE=null;
      alert(imp.n+' servizi importati'
        +(imp.giorni.length>1?' su '+imp.giorni.length+' giorni: '+imp.giorni.join(', ')
                             :' del '+imp.giorni[0])
        +(imp.avvisi.length?'\n\nDa guardare:\n· '+imp.avvisi.slice(0,8).join('\n· ')
          +(imp.avvisi.length>8?'\n· …e altri '+(imp.avvisi.length-8):''):''));
      disegna(); return;
    }
    /* ② un backup di CUBIK */
    const riconosciuto=['AUTISTI','VEICOLI','CLIENTI','SERVIZI','ZONE','CFG'].filter(k=>j&&j[k]);
    if(!riconosciuto.length){
      alert('Questo file non contiene niente che io sappia leggere.\n\n'
        +'Mi aspetto o un backup di CUBIK, oppure una lista di prenotazioni: una riga per '
        +'servizio, con almeno una colonna orario e una colonna data.');
      return;
    }
    if(j.AUTISTI)AUTISTI=j.AUTISTI; if(j.VEICOLI)VEICOLI=j.VEICOLI;
    if(j.CLIENTI)CLIENTI=j.CLIENTI; if(j.SERVIZI)SERVIZI=j.SERVIZI; if(j.ZONE)ZONE=j.ZONE;
    if(j.BLOCCHI)BLOCCHI=j.BLOCCHI; if(j.STATI_CAL)STATI_CAL=j.STATI_CAL;
    if(j.LIMITI)LIMITI=j.LIMITI; if(j.SOGLIE_GG)SOGLIE_GG=j.SOGLIE_GG;
    if(j.CFG)ripristinaCfg(j.CFG);
    if(j.CRIT)ripristinaCrit(j.CRIT,j.CFG);
    if(j.TRATTE)Object.assign(TRATTE,j.TRATTE);
    migra(); puliciBlocchi(); tocca(); disegna();
    alert('Caricato: '+riconosciuto.join(', ')+'.');
  };
  r.readAsText(f); e.target.value='';
};
$('#ripristina').onclick=()=>{ if(confirm('Torna ai dati di partenza e cancella quello che hai salvato?'))azzera(); };
$('#salvaBtn').onclick=()=>{
  if(!memoriaViva()){ alert('Questo browser non lascia salvare niente a un file aperto da disco.\n\n'
    +'Apri CUBIK da localhost — c\'è il file "avvia cubik.bat" nella stessa cartella — oppure usa il '
    +'codice in Configurazione per portarti i dati.'); return; }
  salvaTutto();
};
/* se te ne vai con qualcosa di non salvato, il browser te lo chiede */
window.addEventListener('beforeunload',e=>{ if(SPORCO){ e.preventDefault(); e.returnValue=''; } });

carTratte();
if(carica())DI_ESEMPIO=false;
disegna();
segnaSalva();
</script>
