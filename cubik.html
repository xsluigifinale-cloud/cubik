  if(cat.da<da||cat.a>a)return 'fuori dalla sua finestra '+m2t(da)+'–'+m2t(a);
  const TM=(+CFG.turnoMax||0)*60;
  if(TM>0&&cat.arcoMin>TM)
    return 'turno di '+n1(cat.arcoMin/60)+'h: oltre il massimo di '+CFG.turnoMax+'h';
  const lic=(d.lic&&d.lic.length)?d.lic:['B'];
  for(const v of sch.vv){
    const need=licDi(v);
    if(!lic.includes(need))return 'serve la patente '+need+' per un '+v.tip+' ('+v.t+'), lui ha '+lic.join('+');
  }
  return null;
}

function cella(cat,d,sch){
  const blocco=bloccante(cat,d,sch);
  const M=[];
  const giu=(k,punti,det,scatti,serv)=>{
    const c=CRIT[k]; if(!c||c.spento||!(punti>0))return;
    const n=c.ogni?Math.max(1,Math.round(scatti||1)):1;
    const base=punti*n;
    const f=(c.dove==='servizio'&&c.q.includes('cli'))?fatt(serv):1;
    const p=base*f;
    if(p<0.05)return;
    M.push({k,t:c.t,g:c.g,q:c.q,dove:c.dove,det:det||'',serv:serv?serv.id:null,cfg:punti,
            scatti:c.ogni?n:0,base:n1(base),magg:Math.round((f-1)*100),pts:n1(p)});
  };
  const suo=d.va?veic(d.va):null, gRif=gammaRif(d);

  /* ── quello che si paga su ogni servizio, col mezzo che ha in quel momento ── */
  cat.svc.forEach((s,ix)=>{
    const v=sch.vv[ix];
    const gv=gamma(v);

    /* COMFORT · la taglia venduta e quella che arriva */
    const salto=(CLASSI[v.tip]||0)-(CLASSI[s.tveh]||0);
    if(salto>0)giu('taglia',pt('taglia',Math.min(2,salto-1)),
      v.tip+' invece di '+s.tveh+(salto>1?' · '+salto+' taglie sopra':''),1,s);
    /* COMFORT · la gamma del mezzo */
    giu('gamma',pt('gamma',iGamma(gv)),v.t+' è '+gv,1,s);

    /* LINGUA */
    if(s.lang){ const g=(d.lang&&d.lang[s.lang])||'—';
      giu('cult',pt('cult',iGrado(g)),'chiede '+s.lang+' · '+d.n+' è '+g,1,s); }

    /* COMPETENZE che il cliente sente */
    if(s.vip) giu('vipB',pt('vipB',iGrado(d.vip)),'servizio VIP · '+d.n+' è '+(d.vip||'—'),1,s);
    if(s.tipo==='tour') giu('cice',pt('cice',iGrado(d.cice)),'è un tour · '+d.n+' è '+(d.cice||'—'),1,s);

    /* CONTINUITÀ */
    if(s.pass){
      const altrove=servizi().some(y=>y.id!==s.id&&y.pass===s.pass&&!cat.ids.includes(y.id));
      if(altrove)giu('conf',pt('conf'),'oggi '+s.pass+' viaggia anche fuori da questa catena',1,s);
    }

    /* APPARTENENZA · il mezzo dell'autista e la sua gamma */
    if(!suo||suo.t!==v.t)giu('propr',pt('propr'),(suo?'il suo è '+suo.t:'non ha un mezzo suo')+', qui '+v.t,1,s);
    /* ═══ LA FASCIA DI RIFERIMENTO VALE SOLO IN SOSTITUZIONE ═══
       La gamma di riferimento dice cosa dargli QUANDO IL SUO MEZZO NON C'È. Se sta guidando
       proprio il suo, quel confronto non ha senso: il suo mezzo è il suo mezzo, qualunque
       gamma abbia. Fascia superiore e inferiore scattano solo dopo Veicolo principale. */
    if(!suo||suo.t!==v.t){
      const dg=caratura(gRif)-caratura(gv);          // positivo = mezzo di caratura più alta
      if(dg>0)giu('gsu',pt('gsu'),'lui è '+gRif+', qui '+gv+(gv==='Luxury'?' (che vale Gold)':''),dg,s);
      if(dg<0)giu('ggiu',pt('ggiu'),'lui è '+gRif+', qui '+gv,-dg,s);
    }

    /* COMPETENZE VEICOLARI · quanto ci si fida di lui su quel mezzo */
    const cc=compDi(v);
    if(cc){ const k=CCOMP[cc], g=gradoComp(d,cc);
      giu(k,pt(k,iGrado(g)),v.tip+' ('+v.t+') · '+d.n+' è '+g+' su '+cc,1,s); }

    /* PERMESSI · si paga solo quello che si poteva evitare */
    for(const {z,rotti} of zonaOstile(s,v))
      if(z.modo==='permesso'&&eurZona(z)>0&&senzaPermesso(s,z)){
        const e=eurZona(z);
        giu('dogana',pt('dogana')+e*(+CFG.doganaEur||0),
          z.n+' · '+e+' € · '+rotti.join(', ')+' · si poteva evitare',1,s);
      }

    /* SPRECHI */
    if(servInNotte(s))giu('nott',pt('nott',iGamma(gv)),v.t+' è '+gv+' e va fuori di notte',1,s);
    if(gv==='Luxury'&&!s.lux&&!s.vip)giu('spacc',pt('spacc'),v.t+' è Luxury e nessuno l\'ha chiesto',1,s);
  });

  /* ── quello che si paga una volta sola, sulla catena ── */
  if(sch.cambi)giu('scamb',pt('scamb'),
    sch.vv[0].t+' fino alle '+cat.svc[sch.taglio-1].ora+', poi '+sch.vv[sch.vv.length-1].t,sch.cambi);

  /* CONTRATTO · lo sforo sull'orario di QUESTO autista */
  const turno=+CFG.turno||540;
  const pct=(cat.arcoMin-turno)/Math.max(1,turno);
  const lv=extraLiv(pct);
  if(lv>=0)giu('extra',pt('extra',lv),n1(cat.arcoMin/60)+'h su '+n1(turno/60)+'h di contratto · '
    +Math.round(pct*100)+'% in più',1);

  /* CONTRATTO · i notturni della settimana */
  /* Il Sorvegliante conta i notturni già fatti nella settimana, e quelli li sa il calendario:
     finché non c'è, il criterio resta spento e visibile. */

  /* PUNTUALITÀ · quanto si è dovuto stringere */
  {const ov=oreVere(cat), lv=cortaLiv(ov);
   if(lv>=0)giu('corta',pt('corta',lv),n1(ov)+'h di lavoro vero · '+dettaglioOre(cat)
     +' · '+etLiv('corta',lv),1);}
  if(cat.stretta)giu('compr',pt('compr'),'per far entrare l\'incastro si è tolto il '+cat.stretta
    +'% dell\'attesa dopo l\'orario · il massimo consentito è '+Math.round((+CFG.comprMax||0)*100)+'%',
    cat.stretta);

  /* ═══ LE TRE QUALITÀ NON SI SOMMANO ALLO STESSO MODO ═══
     Il CLIENTE non è uno: sono tre clienti diversi, e a ognuno interessa solo il proprio
     viaggio. Se il primo è servito benissimo e il terzo male, il terzo non si consola: la
     catena vale quanto il suo servizio peggiore.
     Il PARCO e l'AUTISTA invece sono uno solo per tutta la catena. Tre mezzi sbagliati costano
     tre volte all'azienda; tre gamme fuori posto le subisce lo stesso autista, una dopo
     l'altra. Lì i malus si sommano, perché è così che si accumulano nella realtà. */
  const perQ={};
  const nS=cat.svc.length;
  for(const q of ['cli','azi','aut']){
    const perServ=cat.svc.map(s=>M.filter(m=>m.dove==='servizio'&&m.q.includes(q)&&m.serv===s.id)
                                  .reduce((a,m)=>a+Math.round(m.pts*10),0));
    const dC=M.filter(m=>m.dove==='catena'&&m.q.includes(q)).reduce((a,m)=>a+Math.round(m.pts*10),0);
    const somma=perServ.reduce((a,b)=>a+b,0);
    const peggio=Math.max(0,...perServ), ip=perServ.indexOf(peggio);
    const usa=(q==='cli')?peggio:somma;              // il cliente il peggiore, gli altri la somma
    perQ[q]={modo:q==='cli'?'peggiore':'somma', serv:usa/10, cat:dC/10,
             quale:(q==='cli'&&ip>=0&&nS>1&&peggio>0)?cat.svc[ip].id:null,
             val:Math.max(0,Math.round(100-usa/10-dC/10)),
             valMed:Math.max(0,Math.round(100-Math.round(somma/nS)/10-dC/10))};
  }
  const qc=perQ.cli.val, qa=perQ.azi.val, qu=perQ.aut.val;
  const min=Math.min(qc,qa,qu);
  const med=Math.round((perQ.cli.valMed+perQ.azi.valMed+perQ.aut.valMed)/3);
  /* il punteggio cliente del VIP messo peggio, se in catena ce n'è uno */
  let qVIP=null;
  cat.svc.forEach(sv=>{ if(!sv.vip)return;
    const p=M.filter(m=>m.dove==='servizio'&&m.q.includes('cli')&&m.serv===sv.id)
             .reduce((a,m)=>a+m.pts,0);
    const v=Math.max(0,Math.round(100-p-perQ.cli.cat));
    if(qVIP==null||v<qVIP)qVIP=v; });
  const okVIP=qVIP==null||qVIP>=sogVIP();
  return{cat,d,sch,v:sch.vv[0],blocco,M,perQ,qc,qa,qu,min,med,qVIP,okVIP,
         media:Math.round((qc+qa+qu)/3), sopra:!blocco&&passa(qc,qa,qu)&&okVIP};
}

/* ═══ LE ORE DI LAVORO VERO ═══
   Il servizio non è solo il tratto col cliente a bordo: andarlo a prendere è lavoro, tornare
   indietro è lavoro, spostarsi da dove hai finito a dove devi ricominciare è lavoro. Un Roma
   → Napoli sono due ore e tre quarti col cliente e altrettante per arrivarci: contarne solo
   la metà e chiamarla "catena corta" è una bugia.
   L'unica cosa che non è lavoro è stare fermo in rimessa a non fare niente — e infatti i buchi
   fra un servizio e l'altro non entrano nel conto. */
/* il conto in chiaro, pezzo per pezzo: è l'unico modo per accorgersi che un posizionamento
   sconosciuto sta valendo venti minuti quando in realtà ne vale centoventi */
function dettaglioOre(cat){
  const S=cat.svc, p=[];
  p.push('rimessa→'+S[0].id+' '+rimessaVerso(S[0])+"′");
  for(let i=0;i<S.length;i++){
    p.push(S[i].id+' '+durataServizio(S[i])+"′");
    if(i<S.length-1){ const tr=trasferimento(S[i],S[i+1]);
      p.push('→'+S[i+1].id+' '+(tr==null?CFG.rimessa+"′ (tratta ignota)":tr+"′")); }
  }
  p.push(S[S.length-1].id+'→rimessa '+rimessaDa(S[S.length-1])+"′");
  return p.join(' + ');
}
function oreVere(cat){
  let m=0;
  const S=cat.svc;
  m+=rimessaVerso(S[0]);                             // uscita per il primo
  for(let i=0;i<S.length;i++){
    m+=durataServizio(S[i]);                         // il servizio, buffer compreso
    if(i<S.length-1){ const tr=trasferimento(S[i],S[i+1]); m+=(tr==null?CFG.rimessa:tr); }
  }
  m+=rimessaDa(S[S.length-1]);                       // rientro dopo l'ultimo
  return m/60;
}
const cortaLiv=ore=>{ const F=CFG.corteOre||[1,2,4];
  return ore<F[0]?0:ore<F[1]?1:ore<F[2]?2:-1; };

/* in quale fascia di sforo cade: -1 se non sfora abbastanza */
function extraLiv(pct){
  const F=CFG.extraFasce||[];
  let lv=-1;
  for(let i=0;i<F.length;i++) if(pct>=F[i])lv=i;
  return lv;
}
/* la catena tocca la fascia notturna DI QUELL'AUTISTA */
function catInNotte(cat,d){
  const D=t2m(CFG.nottDa||'22:00'), A=t2m(CFG.nottA||'06:00');
  const dentro=m=>{const x=((m%1440)+1440)%1440; return D<A?(x>=D&&x<A):(x>=D||x<A);};
  for(let m=Math.floor(cat.da);m<Math.ceil(cat.a);m+=15) if(dentro(m))return true;
  return false;
}
/* un servizio che tocca la notte, con la fascia standard */
function servInNotte(s){
  const r=arcoRim(s);
  const D=t2m(CFG.nottVeicDa||'23:00'), A=t2m(CFG.nottVeicA||'05:00');
  const dentro=m=>{const x=((m%1440)+1440)%1440; return D<A?(x>=D&&x<A):(x>=D||x<A);};
  for(let m=Math.floor(r.da);m<Math.ceil(r.a);m+=15) if(dentro(m))return true;
  return false;
}

/* ══════════ IL CUBO IN MEMORIA ══════════
   Mezzo milione di celle, ognuna con la sua lista di malus, non ci sta in memoria — il
   browser si ferma prima di finire. Quindi il cubo tiene solo i numeri, in array compatti:
   tre qualità e un codice per il motivo del blocco. Il conto per esteso, con ogni riga di
   malus, si rifà su richiesta quando apri una cella: costa un millisecondo e non occupa
   niente. Le celle fermate da un vincolo fisso non vengono nemmeno calcolate qui — sarebbe
   tempo speso su combinazioni che non esistono — ma se ci clicchi sopra il conto lo vedi
   lo stesso, perché il calcolo si può sempre rifare. */
/* ══════════ LE TABELLE ══════════
   Mezzo milione di celle non si possono calcolare una per una da zero: ogni cella rifarebbe
   gli stessi conti di mille altre. Ma i malus non dipendono tutti da tutto — ognuno guarda
   solo due cose alla volta:

     · Lingua e Competenza     guardano  servizio × autista
     · Taglia, Vuoti, Classe,
       Badge VIP, Luxury       guardano  servizio × veicolo
     · Casa, Salita, Discesa   guardano  autista × veicolo
     · Ore, Notturno, Riposo   guardano  la catena
     · Stesso passeggero       guarda    servizio × catena
     · Cambio veicolo          guarda    lo schema

   Quindi si calcolano prima quelle tabelle — poche migliaia di numeri — e poi ogni cella è
   una somma di caselle già pronte. Non è un'approssimazione: è la stessa aritmetica, scritta
   una volta sola invece di mezzo milione. Il pannello di dettaglio continua a rifare il conto
   per esteso, e i due numeri devono coincidere sempre. */
let TAB=null;
function tabelle(){
  const nS=servizi().length, nY=AUTISTI.length, nZ=VEICOLI.length;
  const iQ={cli:0,azi:1,aut:2};
  const TA=new Int32Array(nS*nY*3);          // servizio × autista
  const TB=new Int32Array(nS*nZ*3);          // servizio × veicolo
  const TD=new Int32Array(nY*nZ*3);          // autista × veicolo
  /* stessa aritmetica di giu(): scatti arrotondati, maggiorazione solo sui criteri cliente */
  const add=(T,base,k,p,scatti,serv)=>{
    const c=CRIT[k]; if(!c||c.spento||!(p>0))return;
    const n=c.ogni?Math.max(1,Math.round(scatti||1)):1;
    const f=(c.dove==='servizio'&&c.q.includes('cli'))?fatt(serv):1;
    const v=Math.round(p*n*f*10); if(v<1)return;
    for(const q of c.q)T[base+iQ[q]]+=v;
  };
  servizi().forEach((s,si)=>{
    AUTISTI.forEach((d,yi)=>{
      const b=(si*nY+yi)*3;
      if(s.lang)add(TA,b,'cult',pt('cult',iGrado((d.lang&&d.lang[s.lang])||'—')),1,s);
      if(s.vip) add(TA,b,'vipB',pt('vipB',iGrado(d.vip)),1,s);
      if(s.tipo==='tour')add(TA,b,'cice',pt('cice',iGrado(d.cice)),1,s);
    });
    VEICOLI.forEach((v,zi)=>{
      const b=(si*nZ+zi)*3;
      const salto=(CLASSI[v.tip]||0)-(CLASSI[s.tveh]||0);
      if(salto>0)add(TB,b,'taglia',pt('taglia',Math.min(2,salto-1)),1,s);
      add(TB,b,'gamma',pt('gamma',iGamma(gamma(v))),1,s);
      if(servInNotte(s))add(TB,b,'nott',pt('nott',iGamma(gamma(v))),1,s);
      if(gamma(v)==='Luxury'&&!s.lux&&!s.vip)add(TB,b,'spacc',pt('spacc'),1,s);
      for(const {z} of zonaOstile(s,v))
        if(z.modo==='permesso'&&eurZona(z)>0&&senzaPermesso(s,z))
          add(TB,b,'dogana',pt('dogana')+eurZona(z)*(+CFG.doganaEur||0),1,s);
    });
  });
  AUTISTI.forEach((d,yi)=>{
    const suo=d.va?veic(d.va):null, gRif=gammaRif(d);
    VEICOLI.forEach((v,zi)=>{
      const b=(yi*nZ+zi)*3;
      if(!suo||suo.t!==v.t){
        add(TD,b,'propr',pt('propr'),1,null);
        const dg=caratura(gRif)-caratura(gamma(v));
        if(dg>0)add(TD,b,'gsu',pt('gsu'),dg,null);
        if(dg<0)add(TD,b,'ggiu',pt('ggiu'),-dg,null);
      }
      const cc=compDi(v);
      if(cc){ const k=CCOMP[cc]; add(TD,b,k,pt(k,iGrado(gradoComp(d,cc))),1,null); }
    });
  });
  const iS={}, iY={}, iZ={};
  servizi().forEach((s,i)=>iS[s.id]=i); AUTISTI.forEach((d,i)=>iY[d.n]=i); VEICOLI.forEach((v,i)=>iZ[v.t]=i);
  TAB={TA,TB,TD,nS,nY,nZ,iS,iY,iZ,iQ};
  return TAB;
}

/* quello che dipende dalla catena e non dall'autista: la continuità e la compressione */
function catCosti(cat){
  const T=TAB, iQ=T.iQ;
  const serv=new Int32Array(cat.svc.length*3);
  const add=(arr,base,k,p,s)=>{
    const c=CRIT[k]; if(!c||c.spento||!(p>0))return;
    const f=(c.dove==='servizio'&&c.q.includes('cli'))?fatt(s):1;
    const v=Math.round(p*f*10); if(v<1)return;
    for(const q of c.q)arr[base+iQ[q]]+=v;
  };
  cat.svc.forEach((s,i)=>{
    if(!s.pass)return;
    const fuori=servizi().some(y=>y.id!==s.id&&y.pass===s.pass&&!cat.ids.includes(y.id));
    if(fuori)add(serv,i*3,'conf',pt('conf'),s);
  });
  const F=[0,0,0];
  const addF=(k,p,scatti)=>{
    const c=CRIT[k]; if(!c||c.spento||!(p>0))return;
    const n=c.ogni?Math.max(1,Math.round(scatti||1)):1;
    const v=Math.round(p*n*10); if(v<1)return;
    for(const q of c.q)F[iQ[q]]+=v;
  };
  if(cat.stretta)addF('compr',pt('compr'),cat.stretta);
  {const lv=cortaLiv(oreVere(cat)); if(lv>=0)addF('corta',pt('corta',lv),1);}
  return{serv,fissi:F};
}

/* il conto di una cella, letto dalle tabelle: solo i tre numeri */
function conto(cat,d,sch,cc,yi,sIdx){
  const T=TAB, {TA,TB,TD,nY,nZ}=T;
  const K=cat.svc.length;
  let m0=0,m1=0,m2=0, s0=0,s1=0,s2=0, mv=-1;
  for(let i=0;i<K;i++){
    const si=sIdx[i], zi=T.iZ[sch.vv[i].t];
    const a=(si*nY+yi)*3, b=(si*nZ+zi)*3, e=(yi*nZ+zi)*3, f=i*3;
    const v0=TA[a]  +TB[b]  +TD[e]  +cc.serv[f];
    const v1=TA[a+1]+TB[b+1]+TD[e+1]+cc.serv[f+1];
    const v2=TA[a+2]+TB[b+2]+TD[e+2]+cc.serv[f+2];
    if(v0>m0)m0=v0; if(v1>m1)m1=v1; if(v2>m2)m2=v2;
    if(cat.svc[i].vip&&v0>mv)mv=v0;                  // il VIP si giudica da solo
    s0+=v0; s1+=v1; s2+=v2;
  }
  let f0=cc.fissi[0], f1=cc.fissi[1], f2=cc.fissi[2];
  const met=(k,scatti)=>{ const c=CRIT[k]; if(!c||c.spento)return;
    const p=Math.round(pt(k)*Math.max(1,Math.round(scatti))*10); if(p<1)return;
    for(const q of c.q){ if(q==='cli')f0+=p; else if(q==='azi')f1+=p; else f2+=p; } };
  const metL=(k,lv)=>{ const c=CRIT[k]; if(!c||c.spento)return;
    const p=Math.round(pt(k,lv)*10); if(p<1)return;
    for(const q of c.q){ if(q==='cli')f0+=p; else if(q==='azi')f1+=p; else f2+=p; } };
  /* lo sforo dipende dal contratto di QUESTO autista, quindi si conta qui */
  const turno=+CFG.turno||540;
  const lv=extraLiv((cat.arcoMin-turno)/Math.max(1,turno));
  if(lv>=0)metL('extra',lv);

  if(sch.cambi)met('scamb',sch.cambi);
  const val=(s,f)=>Math.max(0,Math.round(100-s/10-f/10));
  const med=(s,f)=>Math.max(0,Math.round(100-Math.round(s/K)/10-f/10));
  /* il cliente si giudica sul servizio peggiore, il parco e l'autista sulla somma */
  return{qc:val(m0,f0),qa:val(s1,f1),qu:val(s2,f2),
         qVIP:mv<0?null:val(mv,f0),
         med:Math.round((med(s0,f0)+med(s1,f1)+med(s2,f2))/3)};
}
let CUBO=null;
/* Il cubo si costruisce a passi, così lo schermo può respirare e dire a che punto è: su una
   giornata vera sono milioni di celle, e restare fermi dieci secondi senza un segnale è il
   modo migliore per far pensare che si sia rotto qualcosa. */
function* costruisciPassi(){
  {const k=GIORNO+'·'+impronta(); if(CUBI[k]){CUBO=CUBI[k]; return CUBO;}}
  const t0=Date.now();
  const X=catene();
  const schemiX=[], dati=[], motivi=[''], mIdx={}, stat=[];
  let nTot=0,nBloc=0,nSotto=0,nOk=0,nCambi=0;
  const nY=AUTISTI.length;
  tabelle();
  for(let xi=0;xi<X.length;xi++){
    const cat=X[xi];
    const Z=schemi(cat); schemiX.push(Z);
    nCambi+=Z.filter(s=>s.cambi).length;
    const nZ=Z.length;
    const q=new Int16Array(nY*nZ*5), bl=new Uint16Array(nY*nZ);   // 3 qualità, lo spareggio, il VIP
    const haVIP=cat.svc.some(sv=>sv.vip);
    const cc=catCosti(cat), sIdx=cat.svc.map(s=>TAB.iS[s.id]);
    let sOk=0,sBloc=0,sSotto=0,sBest=-1,bY=-1,bZ=-1;
    for(let y=0;y<nY;y++){
      const d=AUTISTI[y];
      for(let z=0;z<nZ;z++){
        const k=y*nZ+z; nTot++;
        const b=bloccante(cat,d,Z[z]);
        if(b){ let ib=mIdx[b]; if(ib==null){ib=motivi.length;motivi.push(b);mIdx[b]=ib;}
               bl[k]=ib; nBloc++; sBloc++; continue; }
        const c=conto(cat,d,Z[z],cc,y,sIdx);
        q[k*5]=c.qc; q[k*5+1]=c.qa; q[k*5+2]=c.qu; q[k*5+3]=c.med;
        q[k*5+4]=c.qVIP==null?-1:c.qVIP;
        const okV=c.qVIP==null||c.qVIP>=sogVIP();
        if(!passa(c.qc,c.qa,c.qu)||!okV){nSotto++;sSotto++;}
        else{ nOk++; sOk++;
          const m=Math.round((c.qc+c.qa+c.qu)/3);
          if(m>sBest){sBest=m;bY=y;bZ=z;} }
      }
    }
    stat.push({ok:sOk,bloc:sBloc,sotto:sSotto,best:sBest,bY,bZ,
               cambi:Z.filter(s=>s.cambi).length,nZ});
    dati.push({q,bl,nZ});
    if(xi%50===0)yield{fatte:xi+1,tot:X.length,celle:nTot};
  }
  CUBO={X,Z:schemiX,dati,motivi,stat,nTot,nBloc,nSotto,nOk,nCambi,ms:Date.now()-t0,fatto:Date.now()};
  return CUBO;
}
/* chi non ha bisogno della barra lo chiama così, e scorre tutti i passi in un colpo */
function costruisci(){ const g=costruisciPassi(); let r=g.next(); while(!r.done)r=g.next(); return r.value; }
/* ═══ IL CUBO DI UN GIORNO NON SI RIFÀ DUE VOLTE ═══
   Un cubo costa. Rifarlo ogni volta che si torna su un giorno già visto è tempo buttato, e
   soprattutto è la differenza fra uno strumento che si usa e uno che si sopporta. Se ne tiene
   uno per giorno, con l'impronta dei dati che lo hanno generato: finché quella combacia, il
   cubo è ancora buono. Quando cambi un criterio le impronte cambiano tutte insieme, ed è
   giusto così — ma cambiare giorno non è cambiare dati. */
const CUBI={};
function cubo(){
  if(CUBO)return CUBO;
  const k=GIORNO+'·'+impronta();
  if(CUBI[k]){ CUBO=CUBI[k]; return CUBO; }
  const c=costruisci();
  CUBI[k]=c;
  /* non se ne tengono cento: gli ultimi otto giorni guardati bastano, il resto si rifà */
  const ks=Object.keys(CUBI); if(ks.length>8)delete CUBI[ks[0]];
  return c;
}

/* una cella letta dal cubo: solo i numeri, senza ricalcolare niente */
function cel(xi,yi,zi){
  const C=cubo(), D=C.dati[xi], k=yi*D.nZ+zi;
  const blocco=D.bl[k]?C.motivi[D.bl[k]]:null;
  const qc=D.q[k*5], qa=D.q[k*5+1], qu=D.q[k*5+2], med=D.q[k*5+3];
  const qv=D.q[k*5+4], qVIP=qv<0?null:qv;
  const okVIP=qVIP==null||qVIP>=sogVIP();
  const min=Math.min(qc,qa,qu);
  return{xi,yi,zi,cat:C.X[xi],d:AUTISTI[yi],sch:C.Z[xi][zi],blocco,qc,qa,qu,min,med,qVIP,okVIP,
         media:Math.round((qc+qa+qu)/3), sopra:!blocco&&passa(qc,qa,qu)&&okVIP};
}
/* la stessa cella, ma con tutto il conto in chiaro: si rifà quando serve */
function celPiena(xi,yi,zi){
  const C=cubo();
  return cella(C.X[xi],AUTISTI[yi],C.Z[xi][zi]);
}

/* ══════════════════ FASE 3 · LA SOLUZIONE ══════════════════
   Fra le celle sopra soglia si sceglie un insieme di catene che non si pestano i piedi —
   nessun servizio due volte, nessun autista in due catene, nessun mezzo in due catene —
   e che insieme coprono più servizi possibile, con la somma più alta.

   Due parole sull'ordine delle cose, perché conta.
   ① Prima la COPERTURA, poi la somma. Un servizio venduto e non coperto è un danno che
      nessun punteggio ripaga: quindi fra due soluzioni vince sempre quella che copre di più,
      e solo a pari copertura si guarda la somma. Prima si pretendeva la copertura totale, e
      se un solo servizio era incopribile non usciva niente: sbagliato, e pure poco utile.
   ② Si parte da una soluzione buona, non dal vuoto. Una ricerca che comincia senza niente in
      mano non ha modo di tagliare i rami, e vaga: è quello che succedeva su ventisette
      servizi, dove dopo quattro secondi non aveva ancora una sola giornata intera da
      mostrare. Quindi prima si costruisce in fretta una soluzione ragionevole, e da lì si
      migliora — con quella in mano, ogni ramo che non può batterla viene tagliato subito.
   ③ Si comincia dai servizi con meno strade. Se lasci scegliere per primo quello che tutti
      possono fare, si porta via l'autista che serviva all'unico difficile. */

/* ═══ QUANTO VALE UNA GIORNATA ═══
   Sommare i punteggi delle catene è la cosa che viene naturale, ed è sbagliata: due servizi
   messi in due catene separate portano due addendi, gli stessi due servizi messi in una catena
   sola ne portano uno. Il conto premia lo spezzare, sempre e comunque, anche quando spezzare
   vuol dire aprire un turno in più per niente — e contraddice il criterio che i turni corti
   dovrebbero scoraggiarli.
   Il punteggio di una catena è la qualità che ricevono i clienti che ci viaggiano dentro:
   allora il suo contributo alla giornata è quel punteggio moltiplicato per quanti servizi
   porta. Così le due strade si confrontano davvero, e a decidere tornano i criteri.
      catena unica a+b, vale 90   →  90 × 2 = 180
      due catene, valgono 87 e 87 →  87 + 87 = 174
   La media della giornata, di conseguenza, è per servizio: quanto riceve mediamente un cliente. */
const valCatena=c=>c.val*c.cat.ids.length;

/* le combinazioni in gara per ogni catena: le migliori, con un tetto per autista, così la
   scelta resta larga sui nomi invece di riempirsi di varianti dello stesso autista */
/* Quali servizi non hanno nemmeno una combinazione sopra soglia, con il cubo di adesso */
function senzaCombinazioni(){
  const C=cubo(), vivi=new Set();
  C.X.forEach((cat,xi)=>{
    for(let yi=0;yi<AUTISTI.length;yi++)for(let zi=0;zi<C.Z[xi].length;zi++){
      if(cel(xi,yi,zi).sopra){ cat.ids.forEach(id=>vivi.add(id)); return; }
    }
  });
  return servizi().filter(s=>!vivi.has(s.id)).map(s=>s.id);
}

function opzioni(){
  const C=cubo(), out=[];
  C.X.forEach((cat,xi)=>{
    const lista=[];
    AUTISTI.forEach((d,yi)=>C.Z[xi].forEach((sch,zi)=>{
      const c=cel(xi,yi,zi);
      if(c.sopra)lista.push({xi,yi,zi,cat,d,sch,targhe:sch.targhe,val:c.media,
                             qc:c.qc,qa:c.qa,qu:c.qu});
    }));
    if(!lista.length)return;
    lista.sort((a,b)=>b.val-a.val);
    /* ═══ POTARE PER PUNTEGGIO ERA IL MODO SBAGLIATO ═══
       Le combinazioni buone di una catena sono migliaia e alla ricerca se ne danno poche.
       Prima si prendevano semplicemente le migliori: sessanta e via. Ma sessanta celle di
       testa possono venire tutte da dieci autisti, e allora gli altri venti — per quella
       catena — la ricerca NON LI VEDE PROPRIO. Se poi al momento di incastrare la giornata
       l'unico rimasto libero è uno di quei venti, il servizio resta scoperto pur avendo,
       nel cubo, una combinazione sopra soglia: esattamente la cosa che non si spiegava.
       Il punteggio non è la cosa scarsa: gli AUTISTI sono la cosa scarsa. Quindi prima entra
       il meglio di ognuno — nessuno resta invisibile — e solo dopo si riempie il resto coi
       migliori in assoluto. */
    /* ═══ LE COSE SCARSE SONO DUE, NON UNA ═══
       La scrematura garantiva che nessun AUTISTA sparisse, e non diceva niente sui MEZZI. Ma
       la giornata si incastra su tutti e due: un autista libero il cui migliore accostamento
       usa un furgone impegnato non serve a niente, se con l'altro furgone — libero — sarebbe
       andato benissimo. Quelle combinazioni non arrivavano mai alla ricerca, e sono proprio
       quelle che poi si trovano a mano in dieci secondi.
       Quindi due passaggi di garanzia prima di qualunque taglio: il meglio di ogni autista, e
       il meglio di ogni schema veicolare. Solo dopo si riempie coi migliori in assoluto. */
    const perAut={}, tenuti=[], preso=new Set();
    const chiaveV=o=>o.targhe.join(',');
    for(const o of lista){                           // ① il meglio di ogni autista
      if(perAut[o.d.n])continue;
      perAut[o.d.n]=1; tenuti.push(o); preso.add(o);
    }
    const visteV=new Set(tenuti.map(chiaveV));
    for(const o of lista){                           // ② il meglio di ogni schema veicolare
      const k=chiaveV(o); if(visteV.has(k))continue;
      visteV.add(k); perAut[o.d.n]=(perAut[o.d.n]||0)+1;
      tenuti.push(o); preso.add(o);
    }
    const tetto=Math.max(CFG.altPerCatena,tenuti.length);
    for(const o of lista){                           // ③ poi i migliori, fino ai limiti
      if(tenuti.length>=tetto)break;
      if(preso.has(o))continue;
      const n=perAut[o.d.n]||0;
      if(n>=CFG.altPerAutista)continue;
      perAut[o.d.n]=n+1; tenuti.push(o); preso.add(o);
    }
    out.push({cat,xi,lista:tenuti,tutte:lista.length});
  });
  return out;
}

/* ═══ LA RICERCA, A PASSI ═══
   Una ricorsione non si può fermare a metà: parte e torna quando ha finito, e finché non
   torna la finestra è morta — è quello che succedeva mettendo un tempo lungo. Quindi la
   ricerca è scritta con una pila esplicita: ogni tanto si ferma da sola, lascia respirare
   lo schermo, e riprende esattamente da dov'era. Così la barra si muove davvero, e il
   pulsante per fermarsi funziona: quello che ha trovato fino a quel momento è già buono. */
function* soluzionePassi(budget){
  const t0=Date.now(), tMax=budget||CFG.msRicerca||8000;
  const opz=opzioni();
  const SV=servizi(), N=SV.length, idx={}; SV.forEach((s,i)=>idx[s.id]=i);
  const perServ=[]; for(let i=0;i<N;i++)perServ.push([]);
  opz.forEach(o=>o.cat.svc.forEach(s=>perServ[idx[s.id]].push(o)));
  const senzaStrada=SV.filter((s,i)=>!perServ[i].length).map(s=>s.id);
  /* ═══ CHI È DAVVERO IL PIÙ DIFFICILE ═══
     Contare le catene inganna, ed è il motivo per cui certi servizi restavano fuori. Un VIP
     che chiede la Luxury può comparire in centosettanta catene diverse — sembra il più libero
     della giornata — mentre in tutte quelle catene ci sono tre autisti soli e un mezzo solo.
     Se lo si guarda per ultimo, quei tre sono già impegnati altrove e non resta niente.
     La difficoltà vera non sono le strade: sono le PERSONE e i MEZZI che quelle strade hanno
     in fondo. Quindi si conta quanti autisti distinti e quanti mezzi distinti potrebbero
     farlo, e si comincia da chi ne ha meno. */
  const risorse=[];
  for(let i=0;i<N;i++){
    const aut=new Set(), veh=new Set();
    for(const o of perServ[i]){
      const pos=o.cat.ids.indexOf(SV[i].id);
      for(const c of o.lista){
        aut.add(c.d.n);
        /* il mezzo che conta è quello che tocca a QUESTO servizio, non tutti quelli che la
           catena usa strada facendo: se in parco c'è una sola Luxury, il VIP ha un mezzo solo
           anche quando compare in cento catene */
        const v=c.sch&&c.sch.vv&&c.sch.vv[pos]; if(v)veh.add(v.t);
      }
    }
    risorse.push(Math.min(aut.size||99, veh.size||99));
  }
  const ordine=SV.map((s,i)=>i).sort((a,b)=>risorse[a]-risorse[b]||perServ[a].length-perServ[b].length);
  const rango=new Array(N); ordine.forEach((i,r)=>rango[i]=r);
  /* il massimo che un servizio può rendere: il punteggio della migliore catena che lo comprende */
  const tetto=[]; for(let i=0;i<N;i++){
    let m=0; for(const o of perServ[i]) if(o.lista.length) m=Math.max(m,o.lista[0].val);
    tetto.push(m);
  }
  opz.forEach(o=>{ let m=0; for(const s of o.cat.svc)m|=(1<<idx[s.id]); o.mask=m; });

  /* ① una soluzione subito, per avere qualcosa in mano e poter tagliare */
  const aut=new Set(), veh=new Set(), scelte=[];
  const subito=()=>{
    let mask=0, cop=0, tot=0;
    const a2=new Set(), v2=new Set(), sel=[];
    for(const i of ordine){
      if(mask&(1<<i))continue;
      let mi=null;
      for(const o of perServ[i]){
        if(o.mask&mask)continue;
        for(const c of o.lista){
          if(a2.has(c.d.n)||c.targhe.some(t=>v2.has(t)))continue;
          const peso=c.val*o.cat.svc.length;         // quanto rende in tutto, non a catena
          if(!mi||peso>mi.peso)mi={o,c,peso};
          break;
        }
      }
      if(!mi){ mask|=(1<<i); continue; }
      mask|=mi.o.mask; cop+=mi.o.cat.svc.length; tot+=mi.c.val*mi.o.cat.svc.length;
      a2.add(mi.c.d.n); mi.c.targhe.forEach(t=>v2.add(t)); sel.push(mi.c);
    }
    /* ═══ E ADESSO SI COPRE QUELLO CHE È RIMASTO FUORI ═══
       La prima passata sceglie, per ogni servizio, la combinazione che rende di più. È una
       misura di qualità, e la qualità non sa niente della copertura: chi arriva prima si
       prende gli autisti buoni, e a chi arriva dopo non resta nessuno — anche quando una
       combinazione libera, magari mediocre, esisteva.
       La copertura viene PRIMA del punteggio, sempre. Quindi si ripassa: per ogni servizio
       rimasto scoperto si cerca qualunque combinazione ancora disponibile, la migliore fra
       quelle che restano, e la si prende. Un servizio coperto male vale più di un servizio
       non coperto — e se poi si può fare meglio, ci pensa la ricerca. */
    let giro=0;
    while(giro++<4){
      let messo=false;
      for(let i=0;i<N;i++){
        if(mask&(1<<i))continue;
        let mi=null;
        for(const o of perServ[i]){
          if(o.mask&mask)continue;
          for(const c of o.lista){
            if(a2.has(c.d.n)||c.targhe.some(t=>v2.has(t)))continue;
            const peso=c.val*o.cat.svc.length;
            if(!mi||peso>mi.peso)mi={o,c,peso};
          }
        }
        if(!mi)continue;
        mask|=mi.o.mask; cop+=mi.o.cat.svc.length; tot+=mi.c.val*mi.o.cat.svc.length;
        a2.add(mi.c.d.n); mi.c.targhe.forEach(t=>v2.add(t)); sel.push(mi.c);
        messo=true;
      }
      if(!messo)break;
    }
    return{cop,tot,sel};
  };
  const g=subito();
  let bestCop=g.cop, bestTot=g.tot, best=g.sel, nodi=0, fermato=false, finito=false;

  /* ② e adesso si migliora, un pezzo alla volta */
  const primoLibero=mask=>{
    let p=-1;
    for(let i=0;i<N;i++)if(!(mask&(1<<i))&&(p<0||rango[i]<rango[p]))p=i;
    return p;
  };
  const candidati=(mask,primo)=>{
    const out=[];
    for(const o of perServ[primo]){
      if(o.mask&mask)continue;
      for(const c of o.lista)out.push({o,c});
    }
    out.push(null);                                   // l'ultima strada: lasciarlo scoperto
    return out;
  };
  const nuovoFrame=(mask,cop,tot)=>{
    let rimasti=0,resto=0;
    for(let i=0;i<N;i++)if(!(mask&(1<<i))){rimasti++;resto+=tetto[i];}
    const primo=primoLibero(mask);
    if(primo<0){
      if(cop>bestCop||(cop===bestCop&&tot>bestTot+0.5)){bestCop=cop;bestTot=tot;best=scelte.slice();}
      return null;
    }
    if(cop+rimasti<bestCop)return null;
    if(cop+rimasti===bestCop&&tot+resto<=bestTot)return null;
    return{mask,cop,tot,primo,cand:candidati(mask,primo),i:0,appl:null};
  };
  const pila=[]; const f0=nuovoFrame(0,0,0); if(f0)pila.push(f0);
  let ultimo=Date.now();
  while(pila.length){
    const f=pila[pila.length-1];
    if(f.appl){ aut.delete(f.appl.c.d.n); f.appl.c.targhe.forEach(t=>veh.delete(t)); scelte.pop(); f.appl=null; }
    if(f.i>=f.cand.length){ pila.pop(); continue; }
    const sc=f.cand[f.i++];
    let fig=null;
    if(sc===null) fig=nuovoFrame(f.mask|(1<<f.primo),f.cop,f.tot);
    else{
      nodi++;
      if(aut.has(sc.c.d.n)||sc.c.targhe.some(t=>veh.has(t)))continue;
      aut.add(sc.c.d.n); sc.c.targhe.forEach(t=>veh.add(t)); scelte.push(sc.c);
      f.appl=sc;
      fig=nuovoFrame(f.mask|sc.o.mask,f.cop+sc.o.cat.svc.length,f.tot+sc.c.val*sc.o.cat.svc.length);
      if(!fig){ aut.delete(sc.c.d.n); sc.c.targhe.forEach(t=>veh.delete(t)); scelte.pop(); f.appl=null; }
    }
    if(fig)pila.push(fig);
    const ora=Date.now();
    if(ora-ultimo>70){
      ultimo=ora;
      if(ora-t0>tMax){ fermato=true; break; }
      const stop=yield{nodi,bestCop,bestTot:Math.round(bestTot),ms:ora-t0,
                       profondita:pila.length,tot:N};
      if(stop){ fermato=true; break; }
    }
  }
  if(!pila.length)finito=true;
  const copre=new Set(); (best||[]).forEach(c=>c.cat.svc.forEach(s=>copre.add(s.id)));
  return{opz,best,bestTot:Math.round(bestTot),bestCop,nodi,completo:finito,fermato,
         ms:Date.now()-t0,greedy:g.cop,senzaStrada,
         scoperti:SV.filter(x=>!copre.has(x.id)).map(x=>x.id)};
}
function soluzione(budget){ const g=soluzionePassi(budget); let r=g.next(); while(!r.done)r=g.next(); return r.value; }

/* ═══ PERCHÉ QUESTO SERVIZIO È RIMASTO FUORI ═══
   Un servizio con combinazioni sopra soglia che resta scoperto non è mai un mistero: o le sue
   strade portano tutte a un autista o a un mezzo che la soluzione ha già impegnato altrove, o
   la ricerca non è arrivata fin lì. La differenza conta, perché nel primo caso aspettare non
   serve a niente e nel secondo sì. Quindi si guarda ogni sua combinazione e si dice, una per
   una, chi la occupa. */
/* ═══ PERCHÉ QUESTI DUE NON STANNO INSIEME? ═══
   La domanda che ti fai guardando la soluzione è sempre la stessa: "questo e quello potevano
   andare sullo stesso autista, e ne liberavo uno". Rispondere a mano vuol dire cercare fra
   centinaia di catene. Qui la risposta è in tre righe: la catena con tutti e due esiste? se
   non esiste, perché? se esiste, quanto vale la sua cella migliore, e dove stanno adesso? */
function percheNonInsieme(idA,idB){
  const a=SERVIZI.find(x=>x.id===idA), b=SERVIZI.find(x=>x.id===idB);
  if(!a||!b)return{err:'uno dei due codici non corrisponde a nessun servizio'};
  if(a.id===b.id)return{err:'sono lo stesso servizio'};
  if(conflitto(a,b)){
    const xa=arcoRim(a), xb=arcoRim(b);
    const [p,d]=arco(a).da<=arco(b).da?[a,b]:[b,a];
    const tr=trasferimento(p,d);
    const perche = sovrappone(xa,xb)
      ? 'le due finestre si sovrappongono: '+m2t(xa.da)+'–'+m2t(xa.a)+' contro '+m2t(xb.da)+'–'+m2t(xb.a)
      : (tr!=null
         ? 'fra '+p.id+' e '+d.id+' servono '+tr+' minuti di trasferimento e ne restano '
           +(arco(d).da-arco(p).a)
         : 'le finestre non ci stanno nemmeno stringendo i tempi');
    return{conflitto:true,perche};
  }
  const C=cubo();
  const cat=C.X.filter(c=>c.ids.includes(idA)&&c.ids.includes(idB))
                .sort((x,y)=>x.ids.length-y.ids.length);
  if(!cat.length)return{err:'non sono in conflitto, ma nessuna catena li contiene entrambi: quasi '
    +'sempre è il limite di lunghezza catena in Configurazione, oggi '+(CFG.maxCat||'nessuno')};
  let best=null;
  for(const c of cat){
    const xi=C.X.indexOf(c);
    for(let yi=0;yi<AUTISTI.length;yi++)for(let zi=0;zi<C.Z[xi].length;zi++){
      const q=cel(xi,yi,zi);
      if(q.blocco)continue;
      if(!best||q.med>best.med)best=q;
    }
  }
  if(!best)return{cat,err:'la catena esiste ma ogni combinazione di autista e mezzo è impossibile: '
    +'in Fase 2 si vede quale vincolo la blocca'};
  const dove=id=>{ const x=(SOL&&SOL.best||[]).find(y=>y.cat.ids.includes(id));
    return x?{drv:x.d.n,cat:x.cat,val:x.val}:null; };
  return{cat,best,A:dove(idA),B:dove(idB)};
}

function percheFuori(sid,S){
  const C=cubo();
  const usatiD=new Map(), usatiV=new Map();
  (S.best||[]).forEach(b=>{
    usatiD.set(b.d.n,b.cat.id);
    b.targhe.forEach(t=>usatiV.set(t,b.cat.id));
  });
  /* ═══ SI GUARDA IL CUBO, NON LA LISTA CHE LA RICERCA HA RICEVUTO ═══
     Prima si leggevano le opzioni già potate: se una combinazione era stata tagliata via non
     compariva qui, e la pagina diceva "tutte occupate" mentre in Fase 2 se ne vedevano di
     libere. Una diagnosi che legge da una fonte diversa da quella che l'utente ha davanti è
     peggio di nessuna diagnosi. */
  const righe=[]; let sopra=0;
  const dentroRicerca=new Set();
  for(const o of (S.opz||[]))if(o.cat.ids.includes(sid))
    for(const c of o.lista)dentroRicerca.add(o.xi+'|'+c.yi+'|'+c.zi);
  for(let xi=0;xi<C.X.length;xi++){
    const cat=C.X[xi];
    if(!cat.ids.includes(sid))continue;
    const o={cat,xi};
    for(let yi=0;yi<AUTISTI.length;yi++)for(let zi=0;zi<C.Z[xi].length;zi++){
      const cc=cel(xi,yi,zi);
      if(!cc.sopra)continue;
      const c={xi,yi,zi,cat,d:AUTISTI[yi],sch:C.Z[xi][zi],targhe:C.Z[xi][zi].targhe,
               val:cc.media,qc:cc.qc,qa:cc.qa,qu:cc.qu,
               vista:dentroRicerca.has(xi+'|'+yi+'|'+zi)};
      sopra++;
      const dOcc=usatiD.get(c.d.n), vOcc=c.targhe.find(t=>usatiV.get(t));
      let perche;
      if(dOcc&&vOcc)perche='<span class="wr">'+esc(c.d.n)+' è su '+dOcc+' e '+esc(vOcc)+' è su '+usatiV.get(vOcc)+'</span>';
      else if(dOcc)perche='<span class="wr">'+esc(c.d.n)+' è già impegnato su '+dOcc+'</span>';
      else if(vOcc)perche='<span class="wr">'+esc(vOcc)+' è già impegnato su '+usatiV.get(vOcc)+'</span>';
      else perche=c.vista
        ? '<span class="er">autista e mezzo sarebbero liberi: qui la ricerca non c\'è arrivata</span>'
        : '<span class="er">autista e mezzo sarebbero liberi, e questa combinazione la ricerca non l\'ha nemmeno ricevuta</span>';
      righe.push({cat:o.cat,c,perche,libera:!dOcc&&!vOcc,vista:c.vista});
    }
  }
  righe.sort((a,b)=>(a.libera?0:1)-(b.libera?0:1)||b.c.val-a.c.val);
  return{sopra,righe,libere:righe.filter(r=>r.libera).length};
}

/* ══════════════════ IL MINI-CUBO ══════════════════
   Rifare tutta la giornata per sistemare un servizio è come rifare la casa per cambiare una
   maniglia. Qui invece si tiene fermo tutto quello che va bene e si ricostruisce solo il pezzo
   che si è dovuto sciogliere: pochi servizi, poche risorse, e su un problema così piccolo la
   ricerca non si accontenta del meglio trovato — arriva all'ottimo e lo dimostra.
   In letteratura si chiama ricerca a vicinato ampio. Qui il vicinato lo scegli tu, indicando
   a chi vuoi dare il servizio rimasto fuori: nessuno lo sa meglio di chi guarda la giornata. */
function miniCubo(idsLiberi,autUsati,vehUsati,ms){
  const t0=Date.now(), tMax=ms||3000;
  const dentro=new Set(idsLiberi);
  const N=idsLiberi.length, idx={}; idsLiberi.forEach((id,i)=>idx[id]=i);
  if(!N)return{scelte:[],cop:0,tot:0,completo:true,scoperti:[]};
  /* solo le catene fatte di servizi liberi, e solo con autisti e mezzi ancora disponibili */
  /* le combinazioni si prendono dal cubo, senza scremature: qui sono poche e le vogliamo tutte */
  const C=cubo(), opz=[];
  for(let xi=0;xi<C.X.length;xi++){
    const cat=C.X[xi];
    if(!cat.ids.every(id=>dentro.has(id)))continue;
    const lista=[];
    for(let yi=0;yi<AUTISTI.length;yi++){
      if(autUsati.has(AUTISTI[yi].n))continue;
      for(let zi=0;zi<C.Z[xi].length;zi++){
        const sch=C.Z[xi][zi];
        if(sch.targhe.some(t=>vehUsati.has(t)))continue;
        const c=cel(xi,yi,zi);
        if(!c.sopra)continue;
        lista.push({xi,yi,zi,cat,d:AUTISTI[yi],sch,targhe:sch.targhe,val:c.media,
                    qc:c.qc,qa:c.qa,qu:c.qu});
      }
    }
    if(!lista.length)continue;
    lista.sort((a,b)=>b.val-a.val);
    let m=0; for(const id of cat.ids)m|=(1<<idx[id]);
    opz.push({cat,lista,mask:m});
  }
  const perServ=[]; for(let i=0;i<N;i++)perServ.push([]);
  opz.forEach(o=>o.cat.ids.forEach(id=>perServ[idx[id]].push(o)));
  /* stessa misura di difficoltà del cubo grande: contano le persone e i mezzi, non le strade */
  const risorse=[];
  for(let i=0;i<N;i++){
    const aut=new Set(), veh=new Set();
    for(const o of perServ[i]){
      const pos=o.cat.ids.indexOf(idsLiberi[i]);
      for(const c of o.lista){ aut.add(c.d.n);
        const v=c.sch&&c.sch.vv&&c.sch.vv[pos]; if(v)veh.add(v.t); }
    }
    risorse.push(Math.min(aut.size||99, veh.size||99));
  }
  const ordine=idsLiberi.map((id,i)=>i).sort((a,b)=>risorse[a]-risorse[b]||perServ[a].length-perServ[b].length);
  const rango=new Array(N); ordine.forEach((i,r)=>rango[i]=r);
  const tetto=[]; for(let i=0;i<N;i++){ let m=0;
    for(const o of perServ[i])if(o.lista.length)m=Math.max(m,o.lista[0].val);
    tetto.push(m); }
  let bestCop=-1,bestTot=-1,best=[],tagliato=false;
  const aut=new Set(autUsati), veh=new Set(vehUsati), scelte=[];
  const gira=(mask,cop,tot)=>{
    if(Date.now()-t0>tMax){tagliato=true;return;}
    let primo=-1,rimasti=0,resto=0;
    for(let i=0;i<N;i++)if(!(mask&(1<<i))){rimasti++;resto+=tetto[i];
      if(primo<0||rango[i]<rango[primo])primo=i;}
    if(primo<0){ if(cop>bestCop||(cop===bestCop&&tot>bestTot+0.5)){bestCop=cop;bestTot=tot;best=scelte.slice();} return; }
    if(cop+rimasti<bestCop)return;
    if(cop+rimasti===bestCop&&tot+resto<=bestTot)return;
    for(const o of perServ[primo]){
      if(o.mask&mask)continue;
      for(const c of o.lista){
        if(aut.has(c.d.n)||c.targhe.some(t=>veh.has(t)))continue;
        aut.add(c.d.n); c.targhe.forEach(t=>veh.add(t)); scelte.push(c);
        gira(mask|o.mask,cop+o.cat.ids.length,tot+c.val*o.cat.ids.length);
        scelte.pop(); aut.delete(c.d.n); c.targhe.forEach(t=>veh.delete(t));
        if(tagliato)return;
      }
    }
    gira(mask|(1<<primo),cop,tot);                   // lasciarlo scoperto è l'ultima strada
  };
  gira(0,0,0);
  const copre=new Set(); best.forEach(b=>b.cat.ids.forEach(id=>copre.add(id)));
  return{scelte:best,cop:bestCop<0?0:bestCop,tot:bestTot<0?0:bestTot,completo:!tagliato,
         scoperti:idsLiberi.filter(id=>!copre.has(id))};
}

/* ═══ IL MINI-CUBO DEGLI SCOPERTI ═══
   La ricerca grande guarda la giornata intera, e su una giornata vera le combinazioni sono
   troppe per finirle: si ferma al tempo massimo con la migliore che ha trovato, e qualche
   servizio può restare fuori. A quel punto la domanda non è più "qual è la giornata migliore"
   — quella è già decisa — ma una molto più piccola: "con quello che è avanzato, riesco a
   coprire questi tre?".
   È lo stesso identico meccanismo, su un cubo minuscolo: asse X le catene fatte SOLO di
   servizi scoperti, asse Y gli autisti rimasti liberi, asse Z i mezzi rimasti in rimessa.
   Poche migliaia di celle invece di milioni, e su quelle si arriva in fondo davvero — non si
   tronca, si conclude. Quello che era già assegnato non si tocca. */
/* ═══ PERCHÉ UNO SCOPERTO È SCOPERTO ═══
   Due cause diverse, e due rimedi diversi. O non esiste nessuna combinazione sopra soglia — e
   allora il rimedio è cedere qualche punto — oppure ne esistono, con autista e mezzo ancora
   liberi, e la ricerca semplicemente non ci è arrivata: lì serve il mini-cubo. Distinguerle a
   occhio è impossibile, e sceglere il rimedio sbagliato fa perdere tempo. */
function diagnosiScoperti(S){
  const out={soglia:[],ricerca:[],occupati:[]};
  const coperti=new Set(); (S&&S.best||[]).forEach(b=>b.cat.ids.forEach(i=>coperti.add(i)));
  for(const sv of servizi()){
    if(coperti.has(sv.id))continue;
    const d=percheFuori(sv.id,S);
    if(!d.sopra)out.soglia.push(sv.id);
    else if(d.libere)out.ricerca.push(sv.id);
    else out.occupati.push(sv.id);
  }
  return out;
}

function inventarioMini(S){
  const coperti=new Set(); (S&&S.best||[]).forEach(b=>b.cat.ids.forEach(i=>coperti.add(i)));
  const scoperti=servizi().filter(s=>!coperti.has(s.id)).map(s=>s.id);
  const autUsati=new Set((S&&S.best||[]).map(b=>b.d.n));
  const vehUsati=new Set(); (S&&S.best||[]).forEach(b=>b.targhe.forEach(t=>vehUsati.add(t)));
  /* ═══ IL MINI-CUBO LEGGE DAL CUBO, NON DALLA LISTA POTATA ═══
     Qui stava il paradosso: l'inventario contava sulle opzioni già scremate per la ricerca
     grande, e quella scrematura tiene il meglio di ogni autista ma non il meglio di ogni
     MEZZO. Un autista libero il cui migliore accostamento usa un furgone già impegnato
     spariva, anche se con un altro furgone — libero — sarebbe andato benissimo. Risultato:
     "nessuna combinazione" in cima e "47 sarebbero libere" tre righe sotto.
     Il mini-cubo è piccolo per definizione: non ha bisogno di potature. Guarda il cubo. */
  const dentro=new Set(scoperti);
  const C=cubo();
  let catene=0, celle=0;
  const aut=new Set(), veh=new Set();
  for(let xi=0;xi<C.X.length;xi++){
    const cat=C.X[xi];
    if(!cat.ids.every(id=>dentro.has(id)))continue;
    let n=0;
    for(let yi=0;yi<AUTISTI.length;yi++){
      if(autUsati.has(AUTISTI[yi].n))continue;
      for(let zi=0;zi<C.Z[xi].length;zi++){
        const sch=C.Z[xi][zi];
        if(sch.targhe.some(t=>vehUsati.has(t)))continue;
        if(!cel(xi,yi,zi).sopra)continue;
        n++; aut.add(AUTISTI[yi].n); sch.targhe.forEach(t=>veh.add(t));
      }
    }
    if(n){catene++; celle+=n;}
  }
  return{scoperti,autUsati,vehUsati,catene,celle,
         autLiberi:AUTISTI.length-autUsati.size, vehLiberi:VEICOLI.length-vehUsati.size,
         autUtili:aut.size, vehUtili:veh.size};
}
/* lo esegue e lo attacca alla soluzione, senza toccare quello che era già assegnato */
function applicaMini(S,ms){
  const inv=inventarioMini(S);
  if(!inv.scoperti.length)return{niente:'non c\'è niente di scoperto'};
  if(!inv.catene)return{niente:'con gli autisti e i mezzi rimasti non esiste nessuna combinazione sopra soglia per questi servizi',inv};
  const r=miniCubo(inv.scoperti,inv.autUsati,inv.vehUsati,ms||8000);
  if(!r.scelte.length)return{niente:'il mini-cubo non ha trovato nessun incastro possibile',inv,r};
  const best=(S.best||[]).concat(r.scelte);
  if(!coerente(best))return{niente:'la combinazione trovata copriva due volte lo stesso servizio: scartata',inv,r};
  const cop=new Set(); best.forEach(b=>b.cat.ids.forEach(i=>cop.add(i)));
  return{inv,r,nuova:Object.assign({},S,{
    best, bestCop:cop.size,
    bestTot:Math.round(best.reduce((a,b)=>a+b.val*b.cat.ids.length,0)),
    scoperti:servizi().filter(s=>!cop.has(s.id)).map(s=>s.id)})};
}

/* ═══ DALLO A LUI, E RIFAI IL RESTO ═══
   Si prende il servizio rimasto fuori e lo si mette in mano al candidato indicato, punto e
   basta. Le catene che quel candidato — o uno dei suoi mezzi — teneva occupate si sciolgono,
   e i servizi che ci stavano dentro tornano liberi. Su quelli, e solo su quelli, si rifà il
   conto con chi è rimasto disponibile. Tutto il resto della giornata non viene toccato. */
/* ═══ UNA GIORNATA NON PUÒ COPRIRE DUE VOLTE LO STESSO SERVIZIO ═══
   Sembra ovvio, e infatti è il genere di cosa che scivola: se la catena che si forza contiene
   un servizio già coperto da un'altra, e quell'altra non viene sciolta, il servizio finisce
   in due catene e il suo punteggio si somma due volte. Il totale sale, la giornata sembra
   migliorata, e invece è impossibile. Quindi si controlla, sempre, prima di tenere una mossa. */
function coerente(best){
  const visti=new Set();
  for(const b of best)for(const id of b.cat.ids){
    if(visti.has(id))return false;
    visti.add(id);
  }
  return true;
}
function scambioMirato(S,scelta,ms){
  const prima={cop:S.bestCop,tot:S.bestTot};
  const c=scelta.c;
  /* si scioglie chi usa lo stesso autista, chi usa uno degli stessi mezzi, e — ed è la parte
     che mancava — chi copre uno dei servizi che la catena forzata si porta dietro */
  const tolte=(S.best||[]).filter(b=>
    b.d.n===c.d.n ||
    b.targhe.some(t=>c.targhe.includes(t)) ||
    b.cat.ids.some(id=>c.cat.ids.includes(id)));
  const tenute=(S.best||[]).filter(b=>!tolte.includes(b));
  /* i servizi che tornano liberi: quelli delle catene sciolte, più quelli già scoperti */
  const liberi=new Set();
  tolte.forEach(b=>b.cat.ids.forEach(id=>liberi.add(id)));
  (S.scoperti||[]).forEach(id=>liberi.add(id));
  scelta.cat.ids.forEach(id=>liberi.delete(id));
  /* e le risorse che restano: quelle che nessuna catena tenuta, né la nuova, sta usando */
  const aut=new Set(), veh=new Set();
  [...tenute,c].forEach(b=>{aut.add(b.d.n); b.targhe.forEach(t=>veh.add(t));});
  const mini=miniCubo([...liberi],aut,veh,ms||3000);
  const best=[...tenute,c,...mini.scelte];
  if(!coerente(best))return{nuova:S,prima,dopo:prima,sciolte:[],rifatti:[],completo:false,
                            meglio:false,rotta:true};
  const copre=new Set(); best.forEach(b=>b.cat.ids.forEach(id=>copre.add(id)));
  const nuova={...S, best,
    bestCop:copre.size,
    bestTot:Math.round(best.reduce((a,b)=>a+b.val*b.cat.ids.length,0)),
    scoperti:servizi().filter(s=>!copre.has(s.id)).map(s=>s.id),
    ripresa:false};
  return{nuova, prima, dopo:{cop:nuova.bestCop,tot:nuova.bestTot},
         sciolte:tolte.map(b=>b.cat.id), rifatti:[...liberi],
         completo:mini.completo,
         meglio: nuova.bestCop>prima.cop || (nuova.bestCop===prima.cop&&nuova.bestTot>prima.tot)};
}

const $=q=>document.querySelector(q);
const $$=q=>[...document.querySelectorAll(q)];
let FASE='prg', XSEL=0, QSEL='cli', VISTA='griglia';
const PNI={a:'',b:''};

/* ══════════ TROVARE UNA CATENA FRA CENTINAIA ══════════
   Cinquecento catene in un menu a tendina non sono consultabili: si scorre alla cieca. Qui
   invece si cerca. Il campo di testo guarda dentro tutto — il codice della catena, quello dei
   servizi, gli orari, i clienti, i passeggeri, i percorsi — e i filtri restringono per numero
   di servizi, per autista, per mezzo, per esito. I filtri valgono in tutte e tre le fasi:
   quello che trovi in Fase 1 te lo ritrovi già scelto in Fase 2 e in Fase 3. */
const FIL={q:'',len:'',svc:'',drv:'',veh:'',cambio:'',esito:'',ord:'best'};
function catFiltrate(){
  const C=cubo(), out=[];
  const q=FIL.q.trim().toLowerCase(), parole=q?q.split(/\s+/):[];
  for(let xi=0;xi<C.X.length;xi++){
    const cat=C.X[xi], st=C.stat[xi], Z=C.Z[xi];
    if(parole.length&&!parole.every(w=>cat.cerca.includes(w)))continue;
    if(FIL.len){ const k=cat.svc.length;
      if(FIL.len==='3+'?k<3:k!==+FIL.len)continue; }
    if(FIL.svc&&!cat.ids.includes(FIL.svc))continue;
    if(FIL.cambio==='si'&&!st.cambi)continue;
    if(FIL.cambio==='no'&&st.cambi===Z.length)continue;
    if(FIL.esito==='ok'&&!st.ok)continue;
    if(FIL.esito==='ko'&&st.ok)continue;
    if(FIL.veh&&!Z.some(s=>s.targhe.includes(FIL.veh)))continue;
    if(FIL.drv){
      const yi=AUTISTI.findIndex(d=>d.n===FIL.drv);
      let c=false;
      for(let z=0;z<Z.length&&!c;z++){const cc=cel(xi,yi,z); if(!cc.blocco)c=true;}
      if(!c)continue;
    }
    out.push(xi);
  }
  const C2=C;
  out.sort((a,b)=>{
    if(FIL.ord==='best')return (C2.stat[b].best)-(C2.stat[a].best)||a-b;
    if(FIL.ord==='len') return C2.X[b].svc.length-C2.X[a].svc.length||a-b;
    if(FIL.ord==='ok')  return C2.stat[b].ok-C2.stat[a].ok||a-b;
    if(FIL.ord==='ora') return C2.X[a].da-C2.X[b].da||a-b;
    return a-b;
  });
  return out;
}
/* la barra dei filtri, uguale in tutte le fasi */
function barraFiltri(idp){
  const C=cubo();
  const opt=(v,l,sel)=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`;
  return `<div class="filtri">
    <input type="text" id="${idp}q" class="fq" placeholder="cerca: s7, 17:20, W3, Camisassi, Sorrento…" value="${esc(FIL.q)}">
    <select id="${idp}len">${opt('','servizi: tutti',FIL.len)}${opt('1','1 servizio',FIL.len)}${opt('2','2 servizi',FIL.len)}${opt('3+','3 o più',FIL.len)}</select>
    <select id="${idp}svc">${opt('','contiene: qualsiasi',FIL.svc)}${servizi().map(s=>opt(s.id,'contiene '+s.id+' · '+s.ora,FIL.svc)).join('')}</select>
    <select id="${idp}drv">${opt('','autista: qualsiasi',FIL.drv)}${AUTISTI.map(d=>opt(d.n,'può farla '+d.n,FIL.drv)).join('')}</select>
    <select id="${idp}veh">${opt('','mezzo: qualsiasi',FIL.veh)}${VEICOLI.map(v=>opt(v.t,'usa '+v.t,FIL.veh)).join('')}</select>
    <select id="${idp}cambio">${opt('','cambio mezzo: indifferente',FIL.cambio)}${opt('si','ha uno schema con cambio',FIL.cambio)}${opt('no','solo schemi a un mezzo',FIL.cambio)}</select>
    <select id="${idp}esito">${opt('','esito: qualsiasi',FIL.esito)}${opt('ok','giocabile (almeno una sopra soglia)',FIL.esito)}${opt('ko','nessuna sopra soglia',FIL.esito)}</select>
    <select id="${idp}ord">${opt('best','ordina: dal punteggio più alto',FIL.ord)}${opt('ora','dalla prima del giorno',FIL.ord)}${opt('len','dalla più lunga',FIL.ord)}${opt('ok','da chi ha più scelte',FIL.ord)}${opt('id','per codice',FIL.ord)}</select>
    <button class="btn" id="${idp}reset">Azzera</button>
  </div>`;
}
function legaFiltri(idp,dopo){
  const g=(k)=>{const e=$('#'+idp+k); if(e)e.onchange=()=>{FIL[k]=e.value;dopo();};};
  ['len','svc','drv','veh','cambio','esito','ord'].forEach(g);
  const q=$('#'+idp+'q');
  if(q){ let t=null;
    q.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{FIL.q=q.value;dopo();},220); };
    q.onkeydown=e=>{ if(e.key==='Enter'){clearTimeout(t);FIL.q=q.value;dopo();} }; }
  const r=$('#'+idp+'reset');
  if(r)r.onclick=()=>{ Object.assign(FIL,{q:'',len:'',svc:'',drv:'',veh:'',cambio:'',esito:'',ord:'best'}); dopo(); };
}
/* il selettore della catena, che pesca solo fra quelle filtrate */
function sceltaCatena(idp,lista){
  const C=cubo();

    }).join('')}</select>

  </div>`;
}
function legaScelta(idp,lista,dopo){
  const s=$('#'+idp+'sel'); if(s)s.onchange=()=>{XSEL=+s.value;dopo();};
  const p=$('#'+idp+'prec'), n=$('#'+idp+'succ'), i=lista.indexOf(XSEL);
  if(p)p.onclick=()=>{ if(i>0){XSEL=lista[i-1];dopo();} };
  if(n)n.onclick=()=>{ if(i<lista.length-1){XSEL=lista[i+1];dopo();} };
}

/* ogni qualità si misura sulla sua soglia */
/* ═══ LE SOGLIE DI OGGI ═══
   Le soglie generali sono la politica dell'azienda e non si cambiano per una giornata storta.
   Ma una giornata storta capita, e allora si cede qualcosa — solo lì, solo per quel giorno, e
   resta scritto. Domani la politica torna quella. */
let SOGLIE_GG={};
const sogGG=()=>SOGLIE_GG[GIORNO]||null;
const sog=q=>{const g=sogGG(); return (g&&g[q]!=null?g[q]:CFG.soglie[q])||0;};
const sogVIP=()=>{const g=sogGG(); return g&&g.vip!=null?g.vip:(+CFG.sogliaVIP||0);};
function segnaSoglia(q,v){
  const g=SOGLIE_GG[GIORNO]||(SOGLIE_GG[GIORNO]={});
  if(v==null)delete g[q]; else g[q]=v;
  if(!Object.keys(g).length)delete SOGLIE_GG[GIORNO];
  CUBO=null; SOL=null;
}

const bocciata=(qc,qa,qu,qVIP)=>[qc<sog('cli')&&'Cliente',qa<sog('azi')&&'Parco',qu<sog('aut')&&'Autista',
  (qVIP!=null&&qVIP<sogVIP())&&('il VIP sta a '+qVIP+', sotto '+sogVIP())]

const banda=(v,q)=>{const S=q?sog(q):Math.min(sog('cli'),sog('azi'),sog('aut'));

/* ══════════════════ CONFIGURAZIONE ══════════════════
   Tutti i numeri che decidono stanno qui, raggruppati come li hai raggruppati tu: per qualità,
   e dentro ogni qualità per famiglia. Nient'altro sta nascosto nel codice. */
/* ══════════════════ I CRITERI ══════════════════
   I pesi, e basta: tre colonne, una per qualità, ognuna con la sua soglia in testa. Tutto il
   resto — tempi, strada, contratto — sta in Configurazione, perché sono parametri del mondo e
   non giudizi su cosa conta. */
function vCriteri(){
  const rigaCrit=k=>{
    const c=CRIT[k];
    const campo=c.liv
      ? c.liv.map((x,i)=>`<span class="lvl"><em>${esc(etLiv(k,i))}</em>
          <input type="number" min="0" max="200" value="${x}" data-k="${k}" data-i="${i}"></span>`).join('')
      : `<input type="number" min="0" max="200" value="${c.p}" data-k="${k}">
         <span class="u">${c.ogni?'/ '+c.ogni:''}</span>`;
    return `<tr${c.spento?' class="off"':''}>
      <td><label class="sw" title="${c.spento?'spento: non entra nel conto':'acceso'}">
          <input type="checkbox" data-on="${k}"${c.spento?'':' checked'}><i></i></label>
        <b>${esc(c.t)}</b><em>${esc(c.d)}</em></td>
      <td class="rt">${campo}</td></tr>`;
  };
  const gruppo=q=>CRIT_G[q].map(g=>{
    const ks=Object.keys(CRIT).filter(k=>CRIT[k].q.includes(q)&&CRIT[k].g===g);
    if(!ks.length)return '';
    return `<tr class="hd"><td colspan="2">${esc(g)}</td></tr>`+ks.map(rigaCrit).join('');
  }).join('');
  return `<h2>Criteri</h2>
  <div class="cols3">
    ${['cli','azi','aut'].map(q=>`<section class="card q-${q}">
      <header><h3>${QLBL[q]}</h3>
        <div class="par inline"><label class="lb">soglia</label>
          <input type="number" id="p_sog_${q}" value="${CFG.soglie[q]}">
          ${q==='cli'?`<label class="lb" style="margin-left:10px">se VIP</label>
            <input type="number" id="p_sogVIP" value="${CFG.sogliaVIP}">`:''}</div></header>
      <table class="crit"><tbody>${gruppo(q)}</tbody></table>
    </section>`).join('')}
  </div>`;
}

function bindCfg(){
  legaIndirizzi($('#main'));
  const rim=$('#cfg_rim');
  if(rim)rim.onchange=()=>{ CFG.rimessaInd=rim.value.trim(); tocca(); };
  const ak=$('#cfg_api');
  if(ak)ak.onchange=()=>{ CFG.apiKey=ak.value.trim(); tocca(); };
  const cp=$('#pkCopy');
  if(cp)cp.onclick=()=>{ const t=$('#pkOut'); t.select();
    try{document.execCommand('copy'); $('#pkMsg').textContent='copiato';}catch(e){} };
  const pl=$('#pkLoad');
  if(pl)pl.onclick=()=>{ const err=apriPacchetto(($('#pkIn')||{}).value||'');
    if(err){$('#pkErr').innerHTML='<b class="er">'+esc(err)+'</b>';return;}
    tocca(); disegna(); };
  /* i punti dei criteri */
  $$('#main input[data-on]').forEach(inp=>inp.onchange=()=>{
    CRIT[inp.dataset.on].spento=inp.checked?0:1; tocca();
  });
  $$('#main input[data-k]').forEach(inp=>inp.onchange=()=>{
    const k=inp.dataset.k, i=inp.dataset.i, v=Math.max(0,+inp.value||0);
    if(i!=null&&CRIT[k].liv)CRIT[k].liv[+i]=v; else CRIT[k].p=v;
    tocca();
  });
  const num=(id,f)=>{const e=$('#'+id); if(e)e.onchange=()=>{ f(+e.value||0); tocca(); };};
  ['cli','azi','aut'].forEach(q=>num('p_sog_'+q,v=>CFG.soglie[q]=Math.max(0,Math.min(100,v))));
  num('p_sogVIP',v=>CFG.sogliaVIP=Math.max(0,Math.min(100,v)));
  [['traffico',v=>CFG.traffico=Math.max(0,v)],['anticipo',v=>CFG.anticipo=Math.max(0,v)],
   ['comprMax',v=>CFG.comprMax=Math.max(0,Math.min(1,v))],['rimessa',v=>CFG.rimessa=Math.max(0,v)],
   ['rimessaKm',v=>CFG.rimessaKm=Math.max(0,v)],['trasfMin',v=>CFG.trasfMin=Math.max(0,v)],
   ['ampKm',v=>CFG.ampKm=Math.max(0,v)],['ampOra',v=>CFG.ampOra=Math.max(0,v)],
   ['doganaEur',v=>CFG.doganaEur=Math.max(0,v)],['turno',v=>CFG.turno=Math.max(1,v)],
   ['turnoMax',v=>CFG.turnoMax=Math.max(0,v)],['nottSett',v=>CFG.nottSett=Math.max(0,v)],
   ['maxCat',v=>CFG.maxCat=Math.max(0,v)],['maxSchemi',v=>CFG.maxSchemi=Math.max(1,v)],
   ['cambioMin',v=>CFG.cambioMin=Math.max(0,v)],['maxCambi',v=>CFG.maxCambi=Math.max(0,v)],['altPerCatena',v=>CFG.altPerCatena=Math.max(1,v)],
   ['altPerAutista',v=>CFG.altPerAutista=Math.max(1,v)],['msRicerca',v=>CFG.msRicerca=Math.max(500,v)],
   ['msMini',v=>CFG.msMini=Math.max(500,v)],
   ['oreHD',v=>CFG.oreHD=Math.max(0,v)],['oreFD',v=>CFG.oreFD=Math.max(0,v)],
   ['oreTour',v=>CFG.oreTour=Math.max(0,v)]
  ].forEach(([id,f])=>num('p_'+id,f));
  [0,1,2].forEach(i=>num('p_co'+i,v=>{ const F=(CFG.corteOre||[1,2,4]).slice();
    F[i]=Math.max(0,v); for(let k=1;k<3;k++)if(F[k]<=F[k-1])F[k]=F[k-1]+0.5; CFG.corteOre=F; }));
  ['nottDa','nottA','nottVeicDa','nottVeicA'].forEach(k=>{const e=$('#p_'+k); if(e)e.onchange=()=>{CFG[k]=e.value;tocca();};});
  ['volo','treno','nave','tra','dis'].forEach(k=>num('rit_'+k,v=>{CFG.ritardo=CFG.ritardo||{};CFG.ritardo[k]=Math.max(0,v);}));
  PRESTIGI.forEach(k=>num('pr_'+k,v=>{CFG.prestigio=CFG.prestigio||{};CFG.prestigio[k]=Math.max(0,v);}));
  (CFG.extraFasce||[]).forEach((f,i)=>num('ef_'+i,v=>{
    const F=CFG.extraFasce.slice(); F[i]=Math.max(0,v)/100;
    for(let k=1;k<F.length;k++)if(F[k]<=F[k-1])F[k]=F[k-1]+0.01;
    CFG.extraFasce=F;}));
}

  const cat=X[XSEL];
  const perLen={}; X.forEach(c=>perLen[c.svc.length]=(perLen[c.svc.length]||0)+1);
  const Z=C.Z[XSEL];
  /* ═══ TRE STATI, NON DUE ═══
     Il pallino pieno diceva soltanto "nessun vincolo fisso", e si prestava a essere letto
     come "questa combinazione va bene". Non è la stessa cosa: una cella può essere
     perfettamente possibile e cadere lo stesso, perché una delle tre qualità sta sotto la
     soglia. Adesso i tre casi si distinguono a colpo d'occhio. */
  let valide=0,bloc=0,sotto=0;
  const griglia=AUTISTI.map((d,yi)=>{
    const tds=Z.map((sch,zi)=>{
      const c=cel(XSEL,yi,zi);
      if(c.blocco){bloc++;
        return `<td class="cell x" data-y="${yi}" data-z="${zi}"
          title="${esc(sch.id)} — vincolo fisso: ${esc(c.blocco)}">✕</td>`;}
      if(!c.sopra){sotto++;
        return `<td class="cell md" data-y="${yi}" data-z="${zi}"
          title="${esc(sch.id)} — possibile, ma sotto soglia su ${bocciata(c.qc,c.qa,c.qu,c.qVIP)} · ${c.qc}/${c.qa}/${c.qu} contro ${sog('cli')}/${sog('azi')}/${sog('aut')}">○</td>`;}
      valide++;
      return `<td class="cell hi" data-y="${yi}" data-z="${zi}"
        title="${esc(sch.id)} — sopra soglia · ${c.qc}/${c.qa}/${c.qu}">●</td>`;
    }).join('');
    return `<tr><td class="rw">${esc(d.n)}</td>${tds}</tr>`;
  }).join('');
  return `<h2>Fase 2 · Catene</h2>
  <div class="kpi">
    <div><i>catene generate</i><b>${X.length}</b><em>asse X</em></div>
    <div><i>autisti</i><b>${AUTISTI.length}</b><em>asse Y</em></div>
    <div><i>schemi veicolari</i><b>${C.Z.reduce((a,z)=>a+z.length,0)}</b><em>asse Z · di cui ${C.nCambi} con un cambio</em></div>
    <div><i>celle totali</i><b>${C.nTot.toLocaleString('it')}</b><em>costruite in ${C.ms} ms</em></div>
    <div><i>lunghezze</i><b>${Object.keys(perLen).sort().map(k=>k+'→'+perLen[k]).join(' · ')}</b><em>servizi per catena → quante</em></div>
  </div>

  <h3>Trova una catena</h3>
  ${barraFiltri('f1_')}
  <p class="mut" style="font-size:12px;margin:-4px 0 10px">
    <b class="cy">${lista.length}</b> catene su ${X.length}${lista.length<X.length?' · i filtri restano anche in Fase 2 e 3':''}</p>
  <div class="card" style="padding:0;max-height:420px;overflow:auto"><table>
   <thead><tr><th>Catena</th><th>Servizi</th><th>Dalla rimessa</th><th class="n">Arco</th><th class="n">Km</th>
     <th class="n">Pax max</th><th>Richieste</th><th class="n">Schemi</th>
     <th class="n">Celle valide</th><th class="n">Migliore</th><th>Chi la farebbe</th></tr></thead><tbody>
   ${lista.slice(0,300).map(i=>{
     const c=X[i], st=C.stat[i];
     const ok=st.ok+st.sotto;
     const tg=Object.keys(CLASSI).find(k=>CLASSI[k]===c.taglia);
     return `<tr data-x="${i}" style="cursor:pointer${i===XSEL?';background:rgba(61,218,215,.08)':''}">
       <td class="cy"><b>${c.id}</b></td>
       <td>${c.svc.map(s=>`<span class="pill">${s.id} ${s.ora}</span>`).join(' ')}</td>
       <td class="mut" style="white-space:nowrap">${m2t(c.da)}–${m2t(c.a)}</td>
       <td class="n">${n1(c.arcoMin/60)}h</td><td class="n">${c.km}</td>
       <td class="n">${c.pax}</td>
       <td>${[c.vip&&'VIP',c.lux&&'Luxury',c.svc.some(s=>s.tveh!=='Auto')&&tg].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join(' ')||'<span class="mut">—</span>'}</td>
       <td class="n mut">${st.nZ}${st.cambi?' <span class="cy">+'+st.cambi+'</span>':''}</td>
       <td class="n ${ok?'ok':'er'}">${ok}</td>
       <td class="n ${st.best<0?'mut':banda(st.best)}"><b>${st.best<0?'—':st.best}</b></td>
       <td>${st.bY>=0?`<span class="lnk" data-cell="${i},${st.bY},${st.bZ}">${esc(AUTISTI[st.bY].n)} <span class="mut">· ${esc(C.Z[i][st.bZ].id)}</span></span>`:'<span class="mut">—</span>'}</td></tr>`;}).join('')}
   </tbody></table></div>
  <p class="legend">clicca una riga per aprire la catena · clicca il nome nell'ultima colonna per andare
    dritto al conto di quella cella${lista.length>300?' · mostrate le prime 300, restringi la ricerca per vedere le altre':''}</p>

  <h3>Piano Y × Z della catena ${cat.id} <span class="mut" style="text-transform:none;letter-spacing:0">
     ${cat.svc.map(s=>s.id+' '+s.ora).join(' → ')}</span></h3>
  <div class="card" style="padding:0">
   <div class="slice"><table>
    <thead><tr><th class="rw">autista \\ schema veicolare</th>
      ${Z.map(s=>`<th class="n"><div class="vhead"${s.cambi?' style="color:var(--lk)"':''}>${esc(s.id)}</div></th>`).join('')}</tr></thead>
    <tbody>${griglia}</tbody></table></div></div>
  <p class="legend">
    <b class="ok">●</b> passa la soglia (${valide}) &nbsp;
    <b class="wr">○</b> possibile, ma almeno una qualità sta sotto la sua soglia — ${sog('cli')} cliente,
      ${sog('azi')} parco, ${sog('aut')} autista (${sotto}) &nbsp;
    <span class="mut">✕</span> fermata da un vincolo fisso (${bloc})
    <br>Il cerchio vuoto non è un errore del contesto: quella combinazione si può fare, ma costa troppo.
    Passa il mouse per vedere i tre numeri, clicca per il conto intero.
    <span class="cy">In azzurro</span> gli schemi con un cambio di mezzo.</p>`;
}

/* ── FASE 2 · I TRE CUBI ── */
function valCella(c,q){ return q==='cli'?c.qc:q==='azi'?c.qa:q==='aut'?c.qu:c.media; }

function grigliaCubo(xi,q,soloSopra){
  const C=cubo();
  return AUTISTI.map((d,yi)=>{
    const tds=C.Z[xi].map((sch,zi)=>{
      const c=cel(xi,yi,zi);
      const val=valCella(c,q);
      /* il numero grezzo si vede comunque: anche dove un vincolo fisso rende la cella
         inutilizzabile, il conto esiste ed è giusto poterlo leggere */
      if(c.blocco)return `<td class="cell x" data-x="${xi}" data-y="${yi}" data-z="${zi}"
        style="text-decoration:line-through" title="${esc(sch.id)} — vincolo fisso: ${esc(c.blocco)} · il conto sarebbe ${c.qc}/${c.qa}/${c.qu}">${val}</td>`;
      const fuori=!c.sopra;
      if(soloSopra&&fuori)return `<td class="cell x" data-x="${xi}" data-y="${yi}" data-z="${zi}"
        style="text-decoration:line-through"
        title="scartata: sotto soglia su ${bocciata(c.qc,c.qa,c.qu,c.qVIP)} · ${c.qc}/${c.qa}/${c.qu} contro ${sog('cli')}/${sog('azi')}/${sog('aut')}">${val}</td>`;
      return `<td class="cell ${banda(val,q)}" data-x="${xi}" data-y="${yi}" data-z="${zi}"
        style="${fuori?'text-decoration:line-through;opacity:.65':''}"
        title="${esc(d.n)} · ${esc(sch.id)} → cliente ${c.qc} · parco ${c.qa} · autista ${c.qu}">${val}</td>`;
    }).join('');
    return `<tr><td class="rw">${esc(d.n)}</td>${tds}</tr>`;
  }).join('');
}

function vF2(){
  const C=cubo(), X=C.X;
  if(XSEL>=X.length)XSEL=0;
  const lista=catFiltrate();
  if(lista.length&&!lista.includes(XSEL))XSEL=lista[0];
  const cat=X[XSEL];
  const q=QSEL;
  const tabQ=[['cli','Qualità Cliente','qc'],['azi','Qualità Parco','qa'],['aut','Qualità Autista','qu']];
  /* conteggi della catena scelta */
  const Z=C.Z[XSEL];
  let bl=0,so=0,ok=0;
  for(let y=0;y<AUTISTI.length;y++)for(let z=0;z<Z.length;z++){
    const c=cel(XSEL,y,z);
    if(c.blocco)bl++; else if(!c.sopra)so++; else ok++;
  }
  const vista = VISTA==='tre'
   ? `<div class="row">${tabQ.map(([k,lab])=>`
      <div class="card" style="padding:0;min-width:300px;flex:1">
        <div style="padding:8px 12px;border-bottom:1px solid var(--line)"><b class="${k==='cli'?'cy':k==='azi'?'vi':'wr'}">${lab}</b></div>
        <div class="slice" style="max-height:52vh"><table>
         <thead><tr><th class="rw" style="min-width:120px">Y \\ Z</th>
           ${Z.map(s=>`<th class="n"><div class="vhead"${s.cambi?' style="color:var(--lk)"':''}>${esc(s.id)}</div></th>`).join('')}</tr></thead>
         <tbody>${grigliaCubo(XSEL,k,false)}</tbody></table></div></div>`).join('')}</div>`
   : VISTA==='pila'
   ? `<div class="card"><div class="stack">${X.slice(0,14).map((c2,i)=>`
        <div class="lay" title="${c2.id} · ${c2.svc.map(s=>s.id).join(' → ')}" data-x="${i}">
         <table>${AUTISTI.map((d,y)=>`<tr>${cubo().Z[i].map((sch,z)=>{
           const cc=cel(i,y,z);
           const col=cc.blocco?'#1b2431':!cc.sopra?'#4a2530':
             (v2=>v2>=80?'#5ee6a8':v2>=65?'#3ddad7':v2>=50?'#ffb454':'#ff6b6b')(valCella(cc,q));
           return `<td style="background:${col}"></td>`;}).join('')}</tr>`).join('')}</table>
         <div style="text-align:center;font-size:9px;color:var(--m2);margin-top:3px">${c2.id}</div></div>`).join('')}
      </div><p class="legend">le prime ${Math.min(14,X.length)} fette del cubo, una per catena · ogni quadretto è una coppia autista-veicolo
      <i style="background:#5ee6a8"></i>alto <i style="background:#ffb454"></i>vicino soglia
      <i style="background:#4a2530"></i>sotto soglia <i style="background:#1b2431"></i>impossibile</p></div>`
   : `<div class="card" style="padding:0">
       <div class="slice"><table>
        <thead><tr><th class="rw">autista \\ schema veicolare</th>
          ${Z.map(s=>`<th class="n"><div class="vhead"${s.cambi?' style="color:var(--lk)"':''}>${esc(s.id)}<br>
            <span class="mut">${s.cambi?'un cambio':gamma(s.vv[0])+' · '+s.vv[0].px+'p'}</span></div></th>`).join('')}</tr></thead>
        <tbody>${grigliaCubo(XSEL,q,false)}</tbody></table></div></div>`;

  return `<h2>Fase 3 · Cubi</h2>

  <div class="kpi">
    <div><i>celle di questa catena</i><b>${bl+so+ok}</b><em>${AUTISTI.length} autisti × ${Z.length} schemi</em></div>
    <div><i>fermate dai vincoli</i><b class="mut">${bl}</b><em>impossibili</em></div>
    <div><i>sotto soglia</i><b class="er">${so}</b><em>${sog('cli')} cliente · ${sog('azi')} parco · ${sog('aut')} autista</em></div>
    <div><i>sopravvissute</i><b class="ok">${ok}</b><em>vanno in fase 3</em></div>
    <div><i>in tutto il cubo</i><b>${C.nOk}</b><em>su ${C.nTot} celle</em></div>
  </div>

  ${barraFiltri('f2_')}
  ${sceltaCatena('f2_',lista)}
  <div class="cubebar">
    ${tabQ.map(([k,lab])=>`<button class="btn qbtn ${q===k?'on':''}" data-q="${k}">${lab}</button>`).join('')}
    <button class="btn qbtn ${q==='med'?'on':''}" data-q="med">Media</button>
    <span style="width:12px"></span>
    <span class="mut" style="font-size:11.5px">vista</span>
    ${[['griglia','una qualità'],['tre','tutte e tre'],['pila','il cubo in pila']].map(([v,l])=>
      `<button class="btn vbtn ${VISTA===v?'on':''}" data-v="${v}">${l}</button>`).join('')}
  </div>

  <p class="mut" style="font-size:12px;margin:-4px 0 12px">
    <b class="cy">${cat.id}</b> · ${cat.svc.map(s=>esc(s.id+' '+s.ora+' '+s.dove)).join(' &nbsp;→&nbsp; ')}
    &nbsp;·&nbsp; arco ${n1(cat.arcoMin/60)}h dalla rimessa alla rimessa</p>

  ${vista}
  <p class="legend">i numeri barrati non passano in fase 3 — o perché una qualità sta sotto soglia, o perché
    un vincolo fisso li rende impossibili. Il numero resta scritto lo stesso: il conto esiste, ed è giusto vederlo.
    <i style="background:var(--ok)"></i>largo sopra la sua soglia <i style="background:var(--wr)"></i>appena sopra
    <i style="background:var(--er)"></i>sotto — le soglie sono ${sog('cli')} cliente, ${sog('azi')} parco,
    ${sog('aut')} autista, e ogni colonna si misura sulla propria</p>`;
}

/* ── il dettaglio di una cella ── */
function apriCella(xi,yi,zi){
  const c=celPiena(xi,yi,zi);
  const rig=(m)=>`<div class="mal"><span>${esc(m.t)}
      <em>${esc(m.det||'')}${m.serv?' · '+m.serv:''}</em>
      <em><code>${m.cfg} pt${m.scatti?' × '+m.scatti+' scatti':''}${m.magg?' × maggiorazione +'+m.magg+'%':''} = ${m.pts}</code></em></span>
    <b class="er" style="white-space:nowrap">−${m.pts}</b></div>`;
  const perQ=q=>{
    const righe=c.M.filter(m=>m.q.includes(q));
    const P=c.perQ[q];
    return `<h3 style="margin-top:18px">${QLBL[q]}</h3>
      ${righe.length?righe.map(rig).join(''):'<p class="mut" style="font-size:12px">nessun malus</p>'}
      <div class="tot"><span>100 − ${P.serv} <span class="mut">(${c.cat.svc.length>1
          ? (P.modo==='peggiore'?'il servizio messo peggio'+(P.quale?', '+P.quale:'')
                                :'la somma dei '+c.cat.svc.length+' servizi')
          : 'il servizio'})</span>
        − ${P.cat} <span class="mut">(catena)</span></span><b class="${banda(P.val,q)}" title="la soglia di questa qualità è ${sog(q)}">${P.val}</b></div>
      ${c.cat.svc.length>1?`<div class="mut" style="font-size:11px;text-align:right;margin-top:2px">${
        P.modo==='peggiore'
          ? 'vale il peggiore: ogni cliente guarda solo il proprio viaggio, e chi è servito male resta servito male'
          : 'si sommano: il parco e l\'autista sono gli stessi per tutta la catena, e i difetti gli si accumulano addosso'}</div>`:''}`;
  };
  const b=c.blocco;
  $('#detBody').innerHTML=`
    <h4>${esc(c.d.n)} · ${esc(c.sch.id)}</h4>
    <p class="mut" style="margin:0 0 10px;font-size:12px">${c.cat.id} · ${c.cat.svc.map((s,i)=>s.id+' '+s.ora+' <span class="cy">'+c.sch.vv[i].t+'</span>').join(' → ')}
      <br>${c.sch.targhe.map(t=>{const v=veic(t);return esc(t+' · '+v.ma+' '+v.mo+' '+v.an)+' · '+v.px+' posti · '+gamma(v);}).join('<br>')}
      ${c.sch.cambi?'<br><span class="cy">un cambio di mezzo dopo le '+c.cat.svc[c.sch.taglio-1].ora+' · '+c.sch.stacco+'′ di stacco</span>':''}</p>
    ${b?`<div class="warn"><b>Vincolo fisso:</b> ${esc(b)}<br>
        <span style="font-size:11.5px">Non è un malus: non si paga, non si può. La cella resta vuota in tutti e tre i cubi.</span></div>`:''}
    <div class="kpi" style="margin:0 0 6px">
      <div style="min-width:0;flex:1"><i>cliente · soglia ${sog('cli')}</i><b class="${banda(c.qc,'cli')}">${c.qc}</b></div>
      <div style="min-width:0;flex:1"><i>parco · soglia ${sog('azi')}</i><b class="${banda(c.qa,'azi')}">${c.qa}</b></div>
      <div style="min-width:0;flex:1"><i>autista · soglia ${sog('aut')}</i><b class="${banda(c.qu,'aut')}">${c.qu}</b></div>
      <div style="min-width:0;flex:1"><i>media</i><b>${c.media}</b></div>
    </div>
    <p class="mut" style="font-size:12px;margin:0 0 4px">
      ${b?'cella impossibile':c.sopra?'<span class="ok">sopra tutte e tre le soglie ('+sog('cli')+'/'+sog('azi')+'/'+sog('aut')+'): passa in fase 3</span>'
        :'<span class="er">sotto soglia su '+bocciata(c.qc,c.qa,c.qu,c.qVIP)+' — '+c.qc+'/'+c.qa+'/'+c.qu
          +' contro '+sog('cli')+'/'+sog('azi')+'/'+sog('aut')+': scartata da tutti e tre i cubi</span>'}</p>
    ${perQ('cli')}${perQ('azi')}${perQ('aut')}
    <h3 style="margin-top:18px">Maggiorazioni dei servizi</h3>
    ${c.cat.svc.map(s=>{const m=maggiorazione(s);
      return `<div class="mal"><span>${s.id} · ${esc(s.cli)}
        <em><code>${m.ore}h × ${CFG.ampOra} + ${m.km}km × ${CFG.ampKm} = ${m.amp} + prestigio ${m.prest} = ${m.tot}%</code></em></span>
        <b class="cy">+${m.tot}%</b></div>`;}).join('')}`;
  $('#det').classList.add('on');
}

/* ── FASE 3 · IL CUBO MEDIO E LA SOLUZIONE ── */
let SOL=null, SOL_PREC=null, MOSSE=[];
function vF3(){
  const C=cubo();
  if(!SOL||SOL.stamp!==C.fatto)return '<h2>Un momento</h2>';
  const S=SOL;
  const scoperti=S.scoperti.map(id=>SERVIZI.find(s=>s.id===id)).filter(Boolean);
  /* Non si legge dalla soluzione messa da parte: si guarda il cubo com'è ADESSO. Un elenco
     salvato può essere vecchio, e dire una cosa che le celle sotto smentiscono. */
  const senza=new Set(senzaCombinazioni());
  const lista=catFiltrate();
  if(lista.length&&!lista.includes(XSEL))XSEL=lista[0];
  const cat=C.X[XSEL];

  const tabellaMedia=`<div class="card" style="padding:0">
    <div class="slice"><table>
     <thead><tr><th class="rw">autista \\ schema veicolare</th>
       ${C.Z[XSEL].map(s=>`<th class="n"><div class="vhead"${s.cambi?' style="color:var(--lk)"':''}>${esc(s.id)}</div></th>`).join('')}</tr></thead>
     <tbody>${grigliaCubo(XSEL,'med',true)}</tbody></table></div></div>`;

  const migliori=S.opz.slice().sort((a,b)=>b.lista[0].val-a.lista[0].val).slice(0,20);

  return `<h2>Fase 4 · Soluzione</h2>

  <div class="kpi">
    <div><i>celle sopravvissute</i><b class="ok">${C.nOk.toLocaleString('it')}</b><em>su ${C.nTot.toLocaleString('it')}</em></div>
    <div><i>catene giocabili</i><b>${S.opz.length}</b><em>su ${C.X.length}</em></div>
    <div><i>servizi coperti</i><b class="${scoperti.length?'wr':'ok'}">${S.bestCop}</b>
      <em>su ${servizi().length}${S.greedy<S.bestCop?' · la prima passata ne copriva '+S.greedy:''}</em></div>
    <div><i>somma della soluzione</i><b class="${S.best&&S.best.length?'ok':'er'}">${S.best&&S.best.length?S.bestTot:'—'}</b>
      <em>${S.best&&S.best.length?S.best.length+' catene · media per servizio '+Math.round(S.bestTot/Math.max(1,S.bestCop)):'niente da assegnare'}</em></div>
    <div><i>combinazioni provate</i><b>${S.nodi.toLocaleString('it')}</b><em>${S.completo
      ?'ricerca finita in '+(S.ms/1000).toFixed(1)+' s: non esiste di meglio'
      :(S.fermato&&S.ms<(CFG.msRicerca-500)?'fermata da te':'ferma al tempo massimo')
        +' dopo '+(S.ms/1000).toFixed(1)+' s: è il meglio trovato'}</em></div>
  </div>
  <div style="margin-bottom:14px">
    <button class="btn ${S.completo?'':'on'}" id="ancora">Cerca ancora, con ${Math.round((CFG.msRicerca*4)/1000)} secondi</button>
    <button class="btn" id="rifai">Ricomincia da capo</button>
    <span class="mut" style="font-size:12px;margin-left:10px">
      ${S.ripresa?'questa soluzione è quella che avevi già trovato: i dati non sono cambiati, quindi non c\'era da rifarla · ':''}il tempo massimo si cambia in Configurazione</span>
  </div>

  ${scoperti.length?`<div class="warn">
    <b>${scoperti.length} servizi non coperti</b> nella migliore soluzione trovata:
    ${scoperti.map(s=>`<b>${s.id}</b> ${s.ora}${senza.has(s.id)?' <span class="er">(nessuna combinazione sopra soglia)</span>':''}`).join(' · ')}
    <br><span style="font-size:11.5px">${senza.size
      ? '<b>'+senza.size+'</b> di questi non hanno proprio nessuna combinazione sopra soglia: lì il problema è nei criteri o nella soglia, guardali in Fase 2. '
      : 'Tutti hanno almeno una combinazione sopra soglia: il problema non sono i criteri, è l\'incastro — autisti o mezzi che non bastano per tutti. '}
    ${S.completo?'La ricerca è finita: non esiste di meglio con questi dati.'
      :'La ricerca si è fermata al tempo massimo: prova ad alzarlo, oppure premi <i>cerca ancora</i>.'}</span></div>`:''}

  <h3 class="sep">Assegnazioni bloccate</h3>
  <div class="card">
    <p class="nota" style="margin-top:0">Un blocco non è una preferenza da pesare: è un dato,
      come una patente. La cella resta dentro al cubo coi suoi punteggi in chiaro — bloccare non
